name: Release and publish npm package

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: npm ci

      - run: npm test

      - name: Read version from package.json
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "@t0.labs/daxta@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "@t0.labs/daxta@${RELEASE_VERSION} is already published; skipping duplicate publish."
            exit 0
          fi
          npm publish
