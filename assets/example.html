      const VIEWER_EXTENSIONS = new Set(["x-viewer", "x-docs", "x-scenarios", "x-tree-segments", "x-workspace"]);
      const HTTP_EXPORT = ["get", "post", "put", "patch", "delete", "options", "head", "trace"];

      const stripExt = (value) => {
        if (Array.isArray(value)) return value.map(stripExt);
        if (!value || typeof value !== "object") return value;
        const out = {};
        for (const [key, child] of Object.entries(value)) {
          if (VIEWER_EXTENSIONS.has(key)) continue;
          out[key] = stripExt(child);
        }
        return out;
      };

      /** Path keys follow sidebar tree; real URL kept on x-daxta-url-path when remapped. */
      const exportPathFromTree = (urlPath, treeSegments) => {
        const originalParts = urlPath.split("/").filter(Boolean);
        const paramIdx = originalParts.findIndex((part) => String(part).startsWith("{"));
        const tail = paramIdx >= 0 ? originalParts.slice(paramIdx) : [];
        const treeHasParam = treeSegments.some((part) => String(part).startsWith("{"));
        const parts =
          treeSegments.length === 0
            ? originalParts
            : treeHasParam || paramIdx < 0
              ? treeSegments
              : [...treeSegments, ...tail];
        return "/" + parts.join("/");
      };

      const listOperationExamples = (operation) => {
        const byKey = new Map();
        const add = (key, summary) => {
          if (!key || byKey.has(key)) return;
          byKey.set(key, { key, summary: summary || key });
        };
        const reqExamples = operation?.requestBody?.content?.["application/json"]?.examples;
        for (const [key, example] of Object.entries(reqExamples || {})) {
          add(key, example && example.summary);
        }
        for (const response of Object.values(operation?.responses || {})) {
          const examples = response?.content?.["application/json"]?.examples;
          for (const [key, example] of Object.entries(examples || {})) {
            add(key, example && example.summary);
          }
        }
        return [...byKey.values()];
      };

      const filterExamplesMap = (examples, allowedKeys) => {
        if (!examples || typeof examples !== "object") return examples;
        if (!allowedKeys) return examples;
        const out = {};
        for (const [key, value] of Object.entries(examples)) {
          if (allowedKeys.has(key)) out[key] = value;
        }
        return out;
      };

      const filterOperationExamples = (operation, allowedKeys) => {
        if (!allowedKeys) return operation;
        const next = { ...operation };
        if (next.requestBody?.content?.["application/json"]?.examples) {
          const media = { ...next.requestBody.content["application/json"] };
          media.examples = filterExamplesMap(media.examples, allowedKeys);
          next.requestBody = {
            ...next.requestBody,
            content: { ...next.requestBody.content, "application/json": media },
          };
        }
        if (next.responses) {
          const responses = {};
          for (const [status, response] of Object.entries(next.responses)) {
            if (!response?.content?.["application/json"]?.examples) {
              responses[status] = response;
              continue;
            }
            const media = { ...response.content["application/json"] };
            media.examples = filterExamplesMap(media.examples, allowedKeys);
            responses[status] = {
              ...response,
              content: { ...response.content, "application/json": media },
            };
          }
          next.responses = responses;
        }
        return next;
      };

      /** Rename example map keys to scenario titles; set summary+description (Postman-friendly). */
      const promoteExampleLabels = (examples) => {
        if (!examples || typeof examples !== "object") return examples;
        const out = {};
        for (const [key, example] of Object.entries(examples)) {
          if (!example || typeof example !== "object") continue;
          const summary = String(example.summary || example.description || key).trim() || key;
          let name = summary;
          let n = 2;
          while (Object.prototype.hasOwnProperty.call(out, name)) {
            name = summary + " (" + n + ")";
            n += 1;
          }
          out[name] = {
            summary,
            description: summary,
            value: example.value,
          };
        }
        return out;
      };

      const promoteOperationExampleLabels = (operation) => {
        const next = { ...operation };
        if (next.requestBody?.content?.["application/json"]?.examples) {
          const media = { ...next.requestBody.content["application/json"] };
          media.examples = promoteExampleLabels(media.examples);
          next.requestBody = {
            ...next.requestBody,
            content: { ...next.requestBody.content, "application/json": media },
          };
        }
        if (next.responses) {
          const responses = {};
          for (const [status, response] of Object.entries(next.responses)) {
            const examples = response?.content?.["application/json"]?.examples;
            if (!examples) {
              responses[status] = response;
              continue;
            }
            const media = { ...response.content["application/json"] };
            media.examples = promoteExampleLabels(examples);
            const labels = Object.keys(media.examples);
            responses[status] = {
              ...response,
              // Single example: description becomes the scenario title (Postman uses this as the example name).
              description: labels.length === 1 ? labels[0] : response.description || status,
              content: { ...response.content, "application/json": media },
            };
          }
          next.responses = responses;
        }
        return next;
      };

      const toExportSpec = (source, selectedByOpId) => {
        const pathsIn = source.paths || {};
        const pathsOut = {};
        const tagNames = new Set();

        for (const [urlPath, pathItem] of Object.entries(pathsIn)) {
          if (!pathItem || typeof pathItem !== "object") continue;

          let treeSegments = null;
          for (const [method, operation] of Object.entries(pathItem)) {
            if (!HTTP_EXPORT.includes(method) || !operation || typeof operation !== "object") continue;
            treeSegments = operation["x-tree-segments"] || urlPath.split("/").filter(Boolean);
            break;
          }
          if (!treeSegments) treeSegments = urlPath.split("/").filter(Boolean);

          const exportPath = exportPathFromTree(urlPath, treeSegments);
          const itemOut = { ...(pathsOut[exportPath] || {}) };

          for (const [method, operation] of Object.entries(pathItem)) {
            if (!HTTP_EXPORT.includes(method) || !operation || typeof operation !== "object") {
              if (!HTTP_EXPORT.includes(method) && itemOut[method] === undefined) {
                itemOut[method] = stripExt(operation);
              }
              continue;
            }
            const segments = operation["x-tree-segments"] || urlPath.split("/").filter(Boolean);
            let cleaned = stripExt(operation);
            const opId = method + ":" + urlPath;
            if (selectedByOpId && selectedByOpId.has(opId)) {
              cleaned = filterOperationExamples(cleaned, selectedByOpId.get(opId));
            }
            cleaned = promoteOperationExampleLabels(cleaned);
            const tagParts = segments.filter((part) => !String(part).startsWith("{"));
            const tag = tagParts.length ? tagParts.join(" / ") : "API";
            cleaned.tags = [tag];
            cleaned["x-tree-segments"] = segments;
            tagNames.add(tag);
            if (exportPath !== urlPath) cleaned["x-daxta-url-path"] = urlPath;
            itemOut[method] = cleaned;
          }
          pathsOut[exportPath] = itemOut;
        }

        const ordered = {};
        for (const key of Object.keys(pathsOut).sort((a, b) => a.localeCompare(b))) ordered[key] = pathsOut[key];

        return {
          openapi: source.openapi || "3.0.3",
          info: stripExt(source.info) || { title: title, version: "0.0.0" },
          ...(source.servers ? { servers: stripExt(source.servers) } : {}),
          tags: [...tagNames].sort((a, b) => a.localeCompare(b)).map((name) => ({ name })),
          paths: ordered,
          ...(source.components ? { components: stripExt(source.components) } : {}),
        };
      };

      const headerRowsForExport = () => {
        const env = activeEnvConfig();
        const groups = env.headerGroups || {};
        return groups[store.activeGroup] || groups[Object.keys(groups)[0]] || [];
      };

      const buildPostmanEnvironment = () => {
        const env = activeEnvConfig();
        const values = (env.variables || [])
          .filter((row) => row.key)
          .map((row) => ({
            key: row.key,
            value: String(row.value ?? ""),
            type: "default",
            enabled: true,
          }));
        // Ensure header template vars referenced as {{x}} appear even if missing from variables list.
        const known = new Set(values.map((row) => row.key));
        const baseKey = baseUrlKeyOf(env);
        if (!known.has(baseKey)) {
          known.add(baseKey);
          values.unshift({
            key: baseKey,
            value: String(presetBaseUrl(store.activeEnv) || defaultBaseUrl || ""),
            type: "default",
            enabled: true,
          });
        }
        for (const row of headerRowsForExport()) {
          const text = String(row.value || "");
          const matches = text.matchAll(/\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/g);
          for (const match of matches) {
            if (known.has(match[1])) continue;
            known.add(match[1]);
            values.push({ key: match[1], value: "", type: "default", enabled: true });
          }
        }
        return {
          id: typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
          name: (workspace || title || "API") + " · " + store.activeEnv,
          values,
          _postman_variable_scope: "environment",
          _postman_exported_at: new Date().toISOString(),
          _postman_exported_using: "DAxTA",
        };
      };

      const STATUS_EXPORT = {
        200: "OK",
        201: "Created",
        204: "No Content",
        400: "Bad Request",
        401: "Unauthorized",
        403: "Forbidden",
        404: "Not Found",
        409: "Conflict",
        422: "Unprocessable Entity",
        500: "Internal Server Error",
      };

      const postmanUrlFromPath = (serverUrl, pathTemplate) => {
        const base = String(serverUrl || "{{baseUrl}}").replace(/\/$/, "");
        const path = String(pathTemplate || "/");
        const segments = path.split("/").filter(Boolean);
        const pathParams = [...path.matchAll(/\{([^}]+)\}/g)].map((m) => m[1]);
        return {
          raw: base + (path.startsWith("/") ? path : "/" + path),
          host: base.startsWith("{{") ? [base] : [base.replace(/^https?:\/\//, "").split("/")[0]],
          path: segments.map((seg) => (seg.startsWith("{") && seg.endsWith("}") ? ":" + seg.slice(1, -1) : seg)),
          variable: pathParams.map((key) => ({ key, value: "" })),
        };
      };

      const collectionFolderSegments = (urlPath, operation) => {
        const fromTree = operation && operation["x-tree-segments"];
        const parts = Array.isArray(fromTree) && fromTree.length
          ? fromTree.map(String)
          : String(urlPath || "").split("/").filter(Boolean);
        const named = parts.filter((part) => part && !part.startsWith("{"));
        return named.length ? named : ["API"];
      };

      const pushIntoFolderTree = (root, segments, requestItem) => {
        let level = root;
        for (let index = 0; index < segments.length; index += 1) {
          const name = segments[index];
          let folder = level.find((entry) => entry && entry.name === name && Array.isArray(entry.item) && !entry.request);
          if (!folder) {
            folder = { name, item: [] };
            level.push(folder);
          }
          if (index === segments.length - 1) folder.item.push(requestItem);
          else level = folder.item;
        }
      };

      const sortCollectionTree = (items) => {
        const folders = items.filter((entry) => entry && Array.isArray(entry.item) && !entry.request);
        const requests = items.filter((entry) => entry && entry.request);
        folders.sort((left, right) => String(left.name).localeCompare(String(right.name)));
        for (const folder of folders) folder.item = sortCollectionTree(folder.item);
        requests.sort((left, right) => String(left.name).localeCompare(String(right.name)));
        return [...folders, ...requests];
      };

      const collectionRequestHeaders = (operation, includeTryIt) => {
        const byLower = new Map();
        const add = (key, value) => {
          if (!key) return;
          const lower = String(key).toLowerCase();
          if (lower === "host" || lower === "content-length") return;
          byLower.set(lower, { key, value: value != null ? String(value) : "", type: "text" });
        };
        for (const param of operation.parameters || []) {
          if (param && param.in === "header" && param.name) add(param.name, param.example != null ? param.example : "");
        }
        if (includeTryIt) {
          for (const row of headerRowsForExport()) add(row.key, row.value ?? "");
        }
        return [...byLower.values()];
      };

      /**
       * Postman Collection v2.1 — nested folders + named examples.
       * When includeTryIt, requests use the env's base URL variable and the active header group;
       * the env file is downloaded separately.
       */
      const buildPostmanCollection = (openapi, includeTryIt) => {
        const baseVar = "{{" + activeBaseUrlKey() + "}}";
        const specServer = (openapi.servers && openapi.servers[0] && openapi.servers[0].url) || baseVar;
        const serverUrl = includeTryIt ? baseVar : specServer;
        const root = [];

        for (const [urlPath, pathItem] of Object.entries(openapi.paths || {})) {
          if (!pathItem || typeof pathItem !== "object") continue;
          for (const method of HTTP_EXPORT) {
            const operation = pathItem[method];
            if (!operation || typeof operation !== "object") continue;
            const requestPath = operation["x-daxta-url-path"] || urlPath;
            const requestHeaders = collectionRequestHeaders(operation, includeTryIt);

            const reqExamples = operation.requestBody?.content?.["application/json"]?.examples || {};
            const firstReq = Object.values(reqExamples)[0];
            const defaultBody =
              firstReq && firstReq.value !== undefined
                ? typeof firstReq.value === "string"
                  ? firstReq.value
                  : JSON.stringify(firstReq.value, null, 2)
                : undefined;

            const baseRequest = {
              method: method.toUpperCase(),
              header: requestHeaders,
              url: postmanUrlFromPath(serverUrl, requestPath),
              description: operation.summary || "",
            };
            if (defaultBody !== undefined) {
              baseRequest.body = { mode: "raw", raw: defaultBody, options: { raw: { language: "json" } } };
              if (!requestHeaders.some((h) => String(h.key).toLowerCase() === "content-type")) {
                baseRequest.header = [...requestHeaders, { key: "Content-Type", value: "application/json", type: "text" }];
              }
            }

            const responses = [];
            for (const [status, response] of Object.entries(operation.responses || {})) {
              const examples = response?.content?.["application/json"]?.examples || {};
              const entries = Object.entries(examples);
              if (!entries.length) {
                responses.push({
                  name: response.description || STATUS_EXPORT[status] || status,
                  originalRequest: baseRequest,
                  status: STATUS_EXPORT[status] || response.description || status,
                  code: Number(status) || 0,
                  _postman_previewlanguage: "json",
                  header: [{ key: "Content-Type", value: "application/json" }],
                  body: "",
                });
                continue;
              }
              for (const [exKey, example] of entries) {
                const name = (example && (example.summary || example.description)) || exKey;
                const reqMatch = reqExamples[exKey] || reqExamples[name] || firstReq;
                const requestForExample = { ...baseRequest, header: [...(baseRequest.header || [])] };
                if (reqMatch && reqMatch.value !== undefined) {
                  const raw =
                    typeof reqMatch.value === "string" ? reqMatch.value : JSON.stringify(reqMatch.value, null, 2);
                  requestForExample.body = { mode: "raw", raw, options: { raw: { language: "json" } } };
                }
                const bodyValue = example && example.value !== undefined ? example.value : "";
                responses.push({
                  name,
                  originalRequest: requestForExample,
                  status: STATUS_EXPORT[status] || String(status),
                  code: Number(status) || 0,
                  _postman_previewlanguage: "json",
                  header: [{ key: "Content-Type", value: "application/json" }],
                  body: typeof bodyValue === "string" ? bodyValue : JSON.stringify(bodyValue, null, 2),
                });
              }
            }

            pushIntoFolderTree(root, collectionFolderSegments(urlPath, operation), {
              name: operation.summary || method.toUpperCase() + " " + requestPath,
              request: baseRequest,
              response: responses,
            });
          }
        }

        const item = sortCollectionTree(root);

        return {
          info: {
            _postman_id: typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
            name: (openapi.info && openapi.info.title) || workspace || title || "API",
            description: (openapi.info && openapi.info.description) || "Exported from API docs with named examples",
            schema: "https://schema.getpostman.com/json/collection/v2.1.0/collection.json",
          },
          item,
        };
      };

      /** Keeps tab order and screen readers inside the dialog while it is open. */
      const setBackgroundInert = (inert) => {
        for (const node of document.body.children) {
          if (node.id === "export-backdrop") continue;
          if (inert) node.setAttribute("inert", "");
          else node.removeAttribute("inert");
        }
      };

      const closeExportModal = () => {
        document.body.classList.remove("exporting");
        setBackgroundInert(false);
      };

      const syncExportTryItUi = () => {
        const meta = document.getElementById("export-tryit-meta");
        if (meta) meta.textContent = store.activeEnv + " · " + store.activeGroup;
        const baseVar = document.getElementById("export-base-var");
        if (baseVar) baseVar.textContent = "{{" + activeBaseUrlKey() + "}}";
      };

      /** Scenario names double as example summaries, so they carry the case section. */
      const exampleSectionLookup = (item) => {
        const byName = new Map();
        for (const scenario of item.scenarios || []) {
          if (scenario && scenario.name) byName.set(scenario.name, scenario.group || "Other");
        }
        return (example) => byName.get(example.summary) || "Other";
      };

      const groupExamplesBySection = (item, examples) => {
        const sectionOf = exampleSectionLookup(item);
        const bySection = new Map();
        for (const example of examples) {
          const section = sectionOf(example);
          if (!bySection.has(section)) bySection.set(section, []);
          bySection.get(section).push(example);
        }
        const order = GROUP_ORDER.filter((name) => bySection.has(name)).concat(
          [...bySection.keys()].filter((name) => !GROUP_ORDER.includes(name)),
        );
        return order.map((section) => ({ section, examples: bySection.get(section) }));
      };

      const sectionCheckboxes = (section) => [
        ...document.querySelectorAll(`#export-body .export-group-items input[data-section="${CSS.escape(section)}"]`),
      ];

      /** Chips mirror what is checked below: filled = all of it, outlined-part = some. */
      const syncExportSectionChips = () => {
        document.querySelectorAll("[data-export-section]").forEach((chip) => {
          const boxes = sectionCheckboxes(chip.dataset.exportSection);
          const checked = boxes.filter((box) => box.checked).length;
          chip.classList.toggle("on", boxes.length > 0 && checked === boxes.length);
          chip.classList.toggle("part", checked > 0 && checked < boxes.length);
          chip.setAttribute("aria-pressed", checked === boxes.length && boxes.length > 0 ? "true" : "false");
        });
      };

      const syncExportGroupChecks = () => {
        document.querySelectorAll("#export-body .export-group").forEach((group) => {
          const head = group.querySelector(".export-group-check");
          const boxes = [...group.querySelectorAll(".export-group-items input[type=checkbox]")];
          if (!head || !boxes.length) return;
          const checked = boxes.filter((box) => box.checked).length;
          head.checked = checked === boxes.length;
          head.indeterminate = checked > 0 && checked < boxes.length;
        });
        syncExportSectionChips();
      };

      /** Chips sit side by side, so the repeated "cases" tail only adds noise. */
      const shortGroup = (section) => displayGroup(section).replace(/\s+cases\b/gi, "").trim();

      const renderExportSectionButtons = (sections) => {
        const host = document.getElementById("export-sections");
        if (!host) return;
        const separator = document.getElementById("export-sections-sep");
        if (separator) separator.hidden = !sections.length;
        host.innerHTML = sections
          .map(
            (section) =>
              `<button type="button" class="section-chip ${groupTone(section)}" data-export-section="${escapeAttr(section)}" aria-pressed="true" title="${escapeAttr(displayGroup(section))} — click to toggle"><span class="dot"></span>${escapeHtml(shortGroup(section))}</button>`,
          )
          .join("");
        host.querySelectorAll("[data-export-section]").forEach((chip) => {
          chip.onclick = () => {
            const boxes = sectionCheckboxes(chip.dataset.exportSection);
            const next = !boxes.every((box) => box.checked);
            boxes.forEach((box) => {
              box.checked = next;
            });
            syncExportGroupChecks();
          };
        });
        syncExportSectionChips();
      };

      const openExportModal = () => {
        const body = document.getElementById("export-body");
        const sections = new Set();
        const exportable = ops
          .map((item) => ({ item, examples: listOperationExamples(item.op) }))
          .filter((entry) => entry.examples.length);
        const examplesById = new Map(exportable.map((entry) => [entry.item.id, entry.examples]));

        const renderOpBlock = (item) => {
            const examples = examplesById.get(item.id) || [];
            if (!examples.length) return "";
            const grouped = groupExamplesBySection(item, examples);
            for (const { section } of grouped) sections.add(section);
            return `<div class="export-op collapsed" data-op="${escapeAttr(item.id)}">
              <button type="button" class="export-op-title" aria-expanded="false" title="Show sections">
                <span class="chev"></span>
                <span class="method ${item.method}">${item.method}</span>
                <span class="path" title="${escapeAttr(item.path)}">${escapeAttr(item.title)}</span>
                <span class="export-op-count">${examples.length}</span>
              </button>
              <div class="export-op-groups">${grouped
                .map(
                  ({ section, examples: rows }) => `<div class="export-group collapsed ${groupTone(section)}">
                    <label class="export-group-head ${groupTone(section)}">
                      <button type="button" class="export-group-toggle" aria-expanded="false" title="Show examples"><span class="chev"></span></button>
                      <input type="checkbox" class="export-group-check" checked />
                      <span>${escapeHtml(displayGroup(section))}</span>
                      <span class="export-group-count">${rows.length}</span>
                    </label>
                    <div class="export-group-items">${rows
                      .map(
                        (example) => `<div class="export-ex">
                          <input type="checkbox" id="ex-${escapeAttr(item.id)}-${escapeAttr(example.key)}" data-op="${escapeAttr(item.id)}" data-key="${escapeAttr(example.key)}" data-section="${escapeAttr(section)}" checked />
                          <label for="ex-${escapeAttr(item.id)}-${escapeAttr(example.key)}">${escapeAttr(example.summary)}</label>
                        </div>`,
                      )
                      .join("")}</div>
                  </div>`,
                )
                .join("")}</div>
            </div>`;
        };

        /** Same folder tree as the sidebar, so the export mirrors what the docs show. */
        const countExamples = (node) =>
          node.ops.reduce((total, item) => total + (examplesById.get(item.id) || []).length, 0) +
          Object.values(node.children).reduce((total, child) => total + countExamples(child), 0);

        const renderExportNode = (node) => {
          const opsHtml = [...node.ops]
            .sort((left, right) => (METHOD_ORDER[left.method] ?? 99) - (METHOD_ORDER[right.method] ?? 99))
            .map(renderOpBlock)
            .join("");
          const foldersHtml = Object.entries(node.children)
            .map(([name, child]) => {
              const total = countExamples(child);
              if (!total) return "";
              return `<div class="export-folder collapsed">
                <button type="button" class="export-folder-head" aria-expanded="false">
                  <span class="chev"></span>
                  <span class="export-folder-name">${escapeHtml(name)}</span>
                  <span class="export-op-count">${total}</span>
                </button>
                <div class="export-folder-children">${renderExportNode(child)}</div>
              </div>`;
            })
            .join("");
          return opsHtml + foldersHtml;
        };

        const tree = renderExportNode(buildPathTree(exportable.map((entry) => entry.item)));
        body.innerHTML = tree || `<div class="export-empty">No recorded examples yet — export will include schemas only.</div>`;

        body.querySelectorAll(".export-folder").forEach((folder) => {
          const toggle = folder.querySelector(".export-folder-head");
          if (!toggle) return;
          toggle.onclick = () => {
            const collapsed = folder.classList.toggle("collapsed");
            toggle.setAttribute("aria-expanded", collapsed ? "false" : "true");
          };
        });

        const ordered = GROUP_ORDER.filter((name) => sections.has(name)).concat(
          [...sections].filter((name) => !GROUP_ORDER.includes(name)),
        );
        renderExportSectionButtons(ordered);

        body.querySelectorAll(".export-op").forEach((block) => {
          const toggle = block.querySelector(".export-op-title");
          if (!toggle) return;
          toggle.onclick = () => {
            const collapsed = block.classList.toggle("collapsed");
            toggle.setAttribute("aria-expanded", collapsed ? "false" : "true");
            toggle.title = collapsed ? "Show sections" : "Hide sections";
          };
        });

        body.querySelectorAll(".export-group").forEach((group) => {
          const head = group.querySelector(".export-group-check");
          const boxes = [...group.querySelectorAll(".export-group-items input[type=checkbox]")];
          if (head) {
            head.onchange = () => {
              boxes.forEach((box) => {
                box.checked = head.checked;
              });
              head.indeterminate = false;
            };
          }
          boxes.forEach((box) => {
            box.onchange = syncExportGroupChecks;
          });
          const toggle = group.querySelector(".export-group-toggle");
          if (toggle) {
            toggle.onclick = (event) => {
              // Sits inside the <label>, so stop the click from flipping the group checkbox.
              event.preventDefault();
              event.stopPropagation();
              const collapsed = group.classList.toggle("collapsed");
              toggle.setAttribute("aria-expanded", collapsed ? "false" : "true");
              toggle.title = collapsed ? "Show examples" : "Hide examples";
            };
          }
        });

        syncExportGroupChecks();
        syncExportTryItUi();
        document.body.classList.add("exporting");
        setBackgroundInert(true);
      };

      const collectSelectedExamples = () => {
        const selectedByOpId = new Map();
        document.querySelectorAll("#export-body input[type=checkbox]").forEach((input) => {
          const opId = input.dataset.op;
          const key = input.dataset.key;
          if (!opId || !key) return;
          if (!selectedByOpId.has(opId)) selectedByOpId.set(opId, new Set());
          if (input.checked) selectedByOpId.get(opId).add(key);
        });
        return selectedByOpId;
      };

      const downloadJsonFile = (filename, value) => {
        const blob = new Blob([JSON.stringify(value, null, 2) + "\n"], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      };

      const exportSafeName = () =>
        String(workspace || title || "openapi")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-|-$/g, "") || "daxta";

      const runExportDownload = () => {
        const selectedByOpId = collectSelectedExamples();
        const exported = toExportSpec(spec, selectedByOpId);
        const includeTryIt = Boolean(document.getElementById("export-include-tryit")?.checked);
        const base = exportSafeName();

        downloadJsonFile(base + ".postman_collection.json", buildPostmanCollection(exported, includeTryIt));
        if (includeTryIt) {
          setTimeout(() => {
            downloadJsonFile(base + ".postman_environment.json", buildPostmanEnvironment());
          }, 120);
        }
      };

      document.getElementById("export-openapi").addEventListener("click", (event) => {
        event.stopPropagation();
        setMoreOpen(false);
        openExportModal();
      });
      document.getElementById("export-cancel").addEventListener("click", closeExportModal);
      document.getElementById("export-backdrop").addEventListener("click", (event) => {
        if (event.target.id === "export-backdrop") closeExportModal();
      });
      document.getElementById("export-modal").addEventListener("click", (event) => event.stopPropagation());
      const exampleCheckboxes = () => document.querySelectorAll("#export-body .export-group-items input[type=checkbox]");
      document.getElementById("export-all").addEventListener("click", () => {
        exampleCheckboxes().forEach((input) => {
          input.checked = true;
        });
        syncExportGroupChecks();
      });
      document.getElementById("export-none").addEventListener("click", () => {
        exampleCheckboxes().forEach((input) => {
          input.checked = false;
        });
        syncExportGroupChecks();
      });
      document.getElementById("export-confirm").addEventListener("click", () => {
        runExportDownload();
        closeExportModal();
      });

      const HTTP = ["get", "post", "put", "patch", "delete"];
      const STATUS = { 200: "OK", 201: "Created", 204: "No Content", 400: "Bad Request", 401: "Unauthorized", 404: "Not Found", 409: "Conflict", 422: "Unprocessable Entity" };
      const GROUP_ORDER = [
        "POSITIVE CASES",
        "SEMANTIC ERROR CASES",
        "INVALID CASES",
        "OMITTED CASES",
        "SEMANTIC ERROR CASES - AUTH",
        "Other",
      ];
      const METHOD_ORDER = { get: 0, post: 1, put: 2, patch: 3, delete: 4 };

      const ops = [];
      for (const [path, item] of Object.entries(spec.paths || {})) {
        for (const method of HTTP) {
          if (!item[method]) continue;
          ops.push({
            id: method + ":" + path,
            method,
            path,
            op: item[method],
            title: item[method].summary || path,
            docs: item[method]["x-docs"] || { fields: [] },
            scenarios: item[method]["x-scenarios"] || [],
            treeSegments: item[method]["x-tree-segments"] || path.split("/").filter(Boolean),
          });
        }
      }

      const highlight = (value) => {
        if (value === undefined || value === null || value === "") return "";
        return JSON.stringify(value, null, 2)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/"([^"]+)":/g, '<span class="k">"$1"</span>:')
          .replace(/: "([^"]*)"/g, ': <span class="s">"$1"</span>')
          .replace(/: (-?\d+(?:\.\d+)?)/g, ': <span class="n">$1</span>')
          .replace(/: (true|false|null)/g, ': <span class="p">$1</span>');
      };

      const copyBodyText = (value) => {
        if (value === undefined || value === "") return null;
        if (typeof value === "string") return value;
        return JSON.stringify(value, null, 2);
      };

      const copyIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;

      const showToast = (message) => {
        let toast = document.getElementById("toast");
        if (!toast) {
          toast = document.createElement("div");
          toast.id = "toast";
          toast.className = "toast";
          document.body.appendChild(toast);
        }
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(showToast._timer);
        showToast._timer = setTimeout(() => toast.classList.remove("show"), 1400);
      };

      const copy = async (text, button, label) => {
        try {
          await navigator.clipboard.writeText(text);
          if (button && button.classList.contains("icon")) {
            showToast("Kopyalandı");
            return;
          }
          const previous = button.textContent;
          button.textContent = "Copied";
          setTimeout(() => (button.textContent = label || previous), 1200);
        } catch {}
      };

      const resolvedUrl = (item, scenario) => {
        const vars = varMap();
        let path = item.path;
        for (const [name, value] of Object.entries(scenario.pathParams || {})) {
          const fromVar = vars[name] ? String(interpolate(vars[name], vars)) : value;
          path = path.replace("{" + name + "}", encodeURIComponent(fromVar ?? ""));
        }
        const query = { ...(scenario.query || {}) };
        for (const key of Object.keys(query)) {
          if (vars[key]) query[key] = String(interpolate(vars[key], vars));
        }
        const qs = new URLSearchParams(query).toString();
        return currentBaseUrl() + path + (qs ? "?" + qs : "");
      };

      /**
       * Active Try-it header group wins: switching the group at the top overwrites
       * the example request headers (Send + cURL + Headers panel).
       * If the group is empty, fall back to what was recorded.
       */
      const requestHeadersForScenario = (scenario) => {
        const vars = varMap();
        const envHeaders = resolvedHeaders();
        if (Object.keys(envHeaders).length) {
          const out = {};
          for (const [name, value] of Object.entries(envHeaders)) {
            out[name] = String(interpolate(value, vars));
          }
          return out;
        }
        const recorded = { ...(scenario.headers || {}) };
        const out = {};
        for (const [name, value] of Object.entries(recorded)) {
          out[name] = String(interpolate(value, vars));
        }
        return out;
      };

      const toCurl = (item, scenario) => {
        const headers = requestHeadersForScenario(scenario);
        const body = scenario.reqBody !== undefined ? interpolate(scenario.reqBody, varMap()) : undefined;
        const lines = ["curl -X " + item.method.toUpperCase() + " '" + resolvedUrl(item, scenario).replace(/'/g, "'\\''") + "'"];
        for (const [name, value] of Object.entries(headers)) {
          lines.push("  -H '" + name + ": " + String(value).replace(/'/g, "'\\''") + "'");
        }
        if (body !== undefined && item.method !== "get") {
          lines.push("  -d '" + JSON.stringify(body, null, 2).replace(/'/g, "'\\''") + "'");
        }
        return lines.join(" \\\n");
      };

      const proxyUrl = (target) => {
        try {
          const absolute = new URL(target, location.href);
          if (absolute.origin === location.origin) return absolute.href;
        } catch {}
        if (location.protocol === "http:" || location.protocol === "https:") {
          return "/__proxy?target=" + encodeURIComponent(target);
        }
        return target;
      };

      const sendRequest = async (item, scenario) => {
        const target = resolvedUrl(item, scenario);
        const headers = { ...requestHeadersForScenario(scenario) };
        const body = scenario.reqBody !== undefined ? interpolate(scenario.reqBody, varMap()) : undefined;
        if (body !== undefined && !headers["content-type"] && !headers["Content-Type"]) {
          headers["content-type"] = "application/json";
        }
        const init = {
          method: item.method.toUpperCase(),
          headers,
        };
        if (body !== undefined && item.method !== "get" && item.method !== "head") {
          init.body = typeof body === "string" ? body : JSON.stringify(body);
        }
        const started = performance.now();
        const response = await fetch(proxyUrl(target), init);
        const text = await response.text();
        const ms = Math.max(1, Math.round(performance.now() - started));
        let parsed = text;
        try {
          parsed = text ? JSON.parse(text) : undefined;
        } catch {
          parsed = text;
        }
        return { status: response.status, body: parsed, ok: response.ok, ms, bytes: text.length };
      };

      const groupScenarios = (scenarios) => {
        const groups = {};
        (scenarios || []).forEach((scenario, index) => {
          const group = scenario.group || "Other";
          (groups[group] ||= []).push({ scenario, index });
        });
        const order = GROUP_ORDER.filter((name) => groups[name]).concat(
          Object.keys(groups).filter((name) => !GROUP_ORDER.includes(name)),
        );
        return { groups, order };
      };

      const GROUP_LABEL = {
        "POSITIVE CASES": "Positive cases",
        "SEMANTIC ERROR CASES": "False positive cases",
        "INVALID CASES": "Invalid cases",
        "OMITTED CASES": "Omitted cases",
        "SEMANTIC ERROR CASES - AUTH": "False positive cases — Auth",
        Other: "Other",
      };

      const displayGroup = (group) => GROUP_LABEL[group] || group || "Other";
      const groupTone = (group) => {
        const key = String(group || "").toUpperCase();
        if (key === "POSITIVE CASES") return "ok";
        if (key === "INVALID CASES") return "warn";
        if (key === "OMITTED CASES") return "omit";
        return "err";
      };
      const statusOk = (status) => Number(status) >= 200 && Number(status) < 300;

      const groupedDropdown = (scenarios, selected) => {
        const { groups, order } = groupScenarios(scenarios);
        const current = scenarios[selected];
        const q = exampleQuery.trim().toLowerCase();
        const kind = current ? displayGroup(current.group) : "";
        const ok = current ? statusOk(current.status) : false;
        return `<div class="dd ${exampleOpen ? "open" : ""}" id="scenario-dd">
          <button type="button" class="dd-toggle" id="scenario-toggle">
            <span class="dd-kicker">Example</span>
            <span class="dd-status ${ok ? "ok" : "err"}">${escapeHtml(String(current?.status ?? ""))}</span>
            <span class="dd-kind">${escapeHtml(kind)}</span>
            <span class="dd-toggle-label">${escapeHtml(current?.name || "Example")}</span>
          </button>
          <div class="dd-menu">
            <input class="dd-search" id="example-search" placeholder="Search examples..." value="${escapeAttr(exampleQuery)}" autocomplete="off" spellcheck="false" />
            <div class="dd-list">${order
              .map((group) => {
                const rows = groups[group].filter(({ scenario }) => {
                  if (!q) return true;
                  return (String(scenario.status) + " " + (scenario.name || "") + " " + (scenario.group || "")).toLowerCase().includes(q);
                });
                if (!rows.length) return "";
                const label = displayGroup(group);
                return `<div class="dd-group ${groupTone(group)}"><span>${escapeHtml(label)} (${rows.length})</span></div>` +
                  rows
                    .map(
                      ({ scenario, index }) =>
                        `<button type="button" class="dd-item ${index === selected ? "on" : ""}" data-index="${index}"><span class="st ${statusOk(scenario.status) ? "ok" : "err"}">${escapeHtml(String(scenario.status))}</span><span>${escapeHtml(scenarioClause(scenario))}</span></button>`,
                    )
                    .join("");
              })
              .join("")}</div>
          </div>
        </div>`;
      };

      let currentId = ops[0]?.id;
      let scenarioIndex = 0;
      let navQuery = "";
      let exampleQuery = "";
      let exampleOpen = false;
      let jsonMode = { req: "pretty", res: "pretty" };
      const treePathSegments = (item) => item.treeSegments || item.path.split("/").filter(Boolean);
      const apiVersions = [...new Set(ops.map((item) => treePathSegments(item)[0]).filter(Boolean))];
      let activeVersion = apiVersions[0] || "";
      const expandedFolders = new Set(apiVersions.map((version) => "/" + version));
      const expandedExampleOps = new Set();
      /** `${opId}::${group}` entries the user opened; groups start collapsed. */
      const expandedExampleGroups = new Set();
      const exampleGroupKey = (opId, group) => `${opId}::${group}`;
      const isExampleGroupCollapsed = (opId, group) => !expandedExampleGroups.has(exampleGroupKey(opId, group));

      const scenarioNavLabel = (scenario) => {
        const name = scenario.name || "example";
        const status = scenario.status != null ? String(scenario.status) : "";
        if (status && !name.startsWith(`${status} `) && !name.startsWith(`${status} —`)) {
          return `${status} — ${name}`;
        }
        return name;
      };
      const scenarioClause = (scenario) => {
        const name = scenario.name || "example";
        const status = scenario.status != null ? String(scenario.status) : "";
        const dashed = `${status} — `;
        if (status && name.startsWith(dashed)) return name.slice(dashed.length);
        const spaced = `${status}  `;
        if (status && name.startsWith(spaced)) return name.slice(spaced.length).trim();
        if (status && name.startsWith(`${status} `)) return name.slice(status.length).trim();
        return name;
      };

      const renderNavExamples = (item) => {
        const { groups, order } = groupScenarios(item.scenarios);
        return `<div class="nav-examples">${order
          .map(
            (group) => `<div class="nav-ex-group ${groupTone(group)}">
              <div class="nav-ex-group-label ${groupTone(group)}"><span>${escapeHtml(displayGroup(group))}</span><span class="nav-ex-count">${groups[group].length}</span></div>
              <div class="nav-ex-items">${groups[group]
                .map(
                  ({ scenario, index }) =>
                    `<button type="button" class="nav-example ${item.id === currentId && index === scenarioIndex ? "on" : ""}" data-id="${escapeAttr(item.id)}" data-scenario="${index}" title="${escapeAttr(scenarioNavLabel(scenario))}">${escapeHtml(scenarioNavLabel(scenario))}</button>`,
                )
                .join("")}</div>
            </div>`,
          )
          .join("")}</div>`;
      };

      const kv = (label, value) => {
        if (value === undefined || value === "") return "";
        const shown = typeof value === "object" ? JSON.stringify(value) : String(value);
        return `<div class="kv" title="${escapeAttr(label)}: ${escapeAttr(shown)}"><div class="kname">${label}</div><div class="kval">${shown}</div></div>`;
      };

      const metaBlock = (title, bodyHtml, source = "", { always = false } = {}) => {
        if (!always && !bodyHtml) return "";
        return `<div class="meta-block">
          <div class="meta-toolbar">
            <span class="meta-label">${title}</span>
            ${source ? `<span class="meta-source">${source}</span>` : ""}
          </div>
          ${bodyHtml || `<div class="meta-empty">—</div>`}
        </div>`;
      };

      const buildPathTree = (items) => {
        const root = { children: {}, ops: [] };
        for (const item of items) {
          const parts = treePathSegments(item);
          let node = root;
          for (let index = 0; index < parts.length; index += 1) {
            const part = parts[index];
            node.children[part] ??= { children: {}, ops: [] };
            node = node.children[part];
            if (index === parts.length - 1) node.ops.push(item);
          }
        }
        return root;
      };

      const expandPathToItem = (item) => {
        const parts = treePathSegments(item);
        let prefix = "";
        for (const part of parts) {
          prefix += "/" + part;
          expandedFolders.add(prefix);
        }
      };

      const collectVisibleItems = (node) => {
        const items = [...node.ops];
        for (const child of Object.values(node.children)) items.push(...collectVisibleItems(child));
        return items;
      };

      const renderTreeNode = (node, prefix = "", q = "") => {
        const opsHtml = [...node.ops]
          .sort((left, right) => (METHOD_ORDER[left.method] ?? 99) - (METHOD_ORDER[right.method] ?? 99))
          .map((item) => {
            const hasExamples = Array.isArray(item.scenarios) && item.scenarios.length > 0;
            const examplesOpen = expandedExampleOps.has(item.id);
            const exampleCount = hasExamples ? item.scenarios.length : 0;
            return `<div class="nav-op ${item.id === currentId ? "active" : ""} ${examplesOpen ? "examples-open" : ""}" data-op-id="${escapeAttr(item.id)}">
              <div class="nav-op-row">
                <button type="button" class="nav-item" data-id="${escapeAttr(item.id)}" title="${escapeAttr(item.path)}">
                  <span class="method ${item.method}">${item.method}</span>
                  <span class="nav-title">${escapeAttr(item.title)}</span>
                </button>
                ${hasExamples ? `<span class="nav-ex-total" title="${exampleCount} examples">${exampleCount}</span>` : ""}
                <button type="button" class="nav-expand" data-expand-id="${escapeAttr(item.id)}" title="Examples" aria-label="Toggle examples" aria-expanded="${examplesOpen ? "true" : "false"}" ${hasExamples ? "" : "disabled"}>
                  <span class="chev"></span>
                </button>
              </div>
              ${hasExamples ? renderNavExamples(item) : ""}
            </div>`;
          })
          .join("");

        const foldersHtml = Object.entries(node.children)
          .sort(([left], [right]) => left.localeCompare(right))
          .map(([name, child]) => {
            const folderPath = (prefix ? prefix + "/" : "/") + name;
            const subtreeItems = collectVisibleItems(child);
            if (q && !subtreeItems.some((item) => (item.method + " " + item.path + " " + item.title).toLowerCase().includes(q))) return "";
            const open = q ? true : expandedFolders.has(folderPath);
            return `<div class="tree-folder ${open ? "open" : ""}" data-folder="${folderPath}">
              <button type="button" class="tree-folder-toggle" data-folder="${folderPath}">
                <span class="chev"></span>
                <span class="tree-folder-name">${name}</span>
              </button>
              <div class="tree-children">${renderTreeNode(child, folderPath, q)}</div>
            </div>`;
          })
          .join("");

        return opsHtml + foldersHtml;
      };

      const visibleOps = () => {
        if (!activeVersion) return ops;
        return ops.filter((item) => treePathSegments(item)[0] === activeVersion);
      };

      const renderNav = () => {
        const nav = document.getElementById("nav");
        const q = navQuery.trim().toLowerCase();
        if (!ops.length) {
          nav.innerHTML = `<div class="tree-empty">No endpoints recorded</div>`;
          return;
        }
        if (currentId) {
          const active = ops.find((item) => item.id === currentId);
          if (active) expandPathToItem(active);
        }
        nav.innerHTML = `<div class="tree-root">${renderTreeNode(buildPathTree(visibleOps()), "", q)}</div>`;
        nav.querySelectorAll(".nav-item").forEach((button) => {
          button.onclick = () => select(button.dataset.id);
        });
        nav.querySelectorAll(".nav-expand").forEach((button) => {
          button.onclick = (event) => {
            event.stopPropagation();
            if (button.disabled) return;
            const opId = button.dataset.expandId;
            if (expandedExampleOps.has(opId)) expandedExampleOps.delete(opId);
            else expandedExampleOps.add(opId);
            const wrap = button.closest(".nav-op");
            if (wrap) {
              wrap.classList.toggle("examples-open", expandedExampleOps.has(opId));
              button.setAttribute("aria-expanded", expandedExampleOps.has(opId) ? "true" : "false");
            }
          };
        });
        nav.querySelectorAll(".nav-ex-total").forEach((badge) => {
          badge.onclick = (event) => {
            event.stopPropagation();
            const wrap = badge.closest(".nav-op");
            const opId = wrap && wrap.dataset.opId;
            if (!opId) return;
            if (expandedExampleOps.has(opId)) expandedExampleOps.delete(opId);
            else expandedExampleOps.add(opId);
            renderNav();
          };
        });
        nav.querySelectorAll(".nav-ex-group-label").forEach((button) => {
          button.onclick = (event) => {
            event.stopPropagation();
            const key = exampleGroupKey(button.dataset.groupOp, button.dataset.groupName);
            const collapsed = expandedExampleGroups.has(key);
            if (collapsed) expandedExampleGroups.delete(key);
            else expandedExampleGroups.add(key);
            const group = button.closest(".nav-ex-group");
            if (group) group.classList.toggle("collapsed", collapsed);
            button.setAttribute("aria-expanded", collapsed ? "false" : "true");
          };
        });
        nav.querySelectorAll(".nav-example").forEach((button) => {
          button.onclick = (event) => {
            event.stopPropagation();
            const opId = button.dataset.id;
            const index = Number(button.dataset.scenario);
            expandedExampleOps.add(opId);
            select(opId, Number.isFinite(index) ? index : 0);
          };
        });
        nav.querySelectorAll(".tree-folder-toggle").forEach((button) => {
          button.onclick = (event) => {
            event.stopPropagation();
            const folderPath = button.dataset.folder;
            const folder = button.closest(".tree-folder");
            if (expandedFolders.has(folderPath)) {
              expandedFolders.delete(folderPath);
              folder.classList.remove("open");
            } else {
              expandedFolders.add(folderPath);
              folder.classList.add("open");
            }
          };
        });
      };

      const escapeHtml = (value) =>
        String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");

      const highlightMatch = (text, query) => {
        const raw = String(text ?? "");
        const q = query.trim();
        if (!q) return escapeHtml(raw);
        const lower = raw.toLowerCase();
        const index = lower.indexOf(q.toLowerCase());
        if (index < 0) return escapeHtml(raw);
        return (
          escapeHtml(raw.slice(0, index)) +
          "<mark>" +
          escapeHtml(raw.slice(index, index + q.length)) +
          "</mark>" +
          escapeHtml(raw.slice(index + q.length))
        );
      };

      let searchActiveIndex = 0;

      const bindSearchHits = (panel, query) => {
        panel.querySelectorAll(".search-hit").forEach((button) => {
          button.onclick = (event) => {
            event.stopPropagation();
            select(button.dataset.id);
            closeSearch({ clear: true });
          };
        });
      };

      const searchHitsHtml = (query) => {
        const q = query.trim().toLowerCase();
        const matches = q
          ? ops.filter((item) => (item.method + " " + item.path + " " + item.title).toLowerCase().includes(q))
          : ops;
        if (!matches.length) return { html: `<div class="search-empty">No matching endpoints</div>`, count: 0 };
        if (searchActiveIndex >= matches.length) searchActiveIndex = 0;
        const html = matches
          .map(
            (item, index) => `<button type="button" class="search-hit ${index === searchActiveIndex ? "active" : ""}" data-id="${item.id}" role="option">
              <span class="method ${item.method}">${item.method}</span>
              <span class="search-hit-path">${q ? highlightMatch(item.path, q) : escapeHtml(item.path)}</span>
            </button>`,
          )
          .join("");
        return { html, count: matches.length };
      };

      const closeSearch = ({ clear = false } = {}) => {
        const wrap = document.getElementById("search-wrap");
        const input = document.getElementById("search");
        wrap.classList.remove("open");
        document.body.classList.remove("searching");
        document.body.classList.remove("search-palette");
        searchActiveIndex = 0;
        if (clear) {
          input.value = "";
          const paletteInput = document.getElementById("search-palette-input");
          if (paletteInput) paletteInput.value = "";
          navQuery = "";
          renderNav();
        }
      };

      const openSearch = () => {
        document.getElementById("search-wrap").classList.add("open");
        document.body.classList.add("searching");
        document.body.classList.remove("search-palette");
      };

      const openPalette = () => {
        closeSearch({ clear: false });
        document.body.classList.add("search-palette");
        searchActiveIndex = 0;
        const paletteInput = document.getElementById("search-palette-input");
        renderPalettePanel(paletteInput.value);
        paletteInput.focus();
        paletteInput.select();
      };

      const renderPalettePanel = (query = "") => {
        const panel = document.getElementById("search-palette-panel");
        const { html } = searchHitsHtml(query);
        panel.innerHTML = html;
        bindSearchHits(panel, query);
      };

      const renderSearchPanel = (query = "") => {
        const q = query.trim().toLowerCase();
        navQuery = query;
        renderNav();
        const panel = document.getElementById("search-panel");
        if (!q) {
          closeSearch();
          panel.innerHTML = "";
          return;
        }
        openSearch();
        const { html } = searchHitsHtml(query);
        panel.innerHTML = html;
        bindSearchHits(panel, query);
      };

      const jsonBlock = (value, pretty) => {
        if (value === undefined) return `<div class="meta-empty">No JSON body</div>`;
        if (!pretty) {
          const raw = typeof value === "string" ? value : JSON.stringify(value);
          return `<pre>${escapeHtml(raw)}</pre>`;
        }
        return `<pre>${highlight(value)}</pre>`;
      };

      const fieldDepth = (name) => {
        const parts = String(name || "")
          .replace(/\[\]/g, ".")
          .split(".")
          .filter(Boolean);
        return Math.max(0, parts.length - 1);
      };

      const byteLabel = (bytes) => {
        if (!bytes) return "";
        if (bytes < 1024) return bytes + " B";
        return (bytes / 1024).toFixed(1).replace(/\.0$/, "") + " KB";
      };

      const schemaFromValue = (value, prefix = "") => {
        const out = [];
        const walk = (node, path) => {
          if (node === null || node === undefined) {
            if (path) out.push({ name: path, type: "null" });
            return;
          }
          if (Array.isArray(node)) {
            const inner = node[0];
            const innerType = inner == null ? "unknown" : Array.isArray(inner) ? "array" : typeof inner === "object" ? "object" : typeof inner;
            out.push({ name: path, type: "array<" + innerType + ">" });
            if (inner && typeof inner === "object" && !Array.isArray(inner)) {
              for (const [key, nested] of Object.entries(inner)) walk(nested, path + "[]." + key);
            }
            return;
          }
          if (typeof node === "object") {
            if (path) out.push({ name: path, type: "object" });
            for (const [key, nested] of Object.entries(node)) walk(nested, path ? path + "." + key : key);
            return;
          }
          out.push({ name: path, type: typeof node === "number" && Number.isInteger(node) ? "integer" : typeof node });
        };
        walk(value, prefix);
        return out;
      };

      const schemaRows = (fields, { showLoc = false } = {}) => {
        if (!fields.length) return `<div class="meta-empty">—</div>`;
        return `<div class="schema-rows">${fields
          .map((field) => {
            const depth = fieldDepth(field.name);
            const nestClass = depth ? " nested" : "";
            const depthAttr = depth ? ` data-depth="${Math.min(depth, 4)}"` : "";
            const flag =
              field.required === true
                ? `<div class="flag req">required</div>`
                : field.required === false
                  ? `<div class="flag">optional</div>`
                  : `<div class="flag"></div>`;
            return `<div class="row">
              <div class="name${nestClass}"${depthAttr}>${escapeHtml(field.name)}</div>
              <div class="type">${escapeHtml(field.type)}${showLoc && field.in && field.in !== "body" ? " · " + escapeHtml(field.in) : ""}</div>
              ${flag}
            </div>`;
          })
          .join("")}</div>`;
      };

      const schemasInline = (fields, resBody) => {
        const requestFields = fields.filter((field) => field.in === "body" || field.in === "path" || field.in === "query" || field.in === "header");
        const responseFields = schemaFromValue(resBody);
        return {
          request: `<div class="schema-block"><span class="meta-label">Request schema</span>${schemaRows(requestFields, { showLoc: true })}</div>`,
          response: `<div class="schema-block"><span class="meta-label">Response schema</span>${schemaRows(responseFields)}</div>`,
        };
      };

      const renderMain = () => {
        const item = ops.find((entry) => entry.id === currentId);
        if (!item) {
          document.getElementById("main").innerHTML = `<div class="empty">No operations in this workspace yet.</div>`;
          const dock = document.getElementById("ex-dock");
          if (dock) dock.innerHTML = "";
          const epName = document.getElementById("ep-name");
          if (epName) epName.textContent = "";
          return;
        }
        if (scenarioIndex >= item.scenarios.length) scenarioIndex = 0;
        const scenario = item.scenarios[scenarioIndex] || { status: 0, pathParams: {}, query: {}, headers: {}, name: "" };
        const fields = item.docs.fields || [];
        ensureRequiredHeaderGroup(item.op);
        const displayHeaders = requestHeadersForScenario(scenario);
        const recordedOk = scenario.status >= 200 && scenario.status < 300;
        const statusText = STATUS[scenario.status] || item.op.responses?.[String(scenario.status)]?.description || "";
        const emptyResponse = scenario.resBody === undefined || scenario.status === 204;
        const reqCopyText = scenario.reqBody !== undefined ? copyBodyText(scenario.reqBody) : null;
        const showingLive = liveResult && liveResult.id === item.id && liveResult.scenarioIndex === scenarioIndex;
        const displayStatus = showingLive ? liveResult.status : scenario.status;
        const displayBody = showingLive ? liveResult.body : scenario.resBody;
        const displayOk = showingLive ? liveResult.status >= 200 && liveResult.status < 300 : recordedOk;
        const displayStatusText = STATUS[displayStatus] || (showingLive ? "" : statusText);
        const displayEmpty = showingLive ? displayBody === undefined || displayBody === "" : emptyResponse;
        const resCopyText = displayEmpty ? null : copyBodyText(displayBody);
        const reqPretty = jsonMode.req !== "raw";
        const resPretty = jsonMode.res !== "raw";
        const recordedBytes = displayEmpty ? 0 : new Blob([typeof displayBody === "string" ? displayBody : JSON.stringify(displayBody)]).size;
        const bytes = showingLive && liveResult.bytes != null ? liveResult.bytes : recordedBytes;
        const ms = showingLive && liveResult.ms != null ? liveResult.ms : null;
        const headersHtml = Object.keys(displayHeaders).length
          ? Object.entries(displayHeaders).map(([name, value]) => kv(name, value)).join("")
          : `<div class="meta-empty">No headers in this header group</div>`;
        const pathParamsHtml = Object.entries(scenario.pathParams || {})
          .map(([name, value]) => kv(name, value))
          .join("");
        const queryHtml = Object.entries(scenario.query || {})
          .map(([name, value]) => kv(name, value))
          .join("");
        const bodyHtml =
          scenario.reqBody !== undefined
            ? jsonBlock(scenario.reqBody, reqPretty)
            : `<div class="meta-empty">No JSON body</div>`;
        const resHtml =
          showingLive && liveResult.error
            ? `<div class="live-err">${String(liveResult.error).replace(/&/g, "&amp;").replace(/</g, "&lt;")}</div>`
            : displayEmpty
              ? `<div class="empty">Empty body</div>`
              : jsonBlock(displayBody, resPretty);

        const schemas = schemasInline(fields, displayEmpty ? undefined : displayBody);
        const epName = document.getElementById("ep-name");
        if (epName) {
          const exampleLabel = scenario.name ? scenarioClause(scenario) : "";
          epName.innerHTML = exampleLabel
            ? `<span class="ep-status ${recordedOk ? "" : "err"}">${escapeHtml(String(scenario.status))}</span>` +
              `<span class="ep-label" title="${escapeAttr(exampleLabel)}">${escapeHtml(exampleLabel)}</span>`
            : `<span class="ep-label" title="${escapeAttr(item.title)}">${escapeHtml(item.title)}</span>`;
        }
        document.title = item.title + (title ? " · " + title : "");

        document.getElementById("main").innerHTML = `
          <div class="urlbar">
            <div class="url"><span class="method ${item.method}">${item.method}</span><span>${resolvedUrl(item, scenario)}</span></div>
            <button class="btn" id="copy-curl" type="button">Copy cURL</button>
            <button class="btn primary" id="send" type="button">Send</button>
          </div>
          <div class="pair">
            <section class="card" id="request-card">
              <div class="card-head">
                <h2>Request</h2>
                <div class="card-head-actions">
                  <div class="mode-toggle">
                    <button type="button" data-json="req" data-mode="pretty" class="${reqPretty ? "on" : ""}">Pretty</button>
                    <button type="button" data-json="req" data-mode="raw" class="${reqPretty ? "" : "on"}">Raw</button>
                  </div>
                  <button class="btn sm icon" id="copy-req" type="button" title="Copy body" aria-label="Copy body" ${reqCopyText ? "" : "disabled"}>${copyIcon}</button>
                </div>
              </div>
              <div class="card-body">
                ${metaBlock("Headers", headersHtml, requiredAuthHint(item.op), { always: true })}
                ${metaBlock("Path", pathParamsHtml)}
                ${metaBlock("Query", queryHtml)}
                ${metaBlock("Body", `<div class="json-pane">${bodyHtml}</div>`, "", { always: true })}
                ${schemas.request}
              </div>
            </section>
            <section class="card response-card" id="response-card">
              <div class="card-head">
                <h2>Response</h2>
                <div class="card-head-actions">
                  <div class="res-meta">
                    <span class="code ${displayOk ? "ok" : "err"}">${displayStatus || ""} ${escapeHtml(displayStatusText)}</span>
                    ${ms != null ? `<span>${ms} ms</span>` : ""}
                    ${bytes ? `<span>${byteLabel(bytes)}</span>` : ""}
                  </div>
                  <div class="mode-toggle">
                    <button type="button" data-json="res" data-mode="pretty" class="${resPretty ? "on" : ""}">Pretty</button>
                    <button type="button" data-json="res" data-mode="raw" class="${resPretty ? "" : "on"}">Raw</button>
                  </div>
                  <button class="btn sm icon" id="copy-res" type="button" title="Copy body" aria-label="Copy body" ${resCopyText ? "" : "disabled"}>${copyIcon}</button>
                </div>
              </div>
              <div class="card-body">
                ${metaBlock("Body", `<div class="json-pane" id="response-body">${resHtml}</div>`, "", { always: true })}
                ${schemas.response}
              </div>
            </section>
          </div>
        `;

        const dock = document.getElementById("ex-dock");
        if (dock) dock.innerHTML = item.scenarios.length ? groupedDropdown(item.scenarios, scenarioIndex) : "";

        const scenarioToggle = document.getElementById("scenario-toggle");
        if (scenarioToggle) {
          const root = document.getElementById("scenario-dd");
          scenarioToggle.onclick = (event) => {
            event.stopPropagation();
            exampleOpen = !root.classList.contains("open");
            document.querySelectorAll(".dd.open").forEach((el) => {
              if (el !== root) el.classList.remove("open");
            });
            root.classList.toggle("open", exampleOpen);
            if (exampleOpen) document.getElementById("example-search")?.focus();
          };
          const exSearch = document.getElementById("example-search");
          if (exSearch) {
            exSearch.onclick = (event) => event.stopPropagation();
            exSearch.oninput = (event) => {
              exampleQuery = event.target.value;
              exampleOpen = true;
              const pos = event.target.selectionStart;
              renderMain();
              const next = document.getElementById("example-search");
              if (next) {
                next.focus();
                next.selectionStart = next.selectionEnd = pos;
              }
            };
          }
          root.querySelectorAll(".dd-item").forEach((button) => {
            button.onclick = (event) => {
              event.stopPropagation();
              scenarioIndex = Number(button.dataset.index);
              liveResult = null;
              exampleOpen = false;
              exampleQuery = "";
              renderNav();
              renderMain();
            };
          });
          root.onclick = (event) => event.stopPropagation();
        }

        document.querySelectorAll("[data-json]").forEach((button) => {
          button.onclick = (event) => {
            event.stopPropagation();
            jsonMode[button.dataset.json] = button.dataset.mode;
            renderMain();
          };
        });

        document.getElementById("copy-curl").onclick = (event) => copy(toCurl(item, scenario), event.currentTarget, "Copy cURL");
        const copyReq = document.getElementById("copy-req");
        if (copyReq && reqCopyText) copyReq.onclick = (event) => copy(reqCopyText, event.currentTarget, "Copy body");
        const copyRes = document.getElementById("copy-res");
        if (copyRes && resCopyText) copyRes.onclick = (event) => copy(resCopyText, event.currentTarget, "Copy body");

        const sendBtn = document.getElementById("send");
        if (sendBtn) {
          sendBtn.onclick = async () => {
            sendBtn.disabled = true;
            sendBtn.textContent = "Sending…";
            try {
              const result = await sendRequest(item, scenario);
              liveResult = {
                id: item.id,
                scenarioIndex,
                status: result.status,
                body: result.body,
                ms: result.ms,
                bytes: result.bytes,
              };
            } catch (error) {
              const message = error instanceof Error ? error.message : String(error);
              liveResult = {
                id: item.id,
                scenarioIndex,
                status: 0,
                body: undefined,
                error:
                  message +
                  "\n\nTip: open API docs at the same app port: http://localhost:3000" + docsPathSuffix,
              };
            }
            renderMain();
          };
        }
      };

      const select = (id, nextScenarioIndex) => {
        currentId = id;
        scenarioIndex = typeof nextScenarioIndex === "number" ? nextScenarioIndex : 0;
        liveResult = null;
        exampleOpen = false;
        exampleQuery = "";
        const selected = ops.find((entry) => entry.id === id);
        if (selected) {
          syncHeaderGroupForOp(selected.op);
          const version = treePathSegments(selected)[0];
          if (version) activeVersion = version;
          expandedExampleOps.add(id);
          const scenario = (selected.scenarios || [])[scenarioIndex];
          if (scenario) expandedExampleGroups.add(exampleGroupKey(id, scenario.group || "Other"));
        }
        renderPrefixBar();
        renderNav();
        renderMain();
        history.replaceState(null, "", "#" + encodeURIComponent(id));
      };

      const searchInput = document.getElementById("search");
      const paletteInput = document.getElementById("search-palette-input");

      const handleSearchKeys = (event, input, panelId) => {
        const panel = document.getElementById(panelId);
        const hits = [...panel.querySelectorAll(".search-hit")];
        if (event.key === "Escape") {
          closeSearch({ clear: true });
          input.blur();
          return;
        }
        if (!hits.length) return;
        if (event.key === "ArrowDown") {
          event.preventDefault();
          searchActiveIndex = (searchActiveIndex + 1) % hits.length;
          if (panelId === "search-palette-panel") renderPalettePanel(input.value);
          else renderSearchPanel(input.value);
          panel.querySelectorAll(".search-hit")[searchActiveIndex]?.scrollIntoView({ block: "nearest" });
        } else if (event.key === "ArrowUp") {
          event.preventDefault();
          searchActiveIndex = (searchActiveIndex - 1 + hits.length) % hits.length;
          if (panelId === "search-palette-panel") renderPalettePanel(input.value);
          else renderSearchPanel(input.value);
          panel.querySelectorAll(".search-hit")[searchActiveIndex]?.scrollIntoView({ block: "nearest" });
        } else if (event.key === "Enter") {
          event.preventDefault();
          const target = hits[searchActiveIndex] || hits[0];
          if (target) {
            select(target.dataset.id);
            closeSearch({ clear: true });
          }
        }
      };

      searchInput.addEventListener("input", (event) => {
        searchActiveIndex = 0;
        renderSearchPanel(event.target.value);
      });
      searchInput.addEventListener("keydown", (event) => handleSearchKeys(event, searchInput, "search-panel"));
      paletteInput.addEventListener("input", (event) => {
        searchActiveIndex = 0;
        renderPalettePanel(event.target.value);
      });
      paletteInput.addEventListener("keydown", (event) => handleSearchKeys(event, paletteInput, "search-palette-panel"));
      document.getElementById("search-backdrop").addEventListener("click", () => closeSearch({ clear: true }));
      document.getElementById("search-palette-card").addEventListener("click", (event) => event.stopPropagation());
      document.getElementById("search-wrap").addEventListener("click", (event) => event.stopPropagation());

      document.addEventListener("click", () => {
        exampleOpen = false;
        document.querySelectorAll(".dd.open").forEach((el) => el.classList.remove("open"));
        document.getElementById("env-wrap").classList.remove("open");
        setMoreOpen(false);
        if (document.body.classList.contains("searching")) closeSearch({ clear: true });
      });

      document.addEventListener("keydown", (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
          event.preventDefault();
          if (document.body.classList.contains("search-palette")) closeSearch({ clear: true });
          else openPalette();
          return;
        }
        if (event.key === "Escape" && document.body.classList.contains("search-palette")) {
          event.preventDefault();
          closeSearch({ clear: true });
          return;
        }
        if (event.key === "Escape" && moreWrap?.classList.contains("open")) {
          event.preventDefault();
          setMoreOpen(false);
          return;
        }
        if (event.key === "/" && !event.metaKey && !event.ctrlKey && !event.altKey) {
          const tag = (event.target && event.target.tagName) || "";
          if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || event.target?.isContentEditable) return;
          event.preventDefault();
          document.getElementById("search")?.focus();
        }
      });

      const prefixLabel = (name) => (String(name).startsWith("/") ? name : "/" + name);
      const renderPrefixBar = () => {
        const bar = document.getElementById("prefix-bar");
        if (!bar) return;
        if (apiVersions.length < 2) {
          bar.hidden = true;
          bar.innerHTML = "";
          return;
        }
        bar.hidden = false;
        bar.innerHTML = apiVersions
          .map(
            (name) =>
              `<button type="button" class="prefix-chip ${name === activeVersion ? "on" : ""}" data-prefix="${escapeAttr(name)}" aria-pressed="${name === activeVersion ? "true" : "false"}">${escapeHtml(prefixLabel(name))}</button>`,
          )
          .join("");
        bar.querySelectorAll(".prefix-chip").forEach((button) => {
          button.onclick = () => {
            activeVersion = button.dataset.prefix;
            const first = visibleOps()[0];
            if (first) select(first.id);
            else {
              renderPrefixBar();
              renderNav();
              renderMain();
            }
          };
        });
      };

      const initial = decodeURIComponent(location.hash.replace(/^#/, "")) || ops[0]?.id;
      select(ops.some((item) => item.id === initial) ? initial : ops[0]?.id);

      hydrateStoreFromServer().then((loaded) => {
        if (!loaded) return;
        const selected = ops.find((entry) => entry.id === currentId);
        if (selected) syncHeaderGroupForOp(selected.op);
        syncEnvTrigger();
        if (document.getElementById("env-wrap")?.classList.contains("open")) renderEnvPop();
        renderMain();
      });
    </script>
  </body>
</html>
