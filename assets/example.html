    <style>
      :root {
        --canvas: #050505;
        --sidebar: #090909;
        --nav: #090909;
        --paper: #050505;
        --white: #101010;
        --inset: #131313;
        --hairline: #262626;
        --line: #1c1c1c;
        --smoke: #6a6a6a;
        --stone: #8a8a8a;
        --charcoal: #c8c8c8;
        --obsidian: #f4f4f4;
        --accent: #8fa35a;
        --ok: #3dcc70;
        --ok-bg: #16301f;
        --get: #3dcc70;
        --warn: #d4a017;
        --err: #f07171;
        --err-bg: #3a1818;
        --sans: Geist, Inter, ui-sans-serif, system-ui, sans-serif;
        --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        --radius: 2px;
        --ring: 0 0 0 1px #262626;
        --ghost: none;
      }
      html[data-theme="light"] {
        --canvas: #fafafa;
        --sidebar: #fafafa;
        --nav: #ffffff;
        --paper: #fafafa;
        --white: #ffffff;
        --inset: #f5f5f5;
        --hairline: #e6e6e6;
        --line: #e6e6e6;
        --smoke: #888888;
        --stone: #666666;
        --charcoal: #333333;
        --obsidian: #111111;
        --accent: #6f7d3c;
        --ok: #15803d;
        --ok-bg: #e8f8ee;
        --get: #16a34a;
        --warn: #b45309;
        --err: #b42318;
        --err-bg: #fbeaea;
        --ring: 0 0 0 1px #e6e6e6;
        --ghost: 0 0 0 1px #e6e6e6;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; }
      :focus { outline: none; }
      :focus-visible {
        outline: 2px solid #c6c6c6;
        outline-offset: 2px;
      }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--obsidian);
        font: 13px/1.45 var(--sans);
      }
      button, input { font: inherit; color: inherit; }

      .topnav {
        height: 44px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) minmax(0, 1fr);
        align-items: center;
        gap: 12px;
        padding: 0 14px;
        background: var(--nav);
        border-bottom: 1px solid var(--hairline);
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 200;
      }
      body.searching .topnav { z-index: 210; }
      body.search-palette .topnav { z-index: 40; }
      .brand-wrap { display: flex; align-items: center; min-width: 0; justify-self: start; }
      .workspace { display: none; }
      .brand {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.04em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--obsidian);
      }
      .ep-nav {
        justify-self: center;
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        max-width: 100%;
      }
      .ep-name {
        display: flex;
        align-items: baseline;
        gap: 8px;
        min-width: 0;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.02em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--obsidian);
      }
      .ep-status {
        flex: none;
        font: 600 14px/1.4 var(--mono);
        letter-spacing: -0.02em;
        color: var(--ok);
      }
      .ep-status.err { color: var(--err); }
      .ep-label {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .prefix-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin: 0 0 8px;
        flex: none;
      }
      .prefix-bar[hidden] { display: none; }
      .prefix-chip {
        height: 22px;
        padding: 0 8px;
        border: 0;
        border-radius: 2px;
        background: transparent;
        color: var(--stone);
        font: 500 11px/22px var(--mono);
        cursor: pointer;
      }
      .prefix-chip:hover { color: var(--obsidian); background: var(--inset); }
      .prefix-chip.on {
        background: var(--inset);
        color: var(--obsidian);
      }
      .nav-tools { display: flex; align-items: center; gap: 8px; justify-self: end; }
      .nav-tools .btn {
        height: 28px;
        padding: 0 10px;
        font-size: 12px;
      }
      .nav-tools .btn.icon {
        width: 28px;
        height: 28px;
        padding: 0;
      }
      .nav-tools .btn.icon svg { width: 16px; height: 16px; }
      .more-wrap { position: relative; flex: none; }
      .more-pop {
        display: none;
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        width: 260px;
        background: var(--white);
        border: 1px solid var(--hairline);
        border-radius: var(--radius);
        padding: 6px;
        z-index: 220;
      }
      .more-wrap.open .more-pop { display: block; }
      .more-item {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        height: 34px;
        padding: 0 8px;
        border: 0;
        border-radius: 2px;
        background: transparent;
        color: var(--obsidian);
        cursor: pointer;
        font: 500 12px/1 var(--sans);
        text-align: left;
      }
      .more-item:hover { background: var(--inset); }
      .more-item-ico {
        width: 16px;
        height: 16px;
        flex: none;
        color: var(--charcoal);
      }
      .more-item-ico svg { width: 16px; height: 16px; display: block; }
      .more-item-label { flex: 1; min-width: 0; }
      .more-item-meta {
        color: var(--stone);
        font: 500 11px/1 var(--mono);
      }

        if (names.length === 1) setEnvBaseUrl(state.envs[names[0]], locationBaseUrl);
        return state;
      };

      // Prefer disk (shared across browsers / deploy), then localStorage, then defaults.
      let store = applyServingBaseUrl(loadLocalStore() || buildDefaultStore());
      let persistTimer = null;

      const writeLocalStore = () => {
        try {
          localStorage.setItem(STORE_KEY, JSON.stringify(store));
        } catch {}
      };

      const writeServerStore = async () => {
        try {
          const res = await fetch(ENV_STORE_URL, {
            method: "PUT",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(store),
          });
          if (!res.ok) return;
        } catch {
          /* offline / file:// — localStorage still works */
        }
      };

      const persistStore = () => {
        writeLocalStore();
        if (persistTimer) clearTimeout(persistTimer);
        persistTimer = setTimeout(() => {
          persistTimer = null;
          writeServerStore();
        }, 250);
      };

      const hydrateStoreFromServer = async () => {
        try {
          const res = await fetch(ENV_STORE_URL, { cache: "no-store" });
          if (!res.ok) return false;
          const remote = await res.json();
          if (!remote || typeof remote !== "object" || !remote.envs) return false;
          store = applyServingBaseUrl(mergeStore(remote));
          writeLocalStore();
          return true;
        } catch {
          return false;
        }
      };

      const activeEnvConfig = () => store.envs[store.activeEnv] || store.envs[Object.keys(store.envs)[0]];

      const varMap = () => {
        const env = activeEnvConfig();
        return Object.fromEntries((env.variables || []).filter((row) => row.key).map((row) => [row.key, row.value ?? ""]));
      };

      const interpolate = (value, vars, depth = 0) => {
        if (value == null || depth > 8) return value;
        if (typeof value === "object") {
          if (Array.isArray(value)) return value.map((item) => interpolate(item, vars, depth));
          return Object.fromEntries(Object.entries(value).map(([key, nested]) => [key, interpolate(nested, vars, depth)]));
        }
        if (typeof value !== "string") return value;
        return value.replace(/\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/g, (_, key) => (key in vars ? String(interpolate(vars[key], vars, depth + 1)) : "{{" + key + "}}"));
      };

      const resolvedHeadersFromGroup = (groupName) => {
        const env = activeEnvConfig();
        const groups = env.headerGroups || {};
        const group = groups[groupName] || groups[Object.keys(groups)[0]] || [];
        const vars = varMap();
        return Object.fromEntries(group.filter((row) => row.key).map((row) => [row.key, String(interpolate(row.value || "", vars))]));
      };

      const resolvedHeaders = () => resolvedHeadersFromGroup(store.activeGroup);

      /** OpenAPI security scheme ids for an operation (union across requirements). */
      const securitySchemeIds = (op) => {
        const requirements = (op && op.security) || spec.security || [];
        if (!Array.isArray(requirements) || !requirements.length) return [];
        const ids = [];
        for (const requirement of requirements) {
          if (!requirement || typeof requirement !== "object") continue;
          for (const id of Object.keys(requirement)) ids.push(id);
        }
        return [...new Set(ids)];
      };

      /** Stable group name for this op: single scheme, or merged combo (userId+merchantId). */
      const requiredGroupName = (op) => {
        const ids = securitySchemeIds(op);
        if (!ids.length) return null;
        if (ids.length === 1) return ids[0];
        return ids.slice().sort().join("+");
      };

      /** Fixed hint next to Headers — what this API needs to work. */
      const requiredAuthHint = (op) => {
        const ids = securitySchemeIds(op);
        if (!ids.length) return "";
        return "Required: " + ids.join(" + ");
      };

      /** Ensure merged combo group exists in the active env (lazy for older localStorage). */
      const ensureRequiredHeaderGroup = (op) => {
        const name = requiredGroupName(op);
        if (!name) return null;
        const env = activeEnvConfig();
        const groups = env.headerGroups || (env.headerGroups = {});
        if (groups[name]) return name;
        const ids = securitySchemeIds(op);
        const byKey = {};
        for (const id of ids) {
          for (const row of groups[id] || []) {
            if (!row.key) continue;
            byKey[row.key] = { key: row.key, value: row.value };
          }
        }
        if (!Object.keys(byKey).length) return null;
        if (!byKey["content-type"]) byKey["content-type"] = { key: "content-type", value: "application/json" };
        groups[name] = Object.values(byKey);
        return name;
      };

      /**
       * On operation select: switch to the required (possibly merged) group once.
       * User can still change the group from the top env panel afterward; Send follows that.
       */
      const syncHeaderGroupForOp = (op) => {
        const name = ensureRequiredHeaderGroup(op);
        if (!name) return;
        if (store.activeGroup === name) return;
        store.activeGroup = name;
        persistStore();
        syncEnvTrigger();
        if (document.getElementById("env-wrap")?.classList.contains("open")) renderEnvPop();
      };

      const activeBaseUrlKey = () => baseUrlKeyOf(activeEnvConfig());

      const currentBaseUrl = () => {
        const vars = varMap();
        return String(interpolate(vars[activeBaseUrlKey()] || defaultBaseUrl, vars) || defaultBaseUrl).replace(/\/$/, "");
      };

      const envLabel = () => store.activeEnv + " · " + store.activeGroup;

      const syncEnvTrigger = () => {
        const trigger = document.getElementById("env-trigger");
        if (!trigger) return;
        trigger.textContent = envLabel();
        const base = varMap()[activeBaseUrlKey()] || "";
        trigger.title = base ? store.activeEnv + " · " + base + " · " + store.activeGroup : envLabel();
      };

      const presetBaseUrl = (name) => {
        const env = store.envs[name];
        if (!env) return "";
        const row = (env.variables || []).find((entry) => entry.key === baseUrlKeyOf(env));
        return row ? String(row.value || "") : "";
      };

      const addNamedPreset = (name, baseUrl) => {
        if (!name || store.envs[name]) return false;
        const env = cloneDefaultEnv();
        setEnvBaseUrl(env, baseUrl || defaultBaseUrl);
        store.envs[name] = env;
        store.activeEnv = name;
        store.activeGroup = Object.keys(env.headerGroups || {})[0] || "default";
        return true;
      };

      const renderEnvPop = () => {
        const env = activeEnvConfig();
        const envNames = Object.keys(store.envs);
        const groups = Object.keys(env.headerGroups || {});
        if (!groups.includes(store.activeGroup)) store.activeGroup = groups[0] || "default";
        const groupRows = env.headerGroups[store.activeGroup] || [];
        const canRemoveEnv = envNames.length > 1;
        const canRemoveGroup = groups.length > 1;
        const activeBase = presetBaseUrl(store.activeEnv) || defaultBaseUrl;
        const quickPresets = [
          { id: "staging", baseUrl: (configuredPresets.staging && configuredPresets.staging.baseUrl) || "https://api.staging.example.com" },
          { id: "production", baseUrl: (configuredPresets.production && configuredPresets.production.baseUrl) || "https://api.example.com" },
        ].filter((preset) => !store.envs[preset.id]);

        document.getElementById("env-pop").innerHTML = `
          <div class="env-block">
            <div class="env-label">Presets</div>
            <div class="chip-row">
              ${envNames
                .map((id) => `<button type="button" class="chip-btn ${id === store.activeEnv ? "on" : ""}" data-env="${escapeAttr(id)}" title="${escapeAttr(presetBaseUrl(id))}">${escapeAttr(id)}</button>`)
                .join("")}
              <button type="button" class="ghost-btn" id="add-env" title="Add preset">+</button>
              <button type="button" class="ghost-btn" id="dup-env" title="Duplicate preset">⧉</button>
              <button type="button" class="ghost-btn" id="remove-env" title="Remove preset" ${canRemoveEnv ? "" : "disabled"}>×</button>
            </div>
            <div class="env-base-line"><span>${escapeAttr(baseUrlKeyOf(env))}</span> · ${escapeAttr(activeBase)}</div>
            ${
              quickPresets.length
                ? `<div class="env-quick">${quickPresets
                    .map(
                      (preset) =>
                        `<button type="button" class="btn sm" data-quick-preset="${escapeAttr(preset.id)}" data-base="${escapeAttr(preset.baseUrl)}">+ ${escapeAttr(preset.id)}</button>`,
                    )
                    .join("")}</div>`
                : ""
            }
          </div>
          <div class="env-block">
            <div class="env-label">Variables</div>
            ${(env.variables || [])
              .map(
                (row, index) => `<div class="env-kv ${row.key === baseUrlKeyOf(env) ? "base-url" : ""}" data-var="${index}">
                  <input class="env-cell" data-field="key" spellcheck="false" value="${escapeAttr(row.key)}" title="${row.key === baseUrlKeyOf(env) ? "Base URL variable — rename it to match your Postman collection" : escapeAttr(row.key)}" />
                  <input class="env-cell" data-field="value" spellcheck="false" value="${escapeAttr(row.value)}" />
                  <button type="button" class="ghost-btn" data-remove-var="${index}" ${row.key === baseUrlKeyOf(env) ? "disabled" : ""}>×</button>
                </div>`,
              )
              .join("")}
            <button type="button" class="btn env-add" id="add-var">Add variable</button>
          </div>
          <div class="env-block">
            <div class="env-label">Header group</div>
            <div class="chip-row">
              ${groups
                .map((group) => `<button type="button" class="chip-btn ${group === store.activeGroup ? "on" : ""}" data-group="${escapeAttr(group)}">${escapeAttr(group)}</button>`)
                .join("")}
              <button type="button" class="ghost-btn" id="add-group" title="Add header group">+</button>
              <button type="button" class="ghost-btn" id="remove-group" title="Remove header group" ${canRemoveGroup ? "" : "disabled"}>×</button>
            </div>
            ${groupRows
              .map(
                (row, index) => `<div class="env-kv" data-hdr="${index}">
                  <input class="env-cell" data-field="key" spellcheck="false" value="${escapeAttr(row.key)}" />
                  <input class="env-cell" data-field="value" spellcheck="false" value="${escapeAttr(row.value)}" />
                  <button type="button" class="ghost-btn" data-remove-hdr="${index}">×</button>
                </div>`,
              )
              .join("")}
            <button type="button" class="btn env-add" id="add-hdr">Add header</button>
          </div>
        `;

        syncEnvTrigger();

        document.getElementById("env-pop").querySelectorAll("[data-env]").forEach((button) => {
          button.onclick = (event) => {
            event.stopPropagation();
            store.activeEnv = button.dataset.env;
            const nextGroups = Object.keys(activeEnvConfig().headerGroups || {});
            if (!nextGroups.includes(store.activeGroup)) store.activeGroup = nextGroups[0] || "default";
            persistStore();
            renderEnvPop();
            renderMain();
          };
        });
        document.getElementById("env-pop").querySelectorAll("[data-quick-preset]").forEach((button) => {
          button.onclick = (event) => {
            event.stopPropagation();
            if (!addNamedPreset(button.dataset.quickPreset, button.dataset.base)) return;
            persistStore();
            renderEnvPop();
            renderMain();
          };
        });
        document.getElementById("add-env").onclick = (event) => {
          event.stopPropagation();
          const typed = window.prompt("Preset name (e.g. staging)", "staging");
          if (!typed) return;
          const name = typed.trim().replace(/\s+/g, "-");
          if (!name) return;
          if (store.envs[name]) {
            store.activeEnv = name;
          } else {
            const base = window.prompt("baseUrl", configuredPresets[name]?.baseUrl || defaultBaseUrl) || defaultBaseUrl;
            addNamedPreset(name, base.replace(/\/$/, ""));
          }
          persistStore();
          renderEnvPop();
          renderMain();
        };
        document.getElementById("dup-env").onclick = (event) => {
          event.stopPropagation();
          const source = store.activeEnv;
          let name = source + "-copy";
          let n = 2;
          while (store.envs[name]) {
            name = source + "-copy" + n;
            n += 1;
          }
          store.envs[name] = JSON.parse(JSON.stringify(activeEnvConfig()));
          store.activeEnv = name;
          persistStore();
          renderEnvPop();
          renderMain();
        };
        document.getElementById("remove-env").onclick = (event) => {
          event.stopPropagation();
          const names = Object.keys(store.envs);
          if (names.length <= 1 || !store.envs[store.activeEnv]) return;
          delete store.envs[store.activeEnv];
          store.activeEnv = Object.keys(store.envs)[0];
          const nextGroups = Object.keys(activeEnvConfig().headerGroups || {});
          store.activeGroup = nextGroups.includes(store.activeGroup) ? store.activeGroup : nextGroups[0] || "default";
          persistStore();
          renderEnvPop();
          renderMain();
        };
        document.getElementById("env-pop").querySelectorAll("[data-group]").forEach((button) => {
          button.onclick = (event) => {
            event.stopPropagation();
            store.activeGroup = button.dataset.group;
            persistStore();
            renderEnvPop();
            renderMain();
          };
        });
        document.getElementById("add-group").onclick = (event) => {
          event.stopPropagation();
          let name = "group";
          let n = 1;
          const groupsMap = activeEnvConfig().headerGroups;
          while (groupsMap[name + n]) n += 1;
          name = name + n;
          groupsMap[name] = [{ key: "content-type", value: "application/json" }];
          store.activeGroup = name;
          persistStore();
          renderEnvPop();
          renderMain();
        };
        document.getElementById("remove-group").onclick = (event) => {
          event.stopPropagation();
          const groupsMap = activeEnvConfig().headerGroups;
          const names = Object.keys(groupsMap || {});
          if (names.length <= 1 || !groupsMap[store.activeGroup]) return;
          delete groupsMap[store.activeGroup];
          store.activeGroup = Object.keys(groupsMap)[0] || "default";
          persistStore();
          renderEnvPop();
          renderMain();
        };
        document.getElementById("env-pop").querySelectorAll("[data-var]").forEach((row) => {
          row.querySelectorAll("input").forEach((input) => {
            input.oninput = () => {
              const index = Number(row.dataset.var);
              const field = input.dataset.field;
              const env = activeEnvConfig();
              if (!env.variables[index] || (field !== "key" && field !== "value")) return;
              const wasBaseUrl = env.variables[index].key === baseUrlKeyOf(env);
              env.variables[index][field] = input.value;
              // Renaming the base URL row (e.g. to ONBOARDING_SERVICE) retargets the whole env.
              if (field === "key" && wasBaseUrl) {
                env.baseUrlKey = input.value.trim() || DEFAULT_BASE_URL_KEY;
                const label = document.querySelector(".env-base-line span");
                if (label) label.textContent = env.baseUrlKey;
              }
              persistStore();
              syncEnvTrigger();
              if (wasBaseUrl) renderMain();
            };
            input.onchange = () => renderMain();
          });
        });
        document.getElementById("env-pop").querySelectorAll("[data-remove-var]").forEach((button) => {
          button.onclick = (event) => {
            event.stopPropagation();
            activeEnvConfig().variables.splice(Number(button.dataset.removeVar), 1);
            persistStore();
            renderEnvPop();
            renderMain();
          };
        });
        document.getElementById("add-var").onclick = (event) => {
          event.stopPropagation();
          activeEnvConfig().variables.push({ key: "", value: "" });
          persistStore();
          renderEnvPop();
        };
        document.getElementById("env-pop").querySelectorAll("[data-hdr]").forEach((row) => {
          row.querySelectorAll("input").forEach((input) => {
            input.oninput = () => {
              const index = Number(row.dataset.hdr);
              const field = input.dataset.field;
              const rows = activeEnvConfig().headerGroups[store.activeGroup] || [];
              if (!rows[index] || (field !== "key" && field !== "value")) return;
              rows[index][field] = input.value;
              persistStore();
            };
            input.onchange = () => renderMain();
          });
        });
        document.getElementById("env-pop").querySelectorAll("[data-remove-hdr]").forEach((button) => {
          button.onclick = (event) => {
            event.stopPropagation();
            (activeEnvConfig().headerGroups[store.activeGroup] || []).splice(Number(button.dataset.removeHdr), 1);
            persistStore();
            renderEnvPop();
            renderMain();
          };
        });
        document.getElementById("add-hdr").onclick = (event) => {
          event.stopPropagation();
          const groupsMap = activeEnvConfig().headerGroups;
          groupsMap[store.activeGroup] = groupsMap[store.activeGroup] || [];
          groupsMap[store.activeGroup].push({ key: "", value: "" });
          persistStore();
          renderEnvPop();
        };
      };

      document.title = title || "API Documentation";
      const brandEl = document.getElementById("brand");
      if (brandEl) brandEl.textContent = (title || "DAxTA") + " API Document";
      const applyTheme = (mode) => {
        const next = mode === "light" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("daxta-theme", next);
        const fav = document.getElementById("favicon");

      applyTheme(localStorage.getItem("daxta-theme") || "dark");
      const shortcutPalette = document.getElementById("shortcut-palette");
      if (shortcutPalette) shortcutPalette.textContent = /Mac|iPhone|iPad/.test(navigator.platform) ? "⌘K" : "Ctrl+K";

        applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
      });
      const moreWrap = document.getElementById("more-wrap");
      const moreToggle = document.getElementById("more-toggle");
      const setMoreOpen = (open) => {
        moreWrap?.classList.toggle("open", open);
        moreToggle?.setAttribute("aria-expanded", open ? "true" : "false");

      const navVersion = document.getElementById("nav-version");
      if (navVersion) navVersion.textContent = specVersion ? (specVersion.startsWith("v") ? specVersion : "v" + specVersion) : "";
