    <style>
      :root {
        --canvas: #fafafa;
        --sidebar: #fafafa;
        --nav: #ffffff;
        --paper: #fafafa;
        --white: #ffffff;
        --inset: #f5f5f5;
        --hairline: #e6e6e6;
        --line: #e6e6e6;
        --smoke: #888888;
        --stone: #666666;
        --charcoal: #333333;
        --obsidian: #111111;
        --accent: #6f7d3c;
        --ok: #15803d;
        --ok-bg: #e8f8ee;
        --get: #16a34a;
        --err: #b42318;
        --err-bg: #fbeaea;
        --sans: Geist, Inter, ui-sans-serif, system-ui, sans-serif;
        --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        --radius: 5px;
        --ring: 0 0 0 1px #e6e6e6;
        --ghost: 0 0 0 1px #e6e6e6;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      :focus { outline: none; }
      :focus-visible {
        outline: 2px solid #c6c6c6;
        outline-offset: 2px;
      }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--obsidian);
        font: 13px/1.45 var(--sans);
      }
      button, input { font: inherit; color: inherit; }

      .topnav {
        height: 44px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) minmax(0, 1fr);
        align-items: center;
        gap: 12px;
        padding: 0 14px;
        background: var(--nav);
        border-bottom: 1px solid var(--hairline);
        position: sticky;
        top: 0;
        z-index: 20;
      }
      body.searching .topnav { z-index: 30; }
      .brand-wrap { display: flex; align-items: center; gap: 10px; min-width: 0; justify-self: start; }
      .workspace { display: none; }
      .brand { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--charcoal); }
      .ep-nav {
        justify-self: center;
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        max-width: 100%;
      }
      .ep-name {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.02em;
        white-space: nowrap;

        background: var(--white);
        border-radius: var(--radius);
        border: 1px solid var(--hairline);
        box-shadow: none;
        padding: 0;
      }
      .dd.open .dd-menu { display: flex; flex-direction: column; }
      .dd-search {
        height: 32px;
        margin: 8px 8px 4px;
        border: 1px solid var(--hairline);
        border-radius: 4px;
        padding: 0 8px;
        font-size: 12px;
        background: var(--white);
      }
      .dd-list { overflow: auto; padding: 4px 0 8px; }
      .dd-group {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--stone);
        padding: 10px 12px 4px;
      }
      .dd-group.ok { color: var(--ok); }
      .dd-group.err { color: var(--err); }
      .dd-count {
        font: 600 10px/1.4 var(--mono);
        color: var(--stone);
        letter-spacing: 0;
        text-transform: none;
      }
      .dd-item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        border: 0;
        background: transparent;
        text-align: left;
        padding: 6px 12px;
        font-size: 13px;
        cursor: pointer;
      }
      .dd-item:hover, .dd-item.on { background: var(--inset); }
      .dd-item .st {
        font: 600 11px/1 var(--mono);
        width: 28px;
        flex: none;
      }
      .dd-item .st.ok { color: var(--ok); }
      .dd-item .st.err { color: var(--err); }

      .urlbar {
        display: flex;
        gap: 8px;
        align-items: stretch;
        margin-bottom: 12px;
      }
      .url {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--white);
        border-radius: var(--radius);
        border: 1px solid var(--hairline);
        box-shadow: none;
        padding: 0 10px;
        height: 36px;
        font-family: var(--mono);
        font-size: 12px;
        overflow: hidden;
      }
      .url span:last-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .url .method { flex: none; }
      .btn {
        border: 1px solid var(--hairline);
        background: var(--white);
        box-shadow: none;
        border-radius: var(--radius);
        padding: 0 12px;
        height: 36px;
        cursor: pointer;
        color: var(--charcoal);
        white-space: nowrap;
        font-size: 12px;
        text-decoration: none;
      }
      .btn:hover { color: var(--obsidian); }
      .btn.sm { height: 32px; padding: 0 10px; font-size: 12px; }
      .btn.icon {
        width: 32px;
        height: 32px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--stone);
      }
      .btn.icon:hover:not(:disabled) { color: var(--obsidian); }
      .btn.icon svg { width: 15px; height: 15px; display: block; }
      .btn:disabled { opacity: 0.4; cursor: default; }

      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(12px);
        background: var(--obsidian);
        color: var(--white);
        font-size: 13px;
        padding: 10px 16px;
        border-radius: var(--radius);
        box-shadow: var(--ring);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s ease, transform 0.18s ease;
        z-index: 100;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      .pair {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 20px;
        align-items: start;
      }
      .card {
        background: var(--white);
        border-radius: var(--radius);
        border: 1px solid var(--hairline);
        box-shadow: none;
        min-width: 0;
        display: flex;
        flex-direction: column;
        max-width: 100%;
      }
      .card.response-card {
        overflow: hidden;
      }
      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--hairline);
        flex: none;
      }
      .card-head h2 {
        margin: 0;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .card-head-actions { display: flex; align-items: center; gap: 8px; }
      .mode-toggle {
        display: flex;
        border: 1px solid var(--hairline);
        border-radius: 4px;
        overflow: hidden;
      }
      .mode-toggle button {
        height: 24px;
        padding: 0 8px;
        border: 0;
        background: var(--white);
        font-size: 11px;
        cursor: pointer;
        color: var(--stone);
      }
      .mode-toggle button.on { background: var(--obsidian); color: var(--white); }
      .card-body {
        padding: 0;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      #response-body {
        overflow: auto;
      }
      #response-body pre {
        max-height: none;
      }
      .meta-block {
        padding: 10px 12px;
        border-top: 1px solid var(--hairline);
      }
      .meta-block:first-child { border-top: 0; }
      .meta-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }
      .meta-label {
        font: 600 10px/1 var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--obsidian);
      }
      .meta-source { color: var(--smoke); font: 11px/1 var(--mono); }
      .meta-empty { color: var(--smoke); font-size: 12px; padding: 2px 0; }
      .kv {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 6px;
        font-size: 12px;
        min-width: 0;
      }
      .kv:last-child { margin-bottom: 0; }
      .kname {
        flex: none;
        width: 110px;
        color: var(--stone);
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.02em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .kval {
        flex: 1;
        min-width: 0;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--obsidian);
        padding: 4px 0;
        background: transparent;
        border-radius: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      pre {
        margin: 0;
        padding: 10px 12px;
        background: #fcfcfc;
        border-radius: 0;
        overflow: auto;
        font: 12px/1.5 var(--mono);
      }
      .k { color: #111111; }
      .s { color: var(--accent); }
      .n { color: #111111; }
      .p { color: #666666; }
      .empty { color: var(--stone); font-size: 13px; padding: 14px 16px; }
      .code {
        font: 600 11px/1 var(--mono);
        padding: 3px 6px;
        border-radius: 4px;
        background: var(--inset);
      }
      .code.ok { background: var(--ok-bg); color: var(--ok); }
      .code.err { background: var(--err-bg); color: var(--err); }
      .code-text { color: var(--stone); font-size: 12px; }
      .res-meta { display: flex; align-items: center; gap: 10px; color: var(--stone); font: 11px/1 var(--mono); }

      .schemas {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        padding-top: 8px;
        border-top: 1px solid var(--hairline);
      }
      .schemas h2 {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin: 0 0 8px;
        color: var(--stone);
      }
      .row {
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(0, 0.9fr) auto;
        gap: 8px;
        align-items: baseline;
        padding: 5px 0;
        font-size: 12px;
      }
      .row .name {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--obsidian);
        min-width: 0;
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      .row .name.nested {
        color: var(--charcoal);
        border-left: 1px solid var(--hairline);
        padding-left: 8px;
        margin-left: 2px;
      }
      .row .name.nested[data-depth="2"] { margin-left: 14px; }
      .row .name.nested[data-depth="3"] { margin-left: 26px; }
      .row .name.nested[data-depth="4"] { margin-left: 38px; }
      .row .loc,
      .row .type {
        color: var(--stone);
        font-family: var(--mono);
        font-size: 11px;
        min-width: 0;
      }
      .flag { font-size: 11px; color: var(--smoke); }
      .flag.req { color: var(--err); }

      .work-foot {
        margin-top: 24px;
        font-size: 11px;
        color: var(--smoke);
      }

      @media (max-width: 960px) {
        .app {
          grid-template-columns: 1fr;
          grid-template-rows: auto 1fr auto;
          height: auto;
          min-height: calc(100vh - 44px);
        }
        .app.sidebar-collapsed {
          grid-template-columns: 1fr;
        }
        .sidebar, .workbench, .ex-dock { grid-column: 1; grid-row: auto; }
        .sidebar { max-height: 40vh; opacity: 1 !important; pointer-events: auto !important; padding: 16px 12px 24px !important; }
        .ex-dock { position: sticky; bottom: 0; }
        .sidebar-resizer { display: none; }
        .pair, .schemas { grid-template-columns: 1fr; }
        .search-wrap { width: min(280px, 70vw); }
      }

              }
            }
            for (const scenario of op["x-scenarios"] || []) {
              const success = scenario.status >= 200 && scenario.status < 300;
              for (const [header, value] of Object.entries(scenario.headers || {})) {
                if (!String(header).toLowerCase().startsWith("x-")) continue;
                take(header, value, success);
              }
            }
          }
        }
        return byHeader;
      };

      const defaultHeaderValues = collectDefaultHeaderValues();

      const configuredPresets = (() => {
        const raw = viewer.envPresets;
        if (raw && typeof raw === "object" && Object.keys(raw).length) return raw;
        return { local: { baseUrl: defaultBaseUrl } };
      })();

      const setEnvBaseUrl = (env, baseUrl) => {
        const variables = env.variables || (env.variables = []);
        const row = variables.find((entry) => entry.key === "baseUrl");
        if (row) row.value = baseUrl;
        else variables.unshift({ key: "baseUrl", value: baseUrl });
      };

      const buildHeaderTemplate = () => {
        const schemes = (spec.components && spec.components.securitySchemes) || {};
        const variables = [];
        const varKeys = new Set();
        const headerGroups = {};
        for (const [schemeId, scheme] of Object.entries(schemes)) {
          if (!scheme || scheme.in !== "header" || !scheme.name) continue;
          const header = scheme.name;
          const varName = varNameFromHeader(header);
          if (!varKeys.has(varName)) {
            const seeded = defaultHeaderValues[String(header).toLowerCase()] || "";
            variables.push({ key: varName, value: seeded });
            varKeys.add(varName);
          }
          headerGroups[schemeId] = [
            { key: header, value: "{{" + varName + "}}" },
            { key: "content-type", value: "application/json" },
          ];
        }
        const seenCombos = new Set();
        for (const pathItem of Object.values(spec.paths || {})) {
          for (const op of Object.values(pathItem || {})) {
            if (!op || typeof op !== "object") continue;
            const ids = [];
            for (const requirement of op.security || []) {
              if (!requirement || typeof requirement !== "object") continue;
              for (const id of Object.keys(requirement)) {
                if (headerGroups[id]) ids.push(id);
              }
            }
            const unique = [...new Set(ids)];
            if (unique.length < 2) continue;
            const comboKey = unique.slice().sort().join("+");
            if (seenCombos.has(comboKey)) continue;
            seenCombos.add(comboKey);
            const byKey = {};
            for (const id of unique) {
              for (const row of headerGroups[id] || []) {
                if (!row.key) continue;
                byKey[row.key] = { key: row.key, value: row.value };
              }
            }
            if (!byKey["content-type"]) byKey["content-type"] = { key: "content-type", value: "application/json" };
            headerGroups[comboKey] = Object.values(byKey);
          }
        }
        const groupNames = Object.keys(headerGroups);
        if (!groupNames.length) headerGroups.default = [{ key: "content-type", value: "application/json" }];
        return { variables, headerGroups };
      };

      const envFromPreset = (preset) => {
        const template = buildHeaderTemplate();
        const baseUrl = String((preset && preset.baseUrl) || defaultBaseUrl).replace(/\/$/, "") || defaultBaseUrl;
        const variables = [{ key: "baseUrl", value: baseUrl }, ...template.variables.map((row) => ({ ...row }))];
        const known = new Set(variables.map((row) => row.key));
        if (preset && preset.variables && typeof preset.variables === "object") {
          for (const [key, value] of Object.entries(preset.variables)) {
            if (!key || key === "baseUrl") continue;
            if (known.has(key)) {
              const row = variables.find((entry) => entry.key === key);
              if (row) row.value = String(value ?? "");
            } else {
              variables.push({ key, value: String(value ?? "") });
              known.add(key);
            }
          }
        }
        const headerGroups = {};
        for (const [group, rows] of Object.entries(template.headerGroups)) {
          headerGroups[group] = rows.map((row) => ({ ...row }));
        }
        return { variables, headerGroups };
      };

      const buildDefaultStore = () => {
        const envs = {};
        for (const [name, preset] of Object.entries(configuredPresets)) {
          envs[name] = envFromPreset(preset);
        }
        if (!Object.keys(envs).length) envs.local = envFromPreset({ baseUrl: defaultBaseUrl });
        const names = Object.keys(envs);
        const activeEnv = names.includes("local") ? "local" : names[0];
        const groupNames = Object.keys(envs[activeEnv].headerGroups || {});
        return {
          activeEnv,
          activeGroup: groupNames[0] || "default",
          envs,
        };
      };

      const cloneDefaultEnv = () => {
        const defaults = buildDefaultStore();
        const name = defaults.envs.local ? "local" : Object.keys(defaults.envs)[0];
        return JSON.parse(JSON.stringify(defaults.envs[name]));
      };

      const mergeStore = (saved) => {
        const defaults = buildDefaultStore();
        if (!saved || !saved.envs || typeof saved.envs !== "object") return defaults;
        const envs = {};
        for (const [name, env] of Object.entries(saved.envs)) {
          const base = cloneDefaultEnv();
          const variables = Array.isArray(env.variables)
            ? env.variables.map((row) => ({ key: String(row.key || ""), value: String(row.value ?? "") }))
            : base.variables.map((row) => ({ ...row }));
          const known = new Set(variables.map((row) => row.key).filter(Boolean));
          for (const row of base.variables) {
            if (row.key && !known.has(row.key)) variables.push({ ...row });
          }
          const defaultsByKey = Object.fromEntries((base.variables || []).filter((row) => row.key).map((row) => [row.key, row.value ?? ""]));
          for (const row of variables) {
            if (!row.key) continue;
            if (String(row.value ?? "").trim()) continue;
            if (defaultsByKey[row.key]) row.value = defaultsByKey[row.key];
          }
          const headerGroups = { ...(env.headerGroups || {}) };
          for (const [group, rows] of Object.entries(base.headerGroups)) {
            if (!headerGroups[group]) headerGroups[group] = rows.map((row) => ({ ...row }));
          }
          if (!Object.keys(headerGroups).length) headerGroups.default = [{ key: "content-type", value: "application/json" }];
          envs[name] = { variables, headerGroups };
        }
        // Seed any config presets that are missing from the saved store (don't wipe existing).
        for (const [name, preset] of Object.entries(configuredPresets)) {
          if (envs[name]) continue;
          envs[name] = envFromPreset(preset);
        }
        if (!Object.keys(envs).length) return defaults;
        const activeEnv = envs[saved.activeEnv] ? saved.activeEnv : Object.keys(envs)[0];
        const groups = Object.keys(envs[activeEnv].headerGroups || {});
        const activeGroup = groups.includes(saved.activeGroup) ? saved.activeGroup : groups[0] || "default";
        return { activeEnv, activeGroup, envs };
      };

      const loadLocalStore = () => {
        try {
          const raw = localStorage.getItem(STORE_KEY);
          if (raw) return mergeStore(JSON.parse(raw));
        } catch {}
        return null;
      };

      /**
       * Only rewrite baseUrl for local-ish presets so staging/production stay intact.
       */
      const applyServingBaseUrl = (state) => {
        if (!locationBaseUrl || !state || !state.envs) return state;
        const preferred = ["local", "development", "dev"].find((name) => state.envs[name]);
        if (preferred) {
          setEnvBaseUrl(state.envs[preferred], locationBaseUrl);
          return state;
        }
        const names = Object.keys(state.envs);
        if (names.length === 1) setEnvBaseUrl(state.envs[names[0]], locationBaseUrl);
        return state;
      };

      // Prefer disk (shared across browsers / deploy), then localStorage, then defaults.
      let store = applyServingBaseUrl(loadLocalStore() || buildDefaultStore());
      let persistTimer = null;

      const writeLocalStore = () => {
        try {
          localStorage.setItem(STORE_KEY, JSON.stringify(store));
        } catch {}
      };

      const writeServerStore = async () => {
        try {
          const res = await fetch(ENV_STORE_URL, {
            method: "PUT",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(store),
          });
          if (!res.ok) return;
        } catch {
          /* offline / file:// — localStorage still works */
        }
      };

      const persistStore = () => {
        writeLocalStore();
        if (persistTimer) clearTimeout(persistTimer);
        persistTimer = setTimeout(() => {
          persistTimer = null;
          writeServerStore();
        }, 250);
      };

      const hydrateStoreFromServer = async () => {
        try {
          const res = await fetch(ENV_STORE_URL, { cache: "no-store" });
          if (!res.ok) return false;
          const remote = await res.json();
          if (!remote || typeof remote !== "object" || !remote.envs) return false;
          store = applyServingBaseUrl(mergeStore(remote));
          writeLocalStore();
          return true;
        } catch {
          return false;
        }
      };

      const activeEnvConfig = () => store.envs[store.activeEnv] || store.envs[Object.keys(store.envs)[0]];

      const varMap = () => {
        const env = activeEnvConfig();
        return Object.fromEntries((env.variables || []).filter((row) => row.key).map((row) => [row.key, row.value ?? ""]));
      };

      const interpolate = (value, vars, depth = 0) => {
        if (value == null || depth > 8) return value;
        if (typeof value === "object") {
          if (Array.isArray(value)) return value.map((item) => interpolate(item, vars, depth));
          return Object.fromEntries(Object.entries(value).map(([key, nested]) => [key, interpolate(nested, vars, depth)]));
        }
        if (typeof value !== "string") return value;
        return value.replace(/\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/g, (_, key) => (key in vars ? String(interpolate(vars[key], vars, depth + 1)) : "{{" + key + "}}"));
      };

      const resolvedHeadersFromGroup = (groupName) => {
        const env = activeEnvConfig();
        const groups = env.headerGroups || {};
        const group = groups[groupName] || groups[Object.keys(groups)[0]] || [];
        const vars = varMap();
        return Object.fromEntries(group.filter((row) => row.key).map((row) => [row.key, String(interpolate(row.value || "", vars))]));
      };

      const resolvedHeaders = () => resolvedHeadersFromGroup(store.activeGroup);

      /** OpenAPI security scheme ids for an operation (union across requirements). */
      const securitySchemeIds = (op) => {
        const requirements = (op && op.security) || spec.security || [];
        if (!Array.isArray(requirements) || !requirements.length) return [];
        const ids = [];
        for (const requirement of requirements) {
          if (!requirement || typeof requirement !== "object") continue;
          for (const id of Object.keys(requirement)) ids.push(id);
        }
        return [...new Set(ids)];
      };

      /** Stable group name for this op: single scheme, or merged combo (userId+merchantId). */
      const requiredGroupName = (op) => {
        const ids = securitySchemeIds(op);
        if (!ids.length) return null;
        if (ids.length === 1) return ids[0];
        return ids.slice().sort().join("+");
      };

      /** Fixed hint next to Headers — what this API needs to work. */
      const requiredAuthHint = (op) => {
        const ids = securitySchemeIds(op);
        if (!ids.length) return "";
        return "Required: " + ids.join(" + ");
      };

      /** Ensure merged combo group exists in the active env (lazy for older localStorage). */
      const ensureRequiredHeaderGroup = (op) => {
        const name = requiredGroupName(op);
        if (!name) return null;
        const env = activeEnvConfig();
        const groups = env.headerGroups || (env.headerGroups = {});
        if (groups[name]) return name;
        const ids = securitySchemeIds(op);
        const byKey = {};
        for (const id of ids) {
          for (const row of groups[id] || []) {
            if (!row.key) continue;
            byKey[row.key] = { key: row.key, value: row.value };
          }
        }
        if (!Object.keys(byKey).length) return null;
        if (!byKey["content-type"]) byKey["content-type"] = { key: "content-type", value: "application/json" };
        groups[name] = Object.values(byKey);
        return name;
      };

      /**
       * On operation select: switch to the required (possibly merged) group once.
       * User can still change the group from the top env panel afterward; Send follows that.
       */
      const syncHeaderGroupForOp = (op) => {
        const name = ensureRequiredHeaderGroup(op);
        if (!name) return;
        if (store.activeGroup === name) return;
        store.activeGroup = name;
        persistStore();
        syncEnvTrigger();
        if (document.getElementById("env-wrap")?.classList.contains("open")) renderEnvPop();
      };

      const currentBaseUrl = () => String(interpolate(varMap().baseUrl || defaultBaseUrl, varMap()) || defaultBaseUrl).replace(/\/$/, "");

      const envLabel = () => store.activeEnv + " · " + store.activeGroup;

      const syncEnvTrigger = () => {
        const trigger = document.getElementById("env-trigger");
        if (!trigger) return;
        trigger.textContent = envLabel();
        const base = varMap().baseUrl || "";
        trigger.title = base ? store.activeEnv + " · " + base + " · " + store.activeGroup : envLabel();
      };

      const presetBaseUrl = (name) => {
        const env = store.envs[name];
        if (!env) return "";
        const row = (env.variables || []).find((entry) => entry.key === "baseUrl");
        return row ? String(row.value || "") : "";
      };

      const addNamedPreset = (name, baseUrl) => {
        if (!name || store.envs[name]) return false;
        const env = cloneDefaultEnv();
        setEnvBaseUrl(env, baseUrl || defaultBaseUrl);
        store.envs[name] = env;
        store.activeEnv = name;
        store.activeGroup = Object.keys(env.headerGroups || {})[0] || "default";
        return true;
      };

      const renderEnvPop = () => {
        const env = activeEnvConfig();
        const envNames = Object.keys(store.envs);
        const groups = Object.keys(env.headerGroups || {});
        if (!groups.includes(store.activeGroup)) store.activeGroup = groups[0] || "default";
        const groupRows = env.headerGroups[store.activeGroup] || [];
        const canRemoveEnv = envNames.length > 1;
        const canRemoveGroup = groups.length > 1;
        const activeBase = presetBaseUrl(store.activeEnv) || defaultBaseUrl;
        const quickPresets = [
          { id: "staging", baseUrl: (configuredPresets.staging && configuredPresets.staging.baseUrl) || "https://api.staging.example.com" },
          { id: "production", baseUrl: (configuredPresets.production && configuredPresets.production.baseUrl) || "https://api.example.com" },
        ].filter((preset) => !store.envs[preset.id]);

        document.getElementById("env-pop").innerHTML = `
          <div class="env-block">
            <div class="env-label">Presets</div>
            <div class="chip-row">
              ${envNames
                .map((id) => `<button type="button" class="chip-btn ${id === store.activeEnv ? "on" : ""}" data-env="${escapeAttr(id)}" title="${escapeAttr(presetBaseUrl(id))}">${escapeAttr(id)}</button>`)
                .join("")}
              <button type="button" class="ghost-btn" id="add-env" title="Add preset">+</button>
              <button type="button" class="ghost-btn" id="dup-env" title="Duplicate preset">⧉</button>
              <button type="button" class="ghost-btn" id="remove-env" title="Remove preset" ${canRemoveEnv ? "" : "disabled"}>×</button>
            </div>
            <div class="env-base-line"><span>baseUrl</span> · ${escapeAttr(activeBase)}</div>
            ${
              quickPresets.length
                ? `<div class="env-quick">${quickPresets
                    .map(
                      (preset) =>
                        `<button type="button" class="btn sm" data-quick-preset="${escapeAttr(preset.id)}" data-base="${escapeAttr(preset.baseUrl)}">+ ${escapeAttr(preset.id)}</button>`,
                    )
                    .join("")}</div>`
                : ""
            }
          </div>
          <div class="env-block">
            <div class="env-label">Variables</div>
            ${(env.variables || [])
              .map(
                (row, index) => `<div class="env-kv ${row.key === "baseUrl" ? "base-url" : ""}" data-var="${index}">
                  <input class="env-cell" data-field="key" spellcheck="false" value="${escapeAttr(row.key)}" ${row.key === "baseUrl" ? "readonly" : ""} />
                  <input class="env-cell" data-field="value" spellcheck="false" value="${escapeAttr(row.value)}" />
                  <button type="button" class="ghost-btn" data-remove-var="${index}" ${row.key === "baseUrl" ? "disabled" : ""}>×</button>
                </div>`,
              )
              .join("")}
            <button type="button" class="btn env-add" id="add-var">Add variable</button>
          </div>
          <div class="env-block">
            <div class="env-label">Header group</div>
            <div class="chip-row">
              ${groups
                .map((group) => `<button type="button" class="chip-btn ${group === store.activeGroup ? "on" : ""}" data-group="${escapeAttr(group)}">${escapeAttr(group)}</button>`)
                .join("")}
              <button type="button" class="ghost-btn" id="add-group" title="Add header group">+</button>
              <button type="button" class="ghost-btn" id="remove-group" title="Remove header group" ${canRemoveGroup ? "" : "disabled"}>×</button>
            </div>
            ${groupRows
              .map(
                (row, index) => `<div class="env-kv" data-hdr="${index}">
                  <input class="env-cell" data-field="key" spellcheck="false" value="${escapeAttr(row.key)}" />
                  <input class="env-cell" data-field="value" spellcheck="false" value="${escapeAttr(row.value)}" />
                  <button type="button" class="ghost-btn" data-remove-hdr="${index}">×</button>
                </div>`,
              )
              .join("")}
            <button type="button" class="btn env-add" id="add-hdr">Add header</button>
          </div>
        `;

        syncEnvTrigger();

        document.getElementById("env-pop").querySelectorAll("[data-env]").forEach((button) => {
          button.onclick = (event) => {
            event.stopPropagation();
            store.activeEnv = button.dataset.env;
            const nextGroups = Object.keys(activeEnvConfig().headerGroups || {});
            if (!nextGroups.includes(store.activeGroup)) store.activeGroup = nextGroups[0] || "default";
            persistStore();
            renderEnvPop();
            renderMain();
          };
        });
        document.getElementById("env-pop").querySelectorAll("[data-quick-preset]").forEach((button) => {
          button.onclick = (event) => {
            event.stopPropagation();
            if (!addNamedPreset(button.dataset.quickPreset, button.dataset.base)) return;
            persistStore();
            renderEnvPop();
            renderMain();
          };
        });
        document.getElementById("add-env").onclick = (event) => {
          event.stopPropagation();
          const typed = window.prompt("Preset name (e.g. staging)", "staging");
          if (!typed) return;
          const name = typed.trim().replace(/\s+/g, "-");
          if (!name) return;
          if (store.envs[name]) {
            store.activeEnv = name;
          } else {
            const base = window.prompt("baseUrl", configuredPresets[name]?.baseUrl || defaultBaseUrl) || defaultBaseUrl;
            addNamedPreset(name, base.replace(/\/$/, ""));
          }
          persistStore();
          renderEnvPop();
          renderMain();
        };
        document.getElementById("dup-env").onclick = (event) => {
          event.stopPropagation();
          const source = store.activeEnv;
          let name = source + "-copy";
          let n = 2;
          while (store.envs[name]) {
            name = source + "-copy" + n;
            n += 1;
          }
          store.envs[name] = JSON.parse(JSON.stringify(activeEnvConfig()));
          store.activeEnv = name;
          persistStore();
          renderEnvPop();
          renderMain();
        };
        document.getElementById("remove-env").onclick = (event) => {
          event.stopPropagation();
          const names = Object.keys(store.envs);
          if (names.length <= 1 || !store.envs[store.activeEnv]) return;
          delete store.envs[store.activeEnv];
          store.activeEnv = Object.keys(store.envs)[0];
          const nextGroups = Object.keys(activeEnvConfig().headerGroups || {});
          store.activeGroup = nextGroups.includes(store.activeGroup) ? store.activeGroup : nextGroups[0] || "default";
          persistStore();
          renderEnvPop();
          renderMain();
        };
        document.getElementById("env-pop").querySelectorAll("[data-group]").forEach((button) => {
          button.onclick = (event) => {
            event.stopPropagation();
            store.activeGroup = button.dataset.group;
            persistStore();
            renderEnvPop();
            renderMain();
          };
        });
        document.getElementById("add-group").onclick = (event) => {
          event.stopPropagation();
          let name = "group";
          let n = 1;
          const groupsMap = activeEnvConfig().headerGroups;
          while (groupsMap[name + n]) n += 1;
          name = name + n;
          groupsMap[name] = [{ key: "content-type", value: "application/json" }];
          store.activeGroup = name;
          persistStore();
          renderEnvPop();
          renderMain();
        };
        document.getElementById("remove-group").onclick = (event) => {
          event.stopPropagation();
          const groupsMap = activeEnvConfig().headerGroups;
          const names = Object.keys(groupsMap || {});
          if (names.length <= 1 || !groupsMap[store.activeGroup]) return;
          delete groupsMap[store.activeGroup];
          store.activeGroup = Object.keys(groupsMap)[0] || "default";
          persistStore();
          renderEnvPop();
          renderMain();
        };
        document.getElementById("env-pop").querySelectorAll("[data-var]").forEach((row) => {
          row.querySelectorAll("input").forEach((input) => {
            input.oninput = () => {
              const index = Number(row.dataset.var);
              const field = input.dataset.field;
              if (!activeEnvConfig().variables[index] || (field !== "key" && field !== "value")) return;
              activeEnvConfig().variables[index][field] = input.value;
              persistStore();
              syncEnvTrigger();
              if (field === "value" && activeEnvConfig().variables[index].key === "baseUrl") renderMain();
            };
            input.onchange = () => renderMain();
          });
        });
        document.getElementById("env-pop").querySelectorAll("[data-remove-var]").forEach((button) => {
          button.onclick = (event) => {
            event.stopPropagation();
            activeEnvConfig().variables.splice(Number(button.dataset.removeVar), 1);
            persistStore();
            renderEnvPop();
            renderMain();
          };
        });
        document.getElementById("add-var").onclick = (event) => {
          event.stopPropagation();
          activeEnvConfig().variables.push({ key: "", value: "" });
          persistStore();
          renderEnvPop();
        };
        document.getElementById("env-pop").querySelectorAll("[data-hdr]").forEach((row) => {
          row.querySelectorAll("input").forEach((input) => {
            input.oninput = () => {
              const index = Number(row.dataset.hdr);
              const field = input.dataset.field;
              const rows = activeEnvConfig().headerGroups[store.activeGroup] || [];
              if (!rows[index] || (field !== "key" && field !== "value")) return;
              rows[index][field] = input.value;
              persistStore();
            };
            input.onchange = () => renderMain();
          });
        });
        document.getElementById("env-pop").querySelectorAll("[data-remove-hdr]").forEach((button) => {
          button.onclick = (event) => {
            event.stopPropagation();
            (activeEnvConfig().headerGroups[store.activeGroup] || []).splice(Number(button.dataset.removeHdr), 1);
            persistStore();
            renderEnvPop();
            renderMain();
          };
        });
        document.getElementById("add-hdr").onclick = (event) => {
          event.stopPropagation();
          const groupsMap = activeEnvConfig().headerGroups;
          groupsMap[store.activeGroup] = groupsMap[store.activeGroup] || [];
          groupsMap[store.activeGroup].push({ key: "", value: "" });
          persistStore();
          renderEnvPop();
        };
      };

      document.title = title || "API Documentation";
      const brandEl = document.getElementById("brand");
      if (brandEl) brandEl.textContent = title;
      const specVersion = (spec.info && spec.info.version) || "";
      const navVersion = document.getElementById("nav-version");
      if (navVersion) navVersion.textContent = specVersion ? (specVersion.startsWith("v") ? specVersion : "v" + specVersion) : "";

      const envWrap = document.getElementById("env-wrap");
      document.getElementById("env-trigger").addEventListener("click", (event) => {
        event.stopPropagation();
        envWrap.classList.toggle("open");
        if (envWrap.classList.contains("open")) renderEnvPop();
      });
      document.getElementById("env-pop").addEventListener("click", (event) => event.stopPropagation());
      renderEnvPop();

      const VIEWER_EXTENSIONS = new Set(["x-viewer", "x-docs", "x-scenarios", "x-tree-segments", "x-workspace"]);
      const HTTP_EXPORT = ["get", "post", "put", "patch", "delete", "options", "head", "trace"];

      const stripExt = (value) => {
        if (Array.isArray(value)) return value.map(stripExt);
        if (!value || typeof value !== "object") return value;
        const out = {};
        for (const [key, child] of Object.entries(value)) {
          if (VIEWER_EXTENSIONS.has(key)) continue;
          out[key] = stripExt(child);
        }
        return out;
      };

      /** Path keys follow sidebar tree; real URL kept on x-daxta-url-path when remapped. */
      const exportPathFromTree = (urlPath, treeSegments) => {
        const originalParts = urlPath.split("/").filter(Boolean);
        const paramIdx = originalParts.findIndex((part) => String(part).startsWith("{"));
        const tail = paramIdx >= 0 ? originalParts.slice(paramIdx) : [];
        const treeHasParam = treeSegments.some((part) => String(part).startsWith("{"));
        const parts =
          treeSegments.length === 0
            ? originalParts
            : treeHasParam || paramIdx < 0
              ? treeSegments
              : [...treeSegments, ...tail];
        return "/" + parts.join("/");
      };

      const listOperationExamples = (operation) => {
        const byKey = new Map();
        const add = (key, summary) => {
          if (!key || byKey.has(key)) return;
          byKey.set(key, { key, summary: summary || key });
        };
        const reqExamples = operation?.requestBody?.content?.["application/json"]?.examples;
        for (const [key, example] of Object.entries(reqExamples || {})) {
          add(key, example && example.summary);
        }
        for (const response of Object.values(operation?.responses || {})) {
          const examples = response?.content?.["application/json"]?.examples;
          for (const [key, example] of Object.entries(examples || {})) {
            add(key, example && example.summary);
          }
        }
        return [...byKey.values()];
      };

      const filterExamplesMap = (examples, allowedKeys) => {
        if (!examples || typeof examples !== "object") return examples;
        if (!allowedKeys) return examples;
        const out = {};
        for (const [key, value] of Object.entries(examples)) {
          if (allowedKeys.has(key)) out[key] = value;
        }
        return out;
      };

      const filterOperationExamples = (operation, allowedKeys) => {
        if (!allowedKeys) return operation;
        const next = { ...operation };
        if (next.requestBody?.content?.["application/json"]?.examples) {
          const media = { ...next.requestBody.content["application/json"] };
          media.examples = filterExamplesMap(media.examples, allowedKeys);
          next.requestBody = {
            ...next.requestBody,
            content: { ...next.requestBody.content, "application/json": media },
          };
        }
        if (next.responses) {
          const responses = {};
          for (const [status, response] of Object.entries(next.responses)) {
            if (!response?.content?.["application/json"]?.examples) {
              responses[status] = response;
              continue;
            }
            const media = { ...response.content["application/json"] };
            media.examples = filterExamplesMap(media.examples, allowedKeys);
            responses[status] = {
              ...response,
              content: { ...response.content, "application/json": media },
            };
          }
          next.responses = responses;
        }
        return next;
      };

      /** Rename example map keys to scenario titles; set summary+description (Postman-friendly). */
      const promoteExampleLabels = (examples) => {
        if (!examples || typeof examples !== "object") return examples;
        const out = {};
        for (const [key, example] of Object.entries(examples)) {
          if (!example || typeof example !== "object") continue;
          const summary = String(example.summary || example.description || key).trim() || key;
          let name = summary;
          let n = 2;
          while (Object.prototype.hasOwnProperty.call(out, name)) {
            name = summary + " (" + n + ")";
            n += 1;
          }
          out[name] = {
            summary,
            description: summary,
            value: example.value,
          };
        }
        return out;
      };

      const promoteOperationExampleLabels = (operation) => {
        const next = { ...operation };
        if (next.requestBody?.content?.["application/json"]?.examples) {
          const media = { ...next.requestBody.content["application/json"] };
          media.examples = promoteExampleLabels(media.examples);
          next.requestBody = {
            ...next.requestBody,
            content: { ...next.requestBody.content, "application/json": media },
          };
        }
        if (next.responses) {
          const responses = {};
          for (const [status, response] of Object.entries(next.responses)) {
            const examples = response?.content?.["application/json"]?.examples;
            if (!examples) {
              responses[status] = response;
              continue;
            }
            const media = { ...response.content["application/json"] };
            media.examples = promoteExampleLabels(examples);
            const labels = Object.keys(media.examples);
            responses[status] = {
              ...response,
              // Single example: description becomes the scenario title (Postman uses this as the example name).
              description: labels.length === 1 ? labels[0] : response.description || status,
              content: { ...response.content, "application/json": media },
            };
          }
          next.responses = responses;
        }
        return next;
      };

      const toExportSpec = (source, selectedByOpId) => {
        const pathsIn = source.paths || {};
        const pathsOut = {};
        const tagNames = new Set();

        for (const [urlPath, pathItem] of Object.entries(pathsIn)) {
          if (!pathItem || typeof pathItem !== "object") continue;

          let treeSegments = null;
          for (const [method, operation] of Object.entries(pathItem)) {
            if (!HTTP_EXPORT.includes(method) || !operation || typeof operation !== "object") continue;
            treeSegments = operation["x-tree-segments"] || urlPath.split("/").filter(Boolean);
            break;
          }
          if (!treeSegments) treeSegments = urlPath.split("/").filter(Boolean);

          const exportPath = exportPathFromTree(urlPath, treeSegments);
          const itemOut = { ...(pathsOut[exportPath] || {}) };

          for (const [method, operation] of Object.entries(pathItem)) {
            if (!HTTP_EXPORT.includes(method) || !operation || typeof operation !== "object") {
              if (!HTTP_EXPORT.includes(method) && itemOut[method] === undefined) {
                itemOut[method] = stripExt(operation);
              }
              continue;
            }
            const segments = operation["x-tree-segments"] || urlPath.split("/").filter(Boolean);
            let cleaned = stripExt(operation);
            const opId = method + ":" + urlPath;
            if (selectedByOpId && selectedByOpId.has(opId)) {
              cleaned = filterOperationExamples(cleaned, selectedByOpId.get(opId));
            }
            cleaned = promoteOperationExampleLabels(cleaned);
            const tagParts = segments.filter((part) => !String(part).startsWith("{"));
            const tag = tagParts.length ? tagParts.join(" / ") : "API";
            cleaned.tags = [tag];
            cleaned["x-tree-segments"] = segments;
            tagNames.add(tag);
            if (exportPath !== urlPath) cleaned["x-daxta-url-path"] = urlPath;
            itemOut[method] = cleaned;
          }
          pathsOut[exportPath] = itemOut;
        }

        const ordered = {};
        for (const key of Object.keys(pathsOut).sort((a, b) => a.localeCompare(b))) ordered[key] = pathsOut[key];

        return {
          openapi: source.openapi || "3.0.3",
          info: stripExt(source.info) || { title: title, version: "0.0.0" },
          ...(source.servers ? { servers: stripExt(source.servers) } : {}),
          tags: [...tagNames].sort((a, b) => a.localeCompare(b)).map((name) => ({ name })),
          paths: ordered,
          ...(source.components ? { components: stripExt(source.components) } : {}),
        };
      };

      const headerRowsForExport = () => {
        const env = activeEnvConfig();
        const groups = env.headerGroups || {};
        return groups[store.activeGroup] || groups[Object.keys(groups)[0]] || [];
      };

      const buildPostmanEnvironment = () => {
        const env = activeEnvConfig();
        const values = (env.variables || [])
          .filter((row) => row.key)
          .map((row) => ({
            key: row.key,
            value: String(row.value ?? ""),
            type: "default",
            enabled: true,
          }));
        // Ensure header template vars referenced as {{x}} appear even if missing from variables list.
        const known = new Set(values.map((row) => row.key));
        if (!known.has("baseUrl")) {
          known.add("baseUrl");
          values.unshift({
            key: "baseUrl",
            value: String(presetBaseUrl(store.activeEnv) || defaultBaseUrl || ""),
            type: "default",
            enabled: true,
          });
        }
        for (const row of headerRowsForExport()) {
          const text = String(row.value || "");
          const matches = text.matchAll(/\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/g);
          for (const match of matches) {
            if (known.has(match[1])) continue;
            known.add(match[1]);
            values.push({ key: match[1], value: "", type: "default", enabled: true });
          }
        }
        return {
          id: typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
          name: (workspace || title || "API") + " · " + store.activeEnv,
          values,
          _postman_variable_scope: "environment",
          _postman_exported_at: new Date().toISOString(),
          _postman_exported_using: "DAxTA",
        };
      };

      const STATUS_EXPORT = {
        200: "OK",
        201: "Created",
        204: "No Content",
        400: "Bad Request",
        401: "Unauthorized",
        403: "Forbidden",
        404: "Not Found",
        409: "Conflict",
        422: "Unprocessable Entity",
        500: "Internal Server Error",
      };

      const postmanUrlFromPath = (serverUrl, pathTemplate) => {
        const base = String(serverUrl || "{{baseUrl}}").replace(/\/$/, "");
        const path = String(pathTemplate || "/");
        const segments = path.split("/").filter(Boolean);
        const pathParams = [...path.matchAll(/\{([^}]+)\}/g)].map((m) => m[1]);
        return {
          raw: base + (path.startsWith("/") ? path : "/" + path),
          host: base.startsWith("{{") ? [base] : [base.replace(/^https?:\/\//, "").split("/")[0]],
          path: segments.map((seg) => (seg.startsWith("{") && seg.endsWith("}") ? ":" + seg.slice(1, -1) : seg)),
          variable: pathParams.map((key) => ({ key, value: "" })),
        };
      };

      const collectionFolderSegments = (urlPath, operation) => {
        const fromTree = operation && operation["x-tree-segments"];
        const parts = Array.isArray(fromTree) && fromTree.length
          ? fromTree.map(String)
          : String(urlPath || "").split("/").filter(Boolean);
        const named = parts.filter((part) => part && !part.startsWith("{"));
        return named.length ? named : ["API"];
      };

      const pushIntoFolderTree = (root, segments, requestItem) => {
        let level = root;
        for (let index = 0; index < segments.length; index += 1) {
          const name = segments[index];
          let folder = level.find((entry) => entry && entry.name === name && Array.isArray(entry.item) && !entry.request);
          if (!folder) {
            folder = { name, item: [] };
            level.push(folder);
          }
          if (index === segments.length - 1) folder.item.push(requestItem);
          else level = folder.item;
        }
      };

      const sortCollectionTree = (items) => {
        const folders = items.filter((entry) => entry && Array.isArray(entry.item) && !entry.request);
        const requests = items.filter((entry) => entry && entry.request);
        folders.sort((left, right) => String(left.name).localeCompare(String(right.name)));
        for (const folder of folders) folder.item = sortCollectionTree(folder.item);
        requests.sort((left, right) => String(left.name).localeCompare(String(right.name)));
        return [...folders, ...requests];
      };

      const collectionRequestHeaders = (operation, includeTryIt) => {
        const byLower = new Map();
        const add = (key, value) => {
          if (!key) return;
          const lower = String(key).toLowerCase();
          if (lower === "host" || lower === "content-length") return;
          byLower.set(lower, { key, value: value != null ? String(value) : "", type: "text" });
        };
        for (const param of operation.parameters || []) {
          if (param && param.in === "header" && param.name) add(param.name, param.example != null ? param.example : "");
        }
        if (includeTryIt) {
          for (const row of headerRowsForExport()) add(row.key, row.value ?? "");
        }
        return [...byLower.values()];
      };

      /**
       * Postman Collection v2.1 — nested folders + named examples.
       * When includeTryIt, requests use {{baseUrl}} and the active header group; env file is downloaded separately.
       */
      const buildPostmanCollection = (openapi, includeTryIt) => {
        const specServer = (openapi.servers && openapi.servers[0] && openapi.servers[0].url) || "{{baseUrl}}";
        const serverUrl = includeTryIt ? "{{baseUrl}}" : specServer;
        const root = [];

        for (const [urlPath, pathItem] of Object.entries(openapi.paths || {})) {
          if (!pathItem || typeof pathItem !== "object") continue;
          for (const method of HTTP_EXPORT) {
            const operation = pathItem[method];
            if (!operation || typeof operation !== "object") continue;
            const requestPath = operation["x-daxta-url-path"] || urlPath;
            const requestHeaders = collectionRequestHeaders(operation, includeTryIt);

            const reqExamples = operation.requestBody?.content?.["application/json"]?.examples || {};
            const firstReq = Object.values(reqExamples)[0];
            const defaultBody =
              firstReq && firstReq.value !== undefined
                ? typeof firstReq.value === "string"
                  ? firstReq.value
                  : JSON.stringify(firstReq.value, null, 2)
                : undefined;

            const baseRequest = {
              method: method.toUpperCase(),
              header: requestHeaders,
              url: postmanUrlFromPath(serverUrl, requestPath),
              description: operation.summary || "",
            };
            if (defaultBody !== undefined) {
              baseRequest.body = { mode: "raw", raw: defaultBody, options: { raw: { language: "json" } } };
              if (!requestHeaders.some((h) => String(h.key).toLowerCase() === "content-type")) {
                baseRequest.header = [...requestHeaders, { key: "Content-Type", value: "application/json", type: "text" }];
              }
            }

            const responses = [];
            for (const [status, response] of Object.entries(operation.responses || {})) {
              const examples = response?.content?.["application/json"]?.examples || {};
              const entries = Object.entries(examples);
              if (!entries.length) {
                responses.push({
                  name: response.description || STATUS_EXPORT[status] || status,
                  originalRequest: baseRequest,
                  status: STATUS_EXPORT[status] || response.description || status,
                  code: Number(status) || 0,
                  _postman_previewlanguage: "json",
                  header: [{ key: "Content-Type", value: "application/json" }],
                  body: "",
                });
                continue;
              }
              for (const [exKey, example] of entries) {
                const name = (example && (example.summary || example.description)) || exKey;
                const reqMatch = reqExamples[exKey] || reqExamples[name] || firstReq;
                const requestForExample = { ...baseRequest, header: [...(baseRequest.header || [])] };
                if (reqMatch && reqMatch.value !== undefined) {
                  const raw =
                    typeof reqMatch.value === "string" ? reqMatch.value : JSON.stringify(reqMatch.value, null, 2);
                  requestForExample.body = { mode: "raw", raw, options: { raw: { language: "json" } } };
                }
                const bodyValue = example && example.value !== undefined ? example.value : "";
                responses.push({
                  name,
                  originalRequest: requestForExample,
                  status: STATUS_EXPORT[status] || String(status),
                  code: Number(status) || 0,
                  _postman_previewlanguage: "json",
                  header: [{ key: "Content-Type", value: "application/json" }],
                  body: typeof bodyValue === "string" ? bodyValue : JSON.stringify(bodyValue, null, 2),
                });
              }
            }

            pushIntoFolderTree(root, collectionFolderSegments(urlPath, operation), {
              name: operation.summary || method.toUpperCase() + " " + requestPath,
              request: baseRequest,
              response: responses,
            });
          }
        }

        const item = sortCollectionTree(root);

        return {
          info: {
            _postman_id: typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
            name: (openapi.info && openapi.info.title) || workspace || title || "API",
            description: (openapi.info && openapi.info.description) || "Exported from API docs with named examples",
            schema: "https://schema.getpostman.com/json/collection/v2.1.0/collection.json",
          },
          item,
        };
      };

      const closeExportModal = () => {
        document.body.classList.remove("exporting");
      };

      const syncExportTryItUi = () => {
        const meta = document.getElementById("export-tryit-meta");
        if (meta) meta.textContent = store.activeEnv + " · " + store.activeGroup;
      };

      const openExportModal = () => {
        const body = document.getElementById("export-body");
        const blocks = ops
          .map((item) => {
            const examples = listOperationExamples(item.op);
            if (!examples.length) return "";
            return `<div class="export-op" data-op="${escapeAttr(item.id)}">
              <div class="export-op-title">
                <span class="method ${item.method}">${item.method}</span>
                <span class="path" title="${escapeAttr(item.path)}">${escapeAttr(item.path)}</span>
              </div>
              ${examples
                .map(
                  (example) => `<div class="export-ex">
                    <input type="checkbox" id="ex-${escapeAttr(item.id)}-${escapeAttr(example.key)}" data-op="${escapeAttr(item.id)}" data-key="${escapeAttr(example.key)}" checked />
                    <label for="ex-${escapeAttr(item.id)}-${escapeAttr(example.key)}">${escapeAttr(example.summary)}</label>
                  </div>`,
                )
                .join("")}
            </div>`;
          })
          .filter(Boolean)
          .join("");
        body.innerHTML = blocks || `<div class="export-empty">No recorded examples yet — export will include schemas only.</div>`;
        syncExportTryItUi();
        document.body.classList.add("exporting");
      };

      const collectSelectedExamples = () => {
        const selectedByOpId = new Map();
        document.querySelectorAll("#export-body input[type=checkbox]").forEach((input) => {
          const opId = input.dataset.op;
          const key = input.dataset.key;
          if (!opId || !key) return;
          if (!selectedByOpId.has(opId)) selectedByOpId.set(opId, new Set());
          if (input.checked) selectedByOpId.get(opId).add(key);
        });
        return selectedByOpId;
      };

      const downloadJsonFile = (filename, value) => {
        const blob = new Blob([JSON.stringify(value, null, 2) + "\n"], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      };

      const exportSafeName = () =>
        String(workspace || title || "openapi")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-|-$/g, "") || "daxta";

      const runExportDownload = () => {
        const selectedByOpId = collectSelectedExamples();
        const exported = toExportSpec(spec, selectedByOpId);
        const includeTryIt = Boolean(document.getElementById("export-include-tryit")?.checked);
        const base = exportSafeName();

        downloadJsonFile(base + ".postman_collection.json", buildPostmanCollection(exported, includeTryIt));
        if (includeTryIt) {
          setTimeout(() => {
            downloadJsonFile(base + ".postman_environment.json", buildPostmanEnvironment());
          }, 120);
        }
      };

      document.getElementById("export-openapi").addEventListener("click", (event) => {
        event.stopPropagation();
        openExportModal();
      });
      document.getElementById("export-cancel").addEventListener("click", closeExportModal);
      document.getElementById("export-backdrop").addEventListener("click", (event) => {
        if (event.target.id === "export-backdrop") closeExportModal();
      });
      document.getElementById("export-modal").addEventListener("click", (event) => event.stopPropagation());
      document.getElementById("export-all").addEventListener("click", () => {
        document.querySelectorAll("#export-body input[type=checkbox]").forEach((input) => {
          input.checked = true;
        });
      });
      document.getElementById("export-none").addEventListener("click", () => {
        document.querySelectorAll("#export-body input[type=checkbox]").forEach((input) => {
          input.checked = false;
        });
      });
      document.getElementById("export-success").addEventListener("click", () => {
        document.querySelectorAll("#export-body input[type=checkbox]").forEach((input) => {
          const label = document.querySelector(`label[for="${CSS.escape(input.id)}"]`);
          const text = label ? label.textContent || "" : "";
          input.checked = /^2\d\d\b/.test(text.trim());
        });
      });
      document.getElementById("export-confirm").addEventListener("click", () => {
        runExportDownload();
        closeExportModal();
      });

      const HTTP = ["get", "post", "put", "patch", "delete"];
      const STATUS = { 200: "OK", 201: "Created", 204: "No Content", 400: "Bad Request", 401: "Unauthorized", 404: "Not Found", 409: "Conflict", 422: "Unprocessable Entity" };
      const GROUP_ORDER = [
        "POSITIVE CASES",
        "SEMANTIC ERROR CASES",
        "INVALID CASES",
        "OMITTED CASES",
        "SEMANTIC ERROR CASES - AUTH",
        "Other",
      ];
      const METHOD_ORDER = { get: 0, post: 1, put: 2, patch: 3, delete: 4 };

      const ops = [];
      for (const [path, item] of Object.entries(spec.paths || {})) {
        for (const method of HTTP) {
          if (!item[method]) continue;
          ops.push({
            id: method + ":" + path,
            method,
            path,
            op: item[method],
            title: item[method].summary || path,
            docs: item[method]["x-docs"] || { fields: [] },
            scenarios: item[method]["x-scenarios"] || [],
            treeSegments: item[method]["x-tree-segments"] || path.split("/").filter(Boolean),
          });
        }
      }

      const highlight = (value) => {
        if (value === undefined || value === null || value === "") return "";
        return JSON.stringify(value, null, 2)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/"([^"]+)":/g, '<span class="k">"$1"</span>:')
          .replace(/: "([^"]*)"/g, ': <span class="s">"$1"</span>')
          .replace(/: (-?\d+(?:\.\d+)?)/g, ': <span class="n">$1</span>')
          .replace(/: (true|false|null)/g, ': <span class="p">$1</span>');
      };

      const copyBodyText = (value) => {
        if (value === undefined || value === "") return null;
        if (typeof value === "string") return value;
        return JSON.stringify(value, null, 2);
      };

      const copyIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;

      const showToast = (message) => {
        let toast = document.getElementById("toast");
        if (!toast) {
          toast = document.createElement("div");
          toast.id = "toast";
          toast.className = "toast";
          document.body.appendChild(toast);
        }
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(showToast._timer);
        showToast._timer = setTimeout(() => toast.classList.remove("show"), 1400);
      };

      const copy = async (text, button, label) => {
        try {
          await navigator.clipboard.writeText(text);
          if (button && button.classList.contains("icon")) {
            showToast("Kopyalandı");
            return;
          }
          const previous = button.textContent;
          button.textContent = "Copied";
          setTimeout(() => (button.textContent = label || previous), 1200);
        } catch {}
      };

      const resolvedUrl = (item, scenario) => {
        const vars = varMap();
        let path = item.path;
        for (const [name, value] of Object.entries(scenario.pathParams || {})) {
          const fromVar = vars[name] ? String(interpolate(vars[name], vars)) : value;
          path = path.replace("{" + name + "}", encodeURIComponent(fromVar ?? ""));
        }
        const query = { ...(scenario.query || {}) };
        for (const key of Object.keys(query)) {
          if (vars[key]) query[key] = String(interpolate(vars[key], vars));
        }
        const qs = new URLSearchParams(query).toString();
        return currentBaseUrl() + path + (qs ? "?" + qs : "");
      };

      /**
       * Active Try-it header group wins: switching the group at the top overwrites
       * the example request headers (Send + cURL + Headers panel).
       * If the group is empty, fall back to what was recorded.
       */
      const requestHeadersForScenario = (scenario) => {
        const vars = varMap();
        const envHeaders = resolvedHeaders();
        if (Object.keys(envHeaders).length) {
          const out = {};
          for (const [name, value] of Object.entries(envHeaders)) {
            out[name] = String(interpolate(value, vars));
          }
          return out;
        }
        const recorded = { ...(scenario.headers || {}) };
        const out = {};
        for (const [name, value] of Object.entries(recorded)) {
          out[name] = String(interpolate(value, vars));
        }
        return out;
      };

      const toCurl = (item, scenario) => {
        const headers = requestHeadersForScenario(scenario);
        const body = scenario.reqBody !== undefined ? interpolate(scenario.reqBody, varMap()) : undefined;
        const lines = ["curl -X " + item.method.toUpperCase() + " '" + resolvedUrl(item, scenario).replace(/'/g, "'\\''") + "'"];
        for (const [name, value] of Object.entries(headers)) {
          lines.push("  -H '" + name + ": " + String(value).replace(/'/g, "'\\''") + "'");
        }
        if (body !== undefined && item.method !== "get") {
          lines.push("  -d '" + JSON.stringify(body, null, 2).replace(/'/g, "'\\''") + "'");
        }
        return lines.join(" \\\n");
      };

      const proxyUrl = (target) => {
        try {
          const absolute = new URL(target, location.href);
          if (absolute.origin === location.origin) return absolute.href;
        } catch {}
        if (location.protocol === "http:" || location.protocol === "https:") {
          return "/__proxy?target=" + encodeURIComponent(target);
        }
        return target;
      };

      const sendRequest = async (item, scenario) => {
        const target = resolvedUrl(item, scenario);
        const headers = { ...requestHeadersForScenario(scenario) };
        const body = scenario.reqBody !== undefined ? interpolate(scenario.reqBody, varMap()) : undefined;
        if (body !== undefined && !headers["content-type"] && !headers["Content-Type"]) {
          headers["content-type"] = "application/json";
        }
        const init = {
          method: item.method.toUpperCase(),
          headers,
        };
        if (body !== undefined && item.method !== "get" && item.method !== "head") {
          init.body = typeof body === "string" ? body : JSON.stringify(body);
        }
        const started = performance.now();
        const response = await fetch(proxyUrl(target), init);
        const text = await response.text();
        const ms = Math.max(1, Math.round(performance.now() - started));
        let parsed = text;
        try {
          parsed = text ? JSON.parse(text) : undefined;
        } catch {
          parsed = text;
        }
        return { status: response.status, body: parsed, ok: response.ok, ms, bytes: text.length };
      };

      const groupScenarios = (scenarios) => {
        const groups = {};
        (scenarios || []).forEach((scenario, index) => {
          const group = scenario.group || "Other";
          (groups[group] ||= []).push({ scenario, index });
        });
        const order = GROUP_ORDER.filter((name) => groups[name]).concat(
          Object.keys(groups).filter((name) => !GROUP_ORDER.includes(name)),
        );
        return { groups, order };
      };

      const GROUP_LABEL = {
        "POSITIVE CASES": "Positive cases",
        "SEMANTIC ERROR CASES": "False positive cases",
        "INVALID CASES": "Invalid cases",
        "OMITTED CASES": "Omitted cases",
        "SEMANTIC ERROR CASES - AUTH": "False positive cases — Auth",
        Other: "Other",
      };

      const displayGroup = (group) => GROUP_LABEL[group] || group || "Other";
      const groupTone = (label) => (String(label).toLowerCase() === "positive cases" ? "ok" : "err");
      const statusOk = (status) => Number(status) >= 200 && Number(status) < 300;

      const groupedDropdown = (scenarios, selected) => {
        const { groups, order } = groupScenarios(scenarios);
        const current = scenarios[selected];
        const q = exampleQuery.trim().toLowerCase();
        const kind = current ? displayGroup(current.group) : "";
        const ok = current ? statusOk(current.status) : false;
        return `<div class="dd ${exampleOpen ? "open" : ""}" id="scenario-dd">
          <button type="button" class="dd-toggle" id="scenario-toggle">
            <span class="dd-kicker">Example</span>
            <span class="dd-status ${ok ? "ok" : "err"}">${escapeHtml(String(current?.status ?? ""))}</span>
            <span class="dd-kind">${escapeHtml(kind)}</span>
            <span class="dd-toggle-label">${escapeHtml(current?.name || "Example")}</span>
          </button>
          <div class="dd-menu">
            <input class="dd-search" id="example-search" placeholder="Search examples..." value="${escapeAttr(exampleQuery)}" autocomplete="off" spellcheck="false" />
            <div class="dd-list">${order
              .map((group) => {
                const rows = groups[group].filter(({ scenario }) => {
                  if (!q) return true;
                  return (String(scenario.status) + " " + (scenario.name || "") + " " + (scenario.group || "")).toLowerCase().includes(q);
                });
                if (!rows.length) return "";
                const label = displayGroup(group);
                return `<div class="dd-group ${groupTone(label)}"><span>${escapeHtml(label)} (${rows.length})</span></div>` +
                  rows
                    .map(
                      ({ scenario, index }) =>
                        `<button type="button" class="dd-item ${index === selected ? "on" : ""}" data-index="${index}"><span class="st ${statusOk(scenario.status) ? "ok" : "err"}">${escapeHtml(String(scenario.status))}</span><span>${escapeHtml(scenario.name)}</span></button>`,
                    )
                    .join("");
              })
              .join("")}</div>
          </div>
        </div>`;
      };

      let currentId = ops[0]?.id;
      let scenarioIndex = 0;
      let navQuery = "";
      let exampleQuery = "";
      let exampleOpen = false;
      let jsonMode = { req: "pretty", res: "pretty" };
      const treePathSegments = (item) => item.treeSegments || item.path.split("/").filter(Boolean);
      const apiVersions = [...new Set(ops.map((item) => treePathSegments(item)[0]).filter(Boolean))];
      let activeVersion = apiVersions[0] || "";
      const expandedFolders = new Set(apiVersions.map((version) => "/" + version));
      const expandedExampleOps = new Set();

      const scenarioNavLabel = (scenario) => {
        const status = scenario.status != null ? String(scenario.status) : "";
        const name = scenario.name || "example";
        return status ? status + "  " + name : name;
      };

      const renderNavExamples = (item) => {
        const { groups, order } = groupScenarios(item.scenarios);
        return `<div class="nav-examples">${order
          .map(
            (group) => `<div class="nav-ex-group">
              <div class="nav-ex-group-label"><span>${escapeHtml(displayGroup(group))}</span><span class="nav-ex-count">${groups[group].length}</span></div>
              ${groups[group]
                .map(
                  ({ scenario, index }) =>
                    `<button type="button" class="nav-example ${item.id === currentId && index === scenarioIndex ? "on" : ""}" data-id="${escapeAttr(item.id)}" data-scenario="${index}" title="${escapeAttr(scenarioNavLabel(scenario))}">${escapeHtml(scenarioNavLabel(scenario))}</button>`,
                )
                .join("")}
            </div>`,
          )
          .join("")}</div>`;
      };

      const kv = (label, value) => {
        if (value === undefined || value === "") return "";
        const shown = typeof value === "object" ? JSON.stringify(value) : String(value);
        return `<div class="kv" title="${escapeAttr(label)}: ${escapeAttr(shown)}"><div class="kname">${label}</div><div class="kval">${shown}</div></div>`;
      };

      const metaBlock = (title, bodyHtml, source = "", { always = false } = {}) => {
        if (!always && !bodyHtml) return "";
        return `<div class="meta-block">
          <div class="meta-toolbar">
            <span class="meta-label">${title}</span>
            ${source ? `<span class="meta-source">${source}</span>` : ""}
          </div>
          ${bodyHtml || `<div class="meta-empty">—</div>`}
        </div>`;
      };

      const buildPathTree = (items) => {
        const root = { children: {}, ops: [] };
        for (const item of items) {
          const parts = treePathSegments(item);
          let node = root;
          for (let index = 0; index < parts.length; index += 1) {
            const part = parts[index];
            node.children[part] ??= { children: {}, ops: [] };
            node = node.children[part];
            if (index === parts.length - 1) node.ops.push(item);
          }
        }
        return root;
      };

      const expandPathToItem = (item) => {
        const parts = treePathSegments(item);
        let prefix = "";
        for (const part of parts) {
          prefix += "/" + part;
          expandedFolders.add(prefix);
        }
      };

      const collectVisibleItems = (node) => {
        const items = [...node.ops];
        for (const child of Object.values(node.children)) items.push(...collectVisibleItems(child));
        return items;
      };

      const renderTreeNode = (node, prefix = "", q = "") => {
        const opsHtml = [...node.ops]
          .sort((left, right) => (METHOD_ORDER[left.method] ?? 99) - (METHOD_ORDER[right.method] ?? 99))
          .map((item) => {
            const hasExamples = Array.isArray(item.scenarios) && item.scenarios.length > 0;
            const examplesOpen = expandedExampleOps.has(item.id);
            const exampleCount = hasExamples ? item.scenarios.length : 0;
            return `<div class="nav-op ${item.id === currentId ? "active" : ""} ${examplesOpen ? "examples-open" : ""}" data-op-id="${escapeAttr(item.id)}">
              <div class="nav-op-row">
                <button type="button" class="nav-item" data-id="${escapeAttr(item.id)}" title="${escapeAttr(item.path)}">
                  <span class="method ${item.method}">${item.method}</span>
                  <span class="nav-title">${escapeAttr(item.title)}</span>
                </button>
                ${hasExamples ? `<span class="nav-ex-total" title="${exampleCount} examples">${exampleCount}</span>` : ""}
                <button type="button" class="nav-expand" data-expand-id="${escapeAttr(item.id)}" title="Examples" aria-label="Toggle examples" aria-expanded="${examplesOpen ? "true" : "false"}" ${hasExamples ? "" : "disabled"}>
                  <span class="chev"></span>
                </button>
              </div>
              ${hasExamples ? renderNavExamples(item) : ""}
            </div>`;
          })
          .join("");

        const foldersHtml = Object.entries(node.children)
          .sort(([left], [right]) => left.localeCompare(right))
          .map(([name, child]) => {
            const folderPath = (prefix ? prefix + "/" : "/") + name;
            const subtreeItems = collectVisibleItems(child);
            if (q && !subtreeItems.some((item) => (item.method + " " + item.path + " " + item.title).toLowerCase().includes(q))) return "";
            const open = q ? true : expandedFolders.has(folderPath);
            return `<div class="tree-folder ${open ? "open" : ""}" data-folder="${folderPath}">
              <button type="button" class="tree-folder-toggle" data-folder="${folderPath}">
                <span class="chev"></span>
                <span class="tree-folder-name">${name}</span>
              </button>
              <div class="tree-children">${renderTreeNode(child, folderPath, q)}</div>
            </div>`;
          })
          .join("");

        return opsHtml + foldersHtml;
      };

      const visibleOps = () => {
        if (!activeVersion) return ops;
        return ops.filter((item) => treePathSegments(item)[0] === activeVersion);
      };

      const renderNav = () => {
        const nav = document.getElementById("nav");
        const q = navQuery.trim().toLowerCase();
        if (!ops.length) {
          nav.innerHTML = `<div class="tree-empty">No endpoints recorded</div>`;
          return;
        }
        if (currentId) {
          const active = ops.find((item) => item.id === currentId);
          if (active) expandPathToItem(active);
        }
        nav.innerHTML = `<div class="tree-root">${renderTreeNode(buildPathTree(visibleOps()), "", q)}</div>`;
        nav.querySelectorAll(".nav-item").forEach((button) => {
          button.onclick = () => select(button.dataset.id);
        });
        nav.querySelectorAll(".nav-expand").forEach((button) => {
          button.onclick = (event) => {
            event.stopPropagation();
            if (button.disabled) return;
            const opId = button.dataset.expandId;
            if (expandedExampleOps.has(opId)) expandedExampleOps.delete(opId);
            else expandedExampleOps.add(opId);
            const wrap = button.closest(".nav-op");
            if (wrap) {
              wrap.classList.toggle("examples-open", expandedExampleOps.has(opId));
