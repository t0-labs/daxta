<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>API Documentation</title>
    <link rel="icon" id="favicon" href="__FAVICON_LIGHT_DATA_URI__" />
    <link rel="apple-touch-icon" href="__FAVICON_LIGHT_DATA_URI__" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --canvas: #050505;
        --sidebar: #090909;
        --nav: #090909;
        --paper: #050505;
        --white: #101010;
        --inset: #131313;
        --hairline: #262626;
        --line: #1c1c1c;
        --smoke: #6a6a6a;
        --stone: #8a8a8a;
        --charcoal: #c8c8c8;
        --obsidian: #f4f4f4;
        --accent: #8fa35a;
        --ok: #3dcc70;
        --ok-bg: #16301f;
        --get: #3dcc70;
        --warn: #d4a017;
        --err: #f07171;
        --err-bg: #3a1818;
        --sans: Geist, Inter, ui-sans-serif, system-ui, sans-serif;
        --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        --radius: 2px;
        --ring: 0 0 0 1px #262626;
        --ghost: none;
      }
      html[data-theme="light"] {
        --canvas: #fafafa;
        --sidebar: #fafafa;
        --nav: #ffffff;
        --paper: #fafafa;
        --white: #ffffff;
        --inset: #f5f5f5;
        --hairline: #e6e6e6;
        --line: #e6e6e6;
        --smoke: #888888;
        --stone: #666666;
        --charcoal: #333333;
        --obsidian: #111111;
        --accent: #6f7d3c;
        --ok: #15803d;
        --ok-bg: #e8f8ee;
        --get: #16a34a;
        --warn: #b45309;
        --err: #b42318;
        --err-bg: #fbeaea;
        --ring: 0 0 0 1px #e6e6e6;
        --ghost: 0 0 0 1px #e6e6e6;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; }
      :focus { outline: none; }
      :focus-visible {
        outline: 2px solid #c6c6c6;
        outline-offset: 2px;
      }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--obsidian);
        font: 13px/1.45 var(--sans);
      }
      button, input { font: inherit; color: inherit; }

      .topnav {
        height: 44px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) minmax(0, 1fr);
        align-items: center;
        gap: 12px;
        padding: 0 14px;
        background: var(--nav);
        border-bottom: 1px solid var(--hairline);
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 200;
      }
      body.searching .topnav { z-index: 210; }
      body.search-palette .topnav { z-index: 40; }
      .brand-wrap { display: flex; align-items: center; min-width: 0; justify-self: start; }
      .workspace { display: none; }
      .brand {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.04em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--obsidian);
      }
      .ep-nav {
        justify-self: center;
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        max-width: 100%;
      }
      .ep-name {
        display: flex;
        align-items: baseline;
        gap: 8px;
        min-width: 0;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.02em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--obsidian);
      }
      .ep-status {
        flex: none;
        font: 600 14px/1.4 var(--mono);
        letter-spacing: -0.02em;
        color: var(--ok);
      }
      .ep-status.err { color: var(--err); }
      .ep-label {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .prefix-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin: 0 0 8px;
        flex: none;
      }
      .prefix-bar[hidden] { display: none; }
      .prefix-chip {
        height: 22px;
        padding: 0 8px;
        border: 0;
        border-radius: 2px;
        background: transparent;
        color: var(--stone);
        font: 500 11px/22px var(--mono);
        cursor: pointer;
      }
      .prefix-chip:hover { color: var(--obsidian); background: var(--inset); }
      .prefix-chip.on {
        background: var(--inset);
        color: var(--obsidian);
      }
      .nav-tools { display: flex; align-items: center; gap: 8px; justify-self: end; }
      .nav-tools .btn {
        height: 28px;
        padding: 0 10px;
        font-size: 12px;
      }
      .nav-tools .btn.icon {
        width: 28px;
        height: 28px;
        padding: 0;
      }
      .nav-tools .btn.icon svg { width: 16px; height: 16px; }
      .more-wrap { position: relative; flex: none; }
      .more-pop {
        display: none;
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        width: 260px;
        background: var(--white);
        border: 1px solid var(--hairline);
        border-radius: var(--radius);
        padding: 6px;
        z-index: 220;
      }
      .more-wrap.open .more-pop { display: block; }
      .more-item {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        height: 34px;
        padding: 0 8px;
        border: 0;
        border-radius: 2px;
        background: transparent;
        color: var(--obsidian);
        cursor: pointer;
        font: 500 12px/1 var(--sans);
        text-align: left;
      }
      .more-item:hover { background: var(--inset); }
      .more-item-ico {
        width: 16px;
        height: 16px;
        flex: none;
        color: var(--charcoal);
      }
      .more-item-ico svg { width: 16px; height: 16px; display: block; }
      .more-item-label { flex: 1; min-width: 0; }
      .more-item-meta {
        color: var(--stone);
        font: 500 11px/1 var(--mono);
      }
      html[data-theme="light"] .theme-moon { display: none; }
      html:not([data-theme="light"]) .theme-sun { display: none; }
      .more-sep {
        height: 1px;
        background: var(--hairline);
        margin: 6px 4px;
      }
      .more-section {
        padding: 8px 8px 4px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--stone);
      }
      .more-shortcut {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 6px 8px;
        font-size: 12px;
        color: var(--charcoal);
      }
      .more-shortcut kbd {
        font: 500 11px/1 var(--mono);
        color: var(--stone);
        border: 1px solid var(--hairline);
        border-radius: 2px;
        padding: 3px 5px;
      }
      .btn[data-tip] { position: relative; }
      .btn[data-tip]::after {
        content: attr(data-tip);
        position: absolute;
        top: calc(100% + 8px);
        left: 50%;
        transform: translateX(-50%) translateY(4px);
        background: var(--obsidian);
        color: var(--white);
        font-size: 11px;
        font-weight: 500;
        padding: 6px 8px;
        border-radius: var(--radius);
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.12s ease, transform 0.12s ease;
        z-index: 50;
      }
      .btn[data-tip]:hover::after {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      .search-wrap {
        position: relative;
        width: 100%;
        flex: none;
        z-index: 30;
        margin-bottom: 8px;
      }
      .search {
        width: 100%;
        height: 30px;
        border: 1px solid var(--hairline);
        border-radius: var(--radius);
        box-shadow: none;
        background: var(--white);
        padding: 0 28px 0 10px;
        font-size: 12px;
      }
      .search-kbd {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        font: 500 10px/1 var(--mono);
        color: var(--smoke);
        border: 1px solid var(--hairline);
        border-radius: 2px;
        padding: 3px 5px;
        pointer-events: none;
        background: var(--inset);
      }
      .search::placeholder { color: var(--smoke); }
      .search-wrap.open .search {
        border-color: var(--obsidian);
        border-radius: var(--radius) var(--radius) 0 0;
      }
      .search-wrap.open .search-kbd { display: none; }
      body.searching:not(.search-palette) .tree-scroll,
      body.searching:not(.search-palette) .prefix-bar,
      body.searching:not(.search-palette) .nav-foot {
        filter: blur(7px);
        opacity: 0.4;
        pointer-events: none;
        transition: filter 0.2s ease, opacity 0.2s ease;
      }
      .search-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 80;
        align-items: flex-start;
        justify-content: center;
        padding: 12vh 16px 24px;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }
      html[data-theme="light"] .search-backdrop {
        background: rgba(250, 250, 250, 0.55);
      }
      body.search-palette .search-backdrop { display: flex; }
      .search-palette-card {
        width: min(640px, 100%);
        background: var(--white);
        border: 1px solid var(--hairline);
        border-radius: 2px;
        overflow: hidden;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }
      .search-palette-input {
        width: 100%;
        height: 48px;
        border: 0;
        border-bottom: 1px solid var(--hairline);
        background: transparent;
        color: var(--obsidian);
        padding: 0 16px;
        font-size: 15px;
        letter-spacing: -0.02em;
      }
      .search-palette-input:focus { outline: none; }
      .search-palette-input::placeholder { color: var(--smoke); }
      .search-palette-panel {
        max-height: min(420px, 52vh);
        overflow: auto;
        padding: 6px;
      }
      .search-palette-hint {
        padding: 8px 16px 12px;
        font-size: 11px;
        color: var(--smoke);
      }
      .search-panel {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        max-height: min(420px, calc(100vh - 90px));
        overflow: auto;
        background: var(--white);
        border-radius: 0 0 var(--radius) var(--radius);
        box-shadow: none;
        border: 1px solid var(--hairline);
        border-top: 0;
        z-index: 31;
        padding: 6px;
      }
      .search-wrap.open .search-panel { display: block; }
      .search-hit {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        border: 0;
        background: transparent;
        text-align: left;
        padding: 10px 10px;
        border-radius: var(--radius);
        cursor: pointer;
        color: var(--charcoal);
      }
      .search-hit:hover,
      .search-hit.active { background: var(--inset); }
      .search-hit-path {
        min-width: 0;
        font: 12px/1.35 var(--mono);
        color: var(--obsidian);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .search-hit mark {
        background: transparent;
        color: var(--obsidian);
        font-weight: 600;
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 2px;
      }
      .search-empty {
        padding: 18px 12px;
        color: var(--stone);
        font-size: 13px;
        text-align: center;
      }
      .env-wrap { position: relative; flex: none; }
      .env-wrap.open .env-pop { display: block; }
      .env-trigger {
        flex: none;
        width: 180px;
        height: 28px;
        border: 0;
        border-radius: var(--radius);
        box-shadow: var(--ghost);
        background: var(--white);
        padding: 0 32px 0 12px;
        font: 500 12px/1 var(--mono);
        color: var(--obsidian);
        cursor: pointer;
        position: relative;
        white-space: nowrap;
        text-align: left;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .env-trigger::after {
        content: "";
        position: absolute;
        right: 12px;
        top: 50%;
        width: 6px;
        height: 6px;
        border-right: 1px solid var(--obsidian);
        border-bottom: 1px solid var(--obsidian);
        transform: translateY(-70%) rotate(45deg);
      }
      .env-wrap.open .env-trigger::after { transform: translateY(-20%) rotate(225deg); }
      .env-pop {
        display: none;
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        width: min(420px, calc(100vw - 48px));
        max-height: min(520px, calc(100vh - 120px));
        overflow: auto;
        background: var(--white);
        border-radius: var(--radius);
        box-shadow: none;
        border: 1px solid var(--hairline);
        padding: 16px;
        z-index: 40;
      }
      .env-block { margin-bottom: 20px; }
      .env-block:last-child { margin-bottom: 0; }
      .env-label {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--stone);
        margin-bottom: 8px;
      }
      .env-cell {
        width: 100%;
        min-width: 0;
        height: 32px;
        border: 0;
        border-radius: var(--radius);
        background: var(--inset);
        padding: 0 10px;
        font: 12px/1 var(--mono);
        color: var(--obsidian);
      }
      .env-kv {
        display: grid;
        grid-template-columns: 1fr 1fr 28px;
        gap: 6px;
        margin-bottom: 6px;
      }
      .ghost-btn {
        border: 0;
        background: transparent;
        color: var(--stone);
        cursor: pointer;
        width: 32px;
        height: 32px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        line-height: 1;
      }
      .ghost-btn:hover { color: var(--obsidian); }
      .ghost-btn:disabled { opacity: 0.35; cursor: default; }
      .ghost-btn:disabled:hover { color: var(--stone); }
      .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; }
      .chip-btn {
        border: 0;
        background: var(--inset);
        box-shadow: var(--ghost);
        border-radius: 2px;
        padding: 5px 10px;
        cursor: pointer;
        font-size: 12px;
        color: var(--charcoal);
      }
      .chip-btn.on {
        background: var(--obsidian);
        color: var(--white);
        box-shadow: none;
      }
      .env-base-line {
        margin-top: 8px;
        padding: 8px 10px;
        border-radius: 2px;
        background: var(--inset);
        font: 11px/1.4 var(--mono);
        color: var(--charcoal);
        word-break: break-all;
      }
      .env-base-line span { color: var(--stone); }
      .env-quick {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      .env-kv.base-url .env-cell[data-field="key"] {
        font-weight: 600;
      }
      .env-add {
        height: 32px;
        padding: 0 10px;
        font-size: 12px;
        margin-top: 4px;
      }
      .btn.primary {
        background: var(--obsidian);
        color: var(--white);
        box-shadow: none;
      }
      .btn.primary:hover { opacity: 0.92; color: var(--white); }
      .btn.primary:disabled { opacity: 0.45; cursor: default; }
      .live-err {
        color: #8a2e2e;
        font-size: 13px;
        line-height: 1.5;
        padding: 14px 16px;
        white-space: pre-wrap;
      }

      .app {
        display: grid;
        grid-template-columns: var(--sidebar-w, 320px) 6px minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr) auto;
        height: calc(100vh - 44px);
        margin-top: 44px;
        transition: grid-template-columns 0.32s cubic-bezier(0.22, 1, 0.36, 1);
      }
      body.sidebar-resizing .app { transition: none; }
      .app.sidebar-collapsed {
        grid-template-columns: 0 0 minmax(0, 1fr);
      }
      .sidebar {
        grid-row: 1 / -1;
      }
      .sidebar-resizer {
        grid-row: 1 / -1;
      }
      .workbench {
        grid-column: 3;
        grid-row: 1;
        min-height: 0;
        height: 100%;
        overflow: hidden;
        padding: 14px 18px 16px;
        background: var(--paper);
        display: flex;
        flex-direction: column;
      }
      .sidebar {
        position: relative;
        min-width: 0;
        overflow: hidden;
        padding: 10px 10px 12px;
        display: flex;
        flex-direction: column;
        background: var(--sidebar);
        border-right: 0;
        font-size: 13px;
        transition: opacity 0.22s ease;
      }
      .app.sidebar-collapsed .sidebar {
        overflow: hidden;
        padding: 0;
        pointer-events: none;
        opacity: 0;
      }
      .app.sidebar-collapsed .sidebar-resizer {
        pointer-events: none;
        opacity: 0;
      }
      .nav-filter {
        width: 100%;
        height: 28px;
        border: 1px solid var(--hairline);
        border-radius: var(--radius);
        background: var(--white);
        padding: 0 8px;
        font-size: 12px;
        margin-bottom: 8px;
        flex: none;
      }
      .nav-filter::placeholder { color: var(--smoke); }
      .tree-scroll { flex: 1; min-height: 0; overflow: auto; }
      .nav-foot {
        flex: none;
        margin-top: 8px;
        padding: 8px 2px 0;
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 11px;
        color: var(--smoke);
      }
      .sidebar-resizer {
        position: relative;
        z-index: 5;
        width: 6px;
        margin: 0;
        padding: 0;
        border: 0;
        background: var(--hairline);
        cursor: col-resize;
        touch-action: none;
      }
      .sidebar-resizer::after {
        content: "";
        position: absolute;
        inset: 0 -4px;
      }
      .sidebar-resizer:hover,
      body.sidebar-resizing .sidebar-resizer {
        background: var(--obsidian);
      }
      body.sidebar-resizing {
        cursor: col-resize;
        user-select: none;
      }
      body.sidebar-resizing * {
        cursor: col-resize !important;
        user-select: none !important;
      }
      .tree-root { display: flex; flex-direction: column; gap: 2px; }
      .tree-folder { display: flex; flex-direction: column; gap: 2px; }
      .tree-folder-toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        border: 0;
        background: transparent;
        text-align: left;
        padding: 6px 8px;
        border-radius: var(--radius);
        cursor: pointer;
        color: var(--charcoal);
        font: 500 12px/1.4 var(--mono);
      }
      .tree-folder-toggle:hover { background: var(--white); color: var(--obsidian); }
      .tree-folder-toggle .chev {
        width: 10px;
        height: 10px;
        flex: none;
        position: relative;
        opacity: 0.55;
      }
      .tree-folder-toggle .chev::before {
        content: "";
        position: absolute;
        left: 2px;
        top: 1px;
        width: 5px;
        height: 5px;
        border-right: 1.5px solid currentColor;
        border-bottom: 1.5px solid currentColor;
        transform: rotate(-45deg);
        transition: transform 0.15s ease;
      }
      .tree-folder.open > .tree-folder-toggle .chev::before { transform: rotate(45deg); top: 0; }
      .tree-folder-name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tree-children {
        display: none;
        margin-left: 14px;
        padding-left: 8px;
        border-left: 1px solid var(--hairline);
      }
      .tree-folder.open > .tree-children { display: flex; flex-direction: column; gap: 2px; }
      .tree-empty {
        padding: 24px 12px;
        color: var(--stone);
        font-size: 13px;
        text-align: center;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1;
        min-width: 0;
        border: 0;
        background: transparent;
        text-align: left;
        padding: 5px 8px;
        border-radius: var(--radius);
        cursor: pointer;
      }
      .nav-item:hover { background: transparent; }
      .nav-op {
        display: flex;
        flex-direction: column;
        gap: 0;
        border-radius: var(--radius);
      }
      .nav-op:hover { background: transparent; }
      .nav-op.active { background: transparent; box-shadow: none; }
      .nav-op-row {
        display: flex;
        align-items: center;
        gap: 2px;
        min-width: 0;
      }
      .nav-expand {
        flex: none;
        width: 24px;
        height: 24px;
        border: 0;
        border-radius: 2px;
        background: transparent;
        color: var(--stone);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      .nav-expand:hover { color: var(--obsidian); background: var(--inset); }
      .nav-expand .chev {
        width: 6px;
        height: 6px;
        border-right: 1.5px solid currentColor;
        border-bottom: 1.5px solid currentColor;
        transform: rotate(-45deg);
        margin-top: -2px;
      }
      .nav-op.examples-open > .nav-op-row .nav-expand .chev {
        transform: rotate(45deg);
        margin-top: 0;
      }
      .nav-expand:disabled { opacity: 0.25; cursor: default; }
      .nav-examples {
        display: none;
        flex-direction: column;
        gap: 2px;
        margin: 0 4px 6px 18px;
      }
      .nav-op.examples-open > .nav-examples { display: flex; }
      .nav-ex-group { display: flex; flex-direction: column; gap: 0; }
      .nav-ex-group-label {
        display: flex;
        align-items: center;
        justify-content: space-between;

        font-size: 11px;
        letter-spacing: 0.02em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .kval {
        flex: 1;
        min-width: 0;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--obsidian);
        padding: 4px 0;
        background: transparent;
        border-radius: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      pre {
        margin: 0;
        padding: 10px 12px;
        background: var(--inset);
        border-radius: 0;
        overflow: auto;
        font: 12px/1.5 var(--mono);
      }
      .k { color: var(--obsidian); }
      .s { color: var(--accent); }
      .n { color: var(--charcoal); }
      .p { color: #666666; }
      .empty { color: var(--stone); font-size: 13px; padding: 14px 16px; }
      .code {
        font: 600 11px/1 var(--mono);
        padding: 3px 6px;
        border-radius: 2px;
        background: var(--inset);
      }
      .code.ok { background: var(--ok-bg); color: var(--ok); }
      .code.err { background: var(--err-bg); color: var(--err); }
      .code-text { color: var(--stone); font-size: 12px; }
      .res-meta { display: flex; align-items: center; gap: 10px; color: var(--stone); font: 11px/1 var(--mono); }

      .schemas {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        padding-top: 8px;
        border-top: 1px solid var(--hairline);
      }
      .schemas h2 {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin: 0 0 8px;
        color: var(--stone);
      }
      .schema-rows {
        display: grid;
        grid-template-columns: minmax(0, 1fr) max-content max-content;
        column-gap: 16px;
      }
      .row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) max-content max-content;
        grid-column: 1 / -1;
        column-gap: 16px;
        align-items: baseline;
        padding: 5px 0;
        font-size: 12px;
      }
      .schema-rows > .row {
        grid-template-columns: subgrid;
      }
      .row .name {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--obsidian);
        min-width: 0;
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      .row .name.nested {
        color: var(--charcoal);
        border-left: 1px solid var(--hairline);
        padding-left: 8px;
        margin-left: 2px;
      }
      .row .name.nested[data-depth="2"] { margin-left: 14px; }
      .row .name.nested[data-depth="3"] { margin-left: 26px; }
      .row .name.nested[data-depth="4"] { margin-left: 38px; }
      .row .loc,
      .row .type {
        color: var(--stone);
        font-family: var(--mono);
        font-size: 11px;
        min-width: 0;
      }
      .flag {
        font-size: 11px;
        color: var(--smoke);
        justify-self: end;
        text-align: right;
        min-height: 1em;
      }
      .flag.req { color: var(--err); }

      .work-foot {
        margin-top: 24px;
        font-size: 11px;
        color: var(--smoke);
      }

      @media (max-width: 960px) {
        html, body { overflow: auto; height: auto; }
        .app {
          grid-template-columns: 1fr;
          grid-template-rows: auto 1fr auto;
          height: auto;
          min-height: calc(100vh - 44px);
        }
        .sidebar, .workbench, .foot-bar { grid-column: 1; grid-row: auto; }
        .sidebar { max-height: 40vh; }
        .app.sidebar-collapsed .sidebar {
          max-height: 0 !important;
          padding: 0 !important;
          opacity: 0;
          pointer-events: none;
        }
        .foot-bar { position: sticky; bottom: 0; }
        .sidebar-resizer { display: none; }
        .pair, .schemas { grid-template-columns: 1fr; }
        .workbench { overflow: auto; height: auto; }
        .pair { flex: none; height: auto; overflow: visible; }
        .card { height: auto; max-height: 70vh; }
        .search-wrap { width: min(280px, 70vw); }
      }

      .method { border-radius: 2px; }
      html:not([data-theme="light"]) .btn.primary {
        background: #f3f3f3;
        color: #0a0a0a;
      }
      html:not([data-theme="light"]) .btn.primary:hover { color: #0a0a0a; }

    </style>
  </head>
  <body>

    <div class="app" id="app">
      <aside class="sidebar">
        <div class="search-wrap" id="search-wrap">
          <input class="search" id="search" placeholder="Search endpoints..." autocomplete="off" spellcheck="false" />
          <span class="search-kbd">/</span>
          <div class="search-panel" id="search-panel" role="listbox"></div>
        </div>
        <div class="prefix-bar" id="prefix-bar" hidden></div>
        <div class="tree-scroll" id="nav"></div>
        <div class="nav-foot"><span>Generated by DAxTA</span><span id="nav-version"></span></div>
      </aside>
      <button type="button" class="sidebar-resizer" id="sidebar-resizer" aria-label="Resize sidebar" title="Drag to resize · double-click to collapse"></button>
      <main class="workbench" id="main"></main>
      <div class="foot-bar">
        <button class="btn icon sidebar-toggle" id="sidebar-toggle" type="button" data-tip="Sidebar" aria-label="Toggle sidebar" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M9 4v16"/></svg>
        </button>
        <div class="ex-dock" id="ex-dock"></div>
      </div>
    </div>
    <script>
      window.__SPEC__ = __SPEC_JSON__;
    </script>
    <script>
      const spec = window.__SPEC__ || {};
      const viewer = spec["x-viewer"] || {};
      const workspace = (spec.info && spec.info["x-workspace"]) || viewer.workspace || "";
      const defaultBaseUrlFromSpec = String((viewer.baseUrl || (spec.servers && spec.servers[0] && spec.servers[0].url) || "http://localhost:3000")).replace(/\/$/, "");
      const docsPathSuffix = String(viewer.docsPath || "/docs").replace(/\/$/, "") || "/docs";

      const inferBaseUrlFromLocation = () => {
        if (typeof location === "undefined") return null;
        if (location.protocol !== "http:" && location.protocol !== "https:") return null;
        let pathname = (location.pathname || "/").replace(/\/$/, "") || "";
        if (pathname === docsPathSuffix) return location.origin.replace(/\/$/, "");
        if (pathname.endsWith(docsPathSuffix)) {
          const prefix = pathname.slice(0, -docsPathSuffix.length).replace(/\/$/, "");
          return (location.origin + prefix).replace(/\/$/, "");
        }
        const idx = pathname.indexOf(docsPathSuffix + "/");
        if (idx >= 0) {
          const prefix = pathname.slice(0, idx).replace(/\/$/, "");
          return (location.origin + prefix).replace(/\/$/, "");
        }
        return null;
      };

      const locationBaseUrl = inferBaseUrlFromLocation();
      // Prefer the URL that is serving the viewer (strip the docs path), else fall back to spec.
      const defaultBaseUrl = locationBaseUrl || defaultBaseUrlFromSpec;
      const title = (spec.info && spec.info.title) || "API Documentation";
      const STORE_KEY = "openapi-docs-env:" + (workspace || "default");
      const SIDEBAR_STORE_KEY = "openapi-docs-sidebar:" + (workspace || "default");
      const SIDEBAR_MIN = 200;
      const SIDEBAR_MAX = 560;
      const SIDEBAR_DEFAULT = 320;

      const docsBaseForApi = (() => {
        if (typeof location === "undefined") return docsPathSuffix;
        let pathname = (location.pathname || "/").replace(/\/$/, "") || "";
        if (pathname === docsPathSuffix || pathname.endsWith(docsPathSuffix)) return pathname || docsPathSuffix;
        const idx = pathname.indexOf(docsPathSuffix);
        if (idx >= 0) return pathname.slice(0, idx + docsPathSuffix.length) || docsPathSuffix;
        return docsPathSuffix;
      })();
      const ENV_STORE_URL = docsBaseForApi + "/env.json";

      const loadSidebarLayout = () => {
        try {
          const raw = localStorage.getItem(SIDEBAR_STORE_KEY);
          if (!raw) return { width: SIDEBAR_DEFAULT, collapsed: false };
          const parsed = JSON.parse(raw);
          const width = Number(parsed.width);
          return {
            width: Number.isFinite(width) ? Math.min(SIDEBAR_MAX, Math.max(SIDEBAR_MIN, width)) : SIDEBAR_DEFAULT,
            collapsed: Boolean(parsed.collapsed),
          };
        } catch {
          return { width: SIDEBAR_DEFAULT, collapsed: false };
        }
      };

      let sidebarLayout = loadSidebarLayout();

      const applySidebarLayout = () => {
        const app = document.getElementById("app");
        const resizer = document.getElementById("sidebar-resizer");
        if (!app) return;
        app.style.setProperty("--sidebar-w", sidebarLayout.width + "px");
        app.classList.toggle("sidebar-collapsed", sidebarLayout.collapsed);
        const toggle = document.getElementById("sidebar-toggle");
        if (toggle) {
          toggle.setAttribute("aria-pressed", sidebarLayout.collapsed ? "true" : "false");
          toggle.setAttribute("data-tip", sidebarLayout.collapsed ? "Show sidebar" : "Hide sidebar");
          toggle.setAttribute("aria-label", sidebarLayout.collapsed ? "Show sidebar" : "Hide sidebar");
        }
        if (resizer) {
          resizer.title = "Drag to resize · double-click to collapse";
          resizer.setAttribute("aria-label", "Resize sidebar");
        }
      };

      const persistSidebarLayout = () => {
        try {
          localStorage.setItem(SIDEBAR_STORE_KEY, JSON.stringify(sidebarLayout));
        } catch {}
      };

      const initSidebarResize = () => {
        const resizer = document.getElementById("sidebar-resizer");
        if (!resizer) return;
        applySidebarLayout();

        let dragging = false;
        let startX = 0;
        let startWidth = 0;
        let moved = false;

        const onMove = (event) => {
          if (!dragging) return;
          if (event.cancelable) event.preventDefault();
          const clientX = event.touches ? event.touches[0].clientX : event.clientX;
          const delta = clientX - startX;
          if (Math.abs(delta) > 2) moved = true;
          const next = Math.min(SIDEBAR_MAX, Math.max(SIDEBAR_MIN, startWidth + delta));
          sidebarLayout.width = next;
          sidebarLayout.collapsed = false;
          applySidebarLayout();
        };

        const onUp = () => {
          if (!dragging) return;
          dragging = false;
          document.body.classList.remove("sidebar-resizing");
          window.removeEventListener("mousemove", onMove);
          window.removeEventListener("mouseup", onUp);
          window.removeEventListener("touchmove", onMove);
          window.removeEventListener("touchend", onUp);
          persistSidebarLayout();
        };

        const onDown = (event) => {
          if (sidebarLayout.collapsed) return;
          if (event.button != null && event.button !== 0) return;
          event.preventDefault();
          dragging = true;
          moved = false;
          startX = event.touches ? event.touches[0].clientX : event.clientX;
          startWidth = sidebarLayout.width;
          document.body.classList.add("sidebar-resizing");
          window.addEventListener("mousemove", onMove);
          window.addEventListener("mouseup", onUp);
          window.addEventListener("touchmove", onMove, { passive: false });
          window.addEventListener("touchend", onUp);
        };

        resizer.addEventListener("mousedown", onDown);
        resizer.addEventListener("touchstart", onDown, { passive: false });
        resizer.addEventListener("dblclick", (event) => {
          event.preventDefault();
          toggleSidebar();
        });
      };

      const toggleSidebar = () => {
        sidebarLayout.collapsed = !sidebarLayout.collapsed;
        if (!sidebarLayout.collapsed && sidebarLayout.width < SIDEBAR_MIN) sidebarLayout.width = SIDEBAR_DEFAULT;
        applySidebarLayout();
        persistSidebarLayout();
      };

      document.getElementById("sidebar-toggle")?.addEventListener("click", (event) => {
        event.preventDefault();
        toggleSidebar();
      });

      initSidebarResize();

      let liveResult = null;

      const escapeAttr = (value) =>
        String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/"/g, "&quot;")
          .replace(/</g, "&lt;");

      const varNameFromHeader = (header) => {
        const parts = String(header).replace(/^x-/, "").split("-").filter(Boolean);
        if (!parts.length) return String(header).replace(/[^a-zA-Z0-9]/g, "");
        return parts[0] + parts.slice(1).map((part) => part.charAt(0).toUpperCase() + part.slice(1)).join("");
      };

      /** Pull try-it defaults from recorded success traffic + parameter examples. */
      const collectDefaultHeaderValues = () => {
        const byHeader = {};
        const take = (header, value, prefer) => {
          if (value == null || value === "") return;
          const key = String(header).toLowerCase();
          if (!byHeader[key] || prefer) byHeader[key] = String(value);
        };
        for (const pathItem of Object.values(spec.paths || {})) {
          for (const op of Object.values(pathItem || {})) {
            if (!op || typeof op !== "object") continue;
            for (const param of op.parameters || []) {
              if (param && param.in === "header" && param.name && param.example != null) {
                take(param.name, param.example, false);
              }
            }
            for (const scenario of op["x-scenarios"] || []) {
              const success = scenario.status >= 200 && scenario.status < 300;
              for (const [header, value] of Object.entries(scenario.headers || {})) {
                if (!String(header).toLowerCase().startsWith("x-")) continue;
                take(header, value, success);
              }
            }
          }
        }
        return byHeader;
      };

      const defaultHeaderValues = collectDefaultHeaderValues();

      /**
       * Env name for a base URL: loopback → local, host keyword → that keyword,
       * otherwise the first non-generic subdomain, falling back to production.
       */
      const envNameFromUrl = (url) => {
        let host = String(url || "").trim();
        try {
          host = new URL(host).hostname;
        } catch {
          host = host.replace(/^[a-z]+:\/\//i, "").split("/")[0].split(":")[0];
        }
        host = host.toLowerCase();
        if (!host) return "local";
        if (["localhost", "127.0.0.1", "0.0.0.0", "::1"].includes(host) || host.endsWith(".local")) return "local";
        const keywords = [
          [/\bstag(e|ing)\b/, "staging"],
          [/\b(dev|development)\b/, "development"],
          [/\b(test|testing)\b/, "test"],
          [/\bqa\b/, "qa"],
          [/\bsandbox\b/, "sandbox"],
          [/\b(preprod|pre-prod|uat)\b/, "uat"],
          [/\b(prod|production)\b/, "production"],
        ];
        const labels = host.split(".");
        for (const [pattern, name] of keywords) {
          if (labels.some((label) => pattern.test(label))) return name;
        }
        const generic = new Set(["api", "www", "app", "gateway", "edge"]);
        return labels.slice(0, -2).filter((label) => label && !generic.has(label))[0] || "production";
      };

      /** Envs come from spec.servers (built per env preset); viewer.envPresets only overrides/extends. */
      const configuredPresets = (() => {
        const presets = {};
        for (const server of Array.isArray(spec.servers) ? spec.servers : []) {
          const url = String((server && server.url) || "").replace(/\/$/, "");
          if (!url) continue;
          const name = String((server && server.description) || "").trim() || envNameFromUrl(url);
          if (!presets[name]) presets[name] = { baseUrl: url };
        }
        const overrides = viewer.envPresets;
        if (overrides && typeof overrides === "object") {
          for (const [name, preset] of Object.entries(overrides)) {
            if (!name || !preset || typeof preset !== "object") continue;
            const baseUrl = String(preset.baseUrl || (presets[name] && presets[name].baseUrl) || defaultBaseUrl).replace(/\/$/, "");
            presets[name] = { ...preset, baseUrl: baseUrl || defaultBaseUrl };
          }
        }
        if (!Object.keys(presets).length) presets[envNameFromUrl(defaultBaseUrl)] = { baseUrl: defaultBaseUrl };
        return presets;
      })();

      const DEFAULT_BASE_URL_KEY = "baseUrl";

      /** The base URL variable can be renamed per env (e.g. ONBOARDING_SERVICE) for Postman. */
      const baseUrlKeyOf = (env) => {
        const key = env && typeof env.baseUrlKey === "string" ? env.baseUrlKey.trim() : "";
        return key || DEFAULT_BASE_URL_KEY;
      };

      const setEnvBaseUrl = (env, baseUrl) => {
        const variables = env.variables || (env.variables = []);
        const key = baseUrlKeyOf(env);
        const row = variables.find((entry) => entry.key === key);
        if (row) row.value = baseUrl;
        else variables.unshift({ key, value: baseUrl });
      };

      const buildHeaderTemplate = () => {
        const schemes = (spec.components && spec.components.securitySchemes) || {};
        const variables = [];
        const varKeys = new Set();
        const headerGroups = {};
        for (const [schemeId, scheme] of Object.entries(schemes)) {
          if (!scheme || scheme.in !== "header" || !scheme.name) continue;
          const header = scheme.name;
          const varName = varNameFromHeader(header);
          if (!varKeys.has(varName)) {
            const seeded = defaultHeaderValues[String(header).toLowerCase()] || "";
            variables.push({ key: varName, value: seeded });
            varKeys.add(varName);
          }
          headerGroups[schemeId] = [
            { key: header, value: "{{" + varName + "}}" },
            { key: "content-type", value: "application/json" },
          ];
        }
        const seenCombos = new Set();
        for (const pathItem of Object.values(spec.paths || {})) {
          for (const op of Object.values(pathItem || {})) {
            if (!op || typeof op !== "object") continue;
            const ids = [];
            for (const requirement of op.security || []) {
              if (!requirement || typeof requirement !== "object") continue;
              for (const id of Object.keys(requirement)) {
                if (headerGroups[id]) ids.push(id);
              }
            }
            const unique = [...new Set(ids)];
            if (unique.length < 2) continue;
            const comboKey = unique.slice().sort().join("+");
            if (seenCombos.has(comboKey)) continue;
            seenCombos.add(comboKey);
            const byKey = {};
            for (const id of unique) {
              for (const row of headerGroups[id] || []) {
                if (!row.key) continue;
                byKey[row.key] = { key: row.key, value: row.value };
              }
            }
            if (!byKey["content-type"]) byKey["content-type"] = { key: "content-type", value: "application/json" };
            headerGroups[comboKey] = Object.values(byKey);
          }
        }
        const groupNames = Object.keys(headerGroups);
        if (!groupNames.length) headerGroups.default = [{ key: "content-type", value: "application/json" }];
        return { variables, headerGroups };
      };

      const envFromPreset = (preset) => {
        const template = buildHeaderTemplate();
        const baseUrl = String((preset && preset.baseUrl) || defaultBaseUrl).replace(/\/$/, "") || defaultBaseUrl;
        const baseUrlKey = baseUrlKeyOf(preset);
        const variables = [{ key: baseUrlKey, value: baseUrl }, ...template.variables.map((row) => ({ ...row }))];
        const known = new Set(variables.map((row) => row.key));
        if (preset && preset.variables && typeof preset.variables === "object") {
          for (const [key, value] of Object.entries(preset.variables)) {
            if (!key || key === baseUrlKey) continue;
            if (known.has(key)) {
              const row = variables.find((entry) => entry.key === key);
              if (row) row.value = String(value ?? "");
            } else {
              variables.push({ key, value: String(value ?? "") });
              known.add(key);
            }
          }
        }
        const headerGroups = {};
        for (const [group, rows] of Object.entries(template.headerGroups)) {
          headerGroups[group] = rows.map((row) => ({ ...row }));
        }
        return { variables, headerGroups, baseUrlKey };
      };

      const buildDefaultStore = () => {
        const envs = {};
        for (const [name, preset] of Object.entries(configuredPresets)) {
          envs[name] = envFromPreset(preset);
        }
        if (!Object.keys(envs).length) envs.local = envFromPreset({ baseUrl: defaultBaseUrl });
        const names = Object.keys(envs);
        const activeEnv = names.includes("local") ? "local" : names[0];
        const groupNames = Object.keys(envs[activeEnv].headerGroups || {});
        return {
          activeEnv,
          activeGroup: groupNames[0] || "default",
          envs,
        };
      };

      const cloneDefaultEnv = () => {
        const defaults = buildDefaultStore();
        const name = defaults.envs.local ? "local" : Object.keys(defaults.envs)[0];
        return JSON.parse(JSON.stringify(defaults.envs[name]));
      };

      const mergeStore = (saved) => {
        const defaults = buildDefaultStore();
        if (!saved || !saved.envs || typeof saved.envs !== "object") return defaults;
        const envs = {};
        for (const [name, env] of Object.entries(saved.envs)) {
          const base = cloneDefaultEnv();
          const baseUrlKey = baseUrlKeyOf(env);
          const variables = Array.isArray(env.variables)
            ? env.variables.map((row) => ({ key: String(row.key || ""), value: String(row.value ?? "") }))
            : base.variables.map((row) => ({ ...row }));
          const known = new Set(variables.map((row) => row.key).filter(Boolean));
          for (const row of base.variables) {
            if (!row.key || known.has(row.key)) continue;
            // A renamed base URL variable already covers the default `baseUrl` row.
            if (row.key === DEFAULT_BASE_URL_KEY && baseUrlKey !== DEFAULT_BASE_URL_KEY) continue;
            variables.push({ ...row });
          }
          const defaultsByKey = Object.fromEntries((base.variables || []).filter((row) => row.key).map((row) => [row.key, row.value ?? ""]));
          for (const row of variables) {
            if (!row.key) continue;
            if (String(row.value ?? "").trim()) continue;
            if (defaultsByKey[row.key]) row.value = defaultsByKey[row.key];
          }
          const headerGroups = { ...(env.headerGroups || {}) };
          for (const [group, rows] of Object.entries(base.headerGroups)) {
            if (!headerGroups[group]) headerGroups[group] = rows.map((row) => ({ ...row }));
          }
          if (!Object.keys(headerGroups).length) headerGroups.default = [{ key: "content-type", value: "application/json" }];
          envs[name] = { variables, headerGroups, baseUrlKey };
        }
        // Seed any config presets that are missing from the saved store (don't wipe existing).
        for (const [name, preset] of Object.entries(configuredPresets)) {
          if (envs[name]) continue;
          envs[name] = envFromPreset(preset);
        }
        if (!Object.keys(envs).length) return defaults;
        const activeEnv = envs[saved.activeEnv] ? saved.activeEnv : Object.keys(envs)[0];
        const groups = Object.keys(envs[activeEnv].headerGroups || {});
        const activeGroup = groups.includes(saved.activeGroup) ? saved.activeGroup : groups[0] || "default";
        return { activeEnv, activeGroup, envs };
      };

      const loadLocalStore = () => {
        try {
          const raw = localStorage.getItem(STORE_KEY);
          if (raw) return mergeStore(JSON.parse(raw));
        } catch {}
        return null;
      };

      /**
       * Only rewrite baseUrl for local-ish presets so staging/production stay intact.
       */
      const applyServingBaseUrl = (state) => {
        if (!locationBaseUrl || !state || !state.envs) return state;
        const preferred = ["local", "development", "dev"].find((name) => state.envs[name]);
        if (preferred) {
          setEnvBaseUrl(state.envs[preferred], locationBaseUrl);
          return state;
        }
        const names = Object.keys(state.envs);
        if (names.length === 1) setEnvBaseUrl(state.envs[names[0]], locationBaseUrl);
        return state;
      };

      // Prefer disk (shared across browsers / deploy), then localStorage, then defaults.
      let store = applyServingBaseUrl(loadLocalStore() || buildDefaultStore());
      let persistTimer = null;

      const writeLocalStore = () => {
        try {
          localStorage.setItem(STORE_KEY, JSON.stringify(store));
        } catch {}
      };

      const writeServerStore = async () => {
        try {
          const res = await fetch(ENV_STORE_URL, {
            method: "PUT",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(store),
          });
          if (!res.ok) return;
        } catch {
          /* offline / file:// — localStorage still works */
        }
      };

      const persistStore = () => {
        writeLocalStore();
        if (persistTimer) clearTimeout(persistTimer);
        persistTimer = setTimeout(() => {
          persistTimer = null;
          writeServerStore();
        }, 250);
      };

      const hydrateStoreFromServer = async () => {
        try {
          const res = await fetch(ENV_STORE_URL, { cache: "no-store" });
          if (!res.ok) return false;
          const remote = await res.json();
          if (!remote || typeof remote !== "object" || !remote.envs) return false;
          store = applyServingBaseUrl(mergeStore(remote));
          writeLocalStore();
          return true;
        } catch {
          return false;
        }
      };

      const activeEnvConfig = () => store.envs[store.activeEnv] || store.envs[Object.keys(store.envs)[0]];

      const varMap = () => {
        const env = activeEnvConfig();
        return Object.fromEntries((env.variables || []).filter((row) => row.key).map((row) => [row.key, row.value ?? ""]));
      };

      const interpolate = (value, vars, depth = 0) => {
        if (value == null || depth > 8) return value;
        if (typeof value === "object") {
          if (Array.isArray(value)) return value.map((item) => interpolate(item, vars, depth));
          return Object.fromEntries(Object.entries(value).map(([key, nested]) => [key, interpolate(nested, vars, depth)]));
        }
        if (typeof value !== "string") return value;
        return value.replace(/\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/g, (_, key) => (key in vars ? String(interpolate(vars[key], vars, depth + 1)) : "{{" + key + "}}"));
      };

      const resolvedHeadersFromGroup = (groupName) => {
        const env = activeEnvConfig();
        const groups = env.headerGroups || {};
        const group = groups[groupName] || groups[Object.keys(groups)[0]] || [];
        const vars = varMap();
        return Object.fromEntries(group.filter((row) => row.key).map((row) => [row.key, String(interpolate(row.value || "", vars))]));
      };

      const resolvedHeaders = () => resolvedHeadersFromGroup(store.activeGroup);

      /** OpenAPI security scheme ids for an operation (union across requirements). */
      const securitySchemeIds = (op) => {
        const requirements = (op && op.security) || spec.security || [];
        if (!Array.isArray(requirements) || !requirements.length) return [];
        const ids = [];
        for (const requirement of requirements) {
          if (!requirement || typeof requirement !== "object") continue;
          for (const id of Object.keys(requirement)) ids.push(id);
        }
        return [...new Set(ids)];
      };

      /** Stable group name for this op: single scheme, or merged combo (userId+merchantId). */
      const requiredGroupName = (op) => {
        const ids = securitySchemeIds(op);
        if (!ids.length) return null;
        if (ids.length === 1) return ids[0];
        return ids.slice().sort().join("+");
      };

      /** Fixed hint next to Headers — what this API needs to work. */
      const requiredAuthHint = (op) => {
        const ids = securitySchemeIds(op);
        if (!ids.length) return "";
        return "Required: " + ids.join(" + ");
      };

      /** Ensure merged combo group exists in the active env (lazy for older localStorage). */
      const ensureRequiredHeaderGroup = (op) => {
        const name = requiredGroupName(op);
        if (!name) return null;
        const env = activeEnvConfig();
        const groups = env.headerGroups || (env.headerGroups = {});
        if (groups[name]) return name;
        const ids = securitySchemeIds(op);
        const byKey = {};
        for (const id of ids) {
          for (const row of groups[id] || []) {
            if (!row.key) continue;
            byKey[row.key] = { key: row.key, value: row.value };
          }
        }
        if (!Object.keys(byKey).length) return null;
        if (!byKey["content-type"]) byKey["content-type"] = { key: "content-type", value: "application/json" };
        groups[name] = Object.values(byKey);
        return name;
      };

      /**
       * On operation select: switch to the required (possibly merged) group once.
       * User can still change the group from the top env panel afterward; Send follows that.
       */
      const syncHeaderGroupForOp = (op) => {
        const name = ensureRequiredHeaderGroup(op);
        if (!name) return;
        if (store.activeGroup === name) return;
        store.activeGroup = name;
        persistStore();
        syncEnvTrigger();
        if (document.getElementById("env-wrap")?.classList.contains("open")) renderEnvPop();
      };

      const activeBaseUrlKey = () => baseUrlKeyOf(activeEnvConfig());

      const currentBaseUrl = () => {
        const vars = varMap();
        return String(interpolate(vars[activeBaseUrlKey()] || defaultBaseUrl, vars) || defaultBaseUrl).replace(/\/$/, "");
      };

      const envLabel = () => store.activeEnv + " · " + store.activeGroup;

      const syncEnvTrigger = () => {
        const trigger = document.getElementById("env-trigger");
        if (!trigger) return;
        trigger.textContent = envLabel();
        const base = varMap()[activeBaseUrlKey()] || "";
        trigger.title = base ? store.activeEnv + " · " + base + " · " + store.activeGroup : envLabel();
      };

      const presetBaseUrl = (name) => {
        const env = store.envs[name];
        if (!env) return "";
        const row = (env.variables || []).find((entry) => entry.key === baseUrlKeyOf(env));
        return row ? String(row.value || "") : "";
      };

      const addNamedPreset = (name, baseUrl) => {
        if (!name || store.envs[name]) return false;
        const env = cloneDefaultEnv();
        setEnvBaseUrl(env, baseUrl || defaultBaseUrl);
        store.envs[name] = env;
        store.activeEnv = name;
        store.activeGroup = Object.keys(env.headerGroups || {})[0] || "default";
        return true;
      };

      const renderEnvPop = () => {
        const env = activeEnvConfig();
        const envNames = Object.keys(store.envs);
        const groups = Object.keys(env.headerGroups || {});
        if (!groups.includes(store.activeGroup)) store.activeGroup = groups[0] || "default";
        const groupRows = env.headerGroups[store.activeGroup] || [];
        const canRemoveEnv = envNames.length > 1;
        const canRemoveGroup = groups.length > 1;
        const activeBase = presetBaseUrl(store.activeEnv) || defaultBaseUrl;
        const quickPresets = [
          { id: "staging", baseUrl: (configuredPresets.staging && configuredPresets.staging.baseUrl) || "https://api.staging.example.com" },
          { id: "production", baseUrl: (configuredPresets.production && configuredPresets.production.baseUrl) || "https://api.example.com" },
        ].filter((preset) => !store.envs[preset.id]);

        document.getElementById("env-pop").innerHTML = `
          <div class="env-block">
            <div class="env-label">Presets</div>
            <div class="chip-row">
              ${envNames
                .map((id) => `<button type="button" class="chip-btn ${id === store.activeEnv ? "on" : ""}" data-env="${escapeAttr(id)}" title="${escapeAttr(presetBaseUrl(id))}">${escapeAttr(id)}</button>`)
                .join("")}
              <button type="button" class="ghost-btn" id="add-env" title="Add preset">+</button>
              <button type="button" class="ghost-btn" id="dup-env" title="Duplicate preset">⧉</button>
              <button type="button" class="ghost-btn" id="remove-env" title="Remove preset" ${canRemoveEnv ? "" : "disabled"}>×</button>
            </div>
            <div class="env-base-line"><span>${escapeAttr(baseUrlKeyOf(env))}</span> · ${escapeAttr(activeBase)}</div>
            ${
              quickPresets.length
                ? `<div class="env-quick">${quickPresets
                    .map(
                      (preset) =>
                        `<button type="button" class="btn sm" data-quick-preset="${escapeAttr(preset.id)}" data-base="${escapeAttr(preset.baseUrl)}">+ ${escapeAttr(preset.id)}</button>`,
                    )
                    .join("")}</div>`
                : ""
            }
          </div>
          <div class="env-block">
            <div class="env-label">Variables</div>
            ${(env.variables || [])
              .map(
                (row, index) => `<div class="env-kv ${row.key === baseUrlKeyOf(env) ? "base-url" : ""}" data-var="${index}">
                  <input class="env-cell" data-field="key" spellcheck="false" value="${escapeAttr(row.key)}" title="${row.key === baseUrlKeyOf(env) ? "Base URL variable — rename it to match your Postman collection" : escapeAttr(row.key)}" />
                  <input class="env-cell" data-field="value" spellcheck="false" value="${escapeAttr(row.value)}" />
                  <button type="button" class="ghost-btn" data-remove-var="${index}" ${row.key === baseUrlKeyOf(env) ? "disabled" : ""}>×</button>
                </div>`,
              )
              .join("")}
            <button type="button" class="btn env-add" id="add-var">Add variable</button>
          </div>
          <div class="env-block">
            <div class="env-label">Header group</div>
            <div class="chip-row">
              ${groups
                .map((group) => `<button type="button" class="chip-btn ${group === store.activeGroup ? "on" : ""}" data-group="${escapeAttr(group)}">${escapeAttr(group)}</button>`)
                .join("")}
              <button type="button" class="ghost-btn" id="add-group" title="Add header group">+</button>
              <button type="button" class="ghost-btn" id="remove-group" title="Remove header group" ${canRemoveGroup ? "" : "disabled"}>×</button>
            </div>
            ${groupRows
              .map(
                (row, index) => `<div class="env-kv" data-hdr="${index}">
                  <input class="env-cell" data-field="key" spellcheck="false" value="${escapeAttr(row.key)}" />
                  <input class="env-cell" data-field="value" spellcheck="false" value="${escapeAttr(row.value)}" />
                  <button type="button" class="ghost-btn" data-remove-hdr="${index}">×</button>
                </div>`,
              )
              .join("")}
            <button type="button" class="btn env-add" id="add-hdr">Add header</button>
          </div>
        `;

        syncEnvTrigger();

        document.getElementById("env-pop").querySelectorAll("[data-env]").forEach((button) => {
          button.onclick = (event) => {
            event.stopPropagation();
            store.activeEnv = button.dataset.env;
            const nextGroups = Object.keys(activeEnvConfig().headerGroups || {});
            if (!nextGroups.includes(store.activeGroup)) store.activeGroup = nextGroups[0] || "default";
            persistStore();
            renderEnvPop();
            renderMain();
          };
        });
        document.getElementById("env-pop").querySelectorAll("[data-quick-preset]").forEach((button) => {
          button.onclick = (event) => {
            event.stopPropagation();
            if (!addNamedPreset(button.dataset.quickPreset, button.dataset.base)) return;
            persistStore();
            renderEnvPop();
            renderMain();
          };
        });
        document.getElementById("add-env").onclick = (event) => {
          event.stopPropagation();
          const typed = window.prompt("Preset name (e.g. staging)", "staging");
          if (!typed) return;
          const name = typed.trim().replace(/\s+/g, "-");
          if (!name) return;
          if (store.envs[name]) {
            store.activeEnv = name;
          } else {
            const base = window.prompt("baseUrl", configuredPresets[name]?.baseUrl || defaultBaseUrl) || defaultBaseUrl;
            addNamedPreset(name, base.replace(/\/$/, ""));
          }
          persistStore();
          renderEnvPop();
          renderMain();
        };
        document.getElementById("dup-env").onclick = (event) => {
          event.stopPropagation();
          const source = store.activeEnv;
          let name = source + "-copy";
          let n = 2;
          while (store.envs[name]) {
            name = source + "-copy" + n;
            n += 1;
          }
          store.envs[name] = JSON.parse(JSON.stringify(activeEnvConfig()));
          store.activeEnv = name;
          persistStore();
          renderEnvPop();
          renderMain();
        };
        document.getElementById("remove-env").onclick = (event) => {
          event.stopPropagation();
          const names = Object.keys(store.envs);
          if (names.length <= 1 || !store.envs[store.activeEnv]) return;
          delete store.envs[store.activeEnv];
          store.activeEnv = Object.keys(store.envs)[0];
          const nextGroups = Object.keys(activeEnvConfig().headerGroups || {});
          store.activeGroup = nextGroups.includes(store.activeGroup) ? store.activeGroup : nextGroups[0] || "default";
          persistStore();
          renderEnvPop();
          renderMain();
        };
        document.getElementById("env-pop").querySelectorAll("[data-group]").forEach((button) => {
          button.onclick = (event) => {
            event.stopPropagation();
            store.activeGroup = button.dataset.group;
            persistStore();
            renderEnvPop();
            renderMain();
          };
        });
        document.getElementById("add-group").onclick = (event) => {
          event.stopPropagation();
          let name = "group";
          let n = 1;
          const groupsMap = activeEnvConfig().headerGroups;
          while (groupsMap[name + n]) n += 1;
          name = name + n;
          groupsMap[name] = [{ key: "content-type", value: "application/json" }];
          store.activeGroup = name;
          persistStore();
          renderEnvPop();
          renderMain();
        };
        document.getElementById("remove-group").onclick = (event) => {
          event.stopPropagation();
          const groupsMap = activeEnvConfig().headerGroups;
          const names = Object.keys(groupsMap || {});
          if (names.length <= 1 || !groupsMap[store.activeGroup]) return;
          delete groupsMap[store.activeGroup];
          store.activeGroup = Object.keys(groupsMap)[0] || "default";
          persistStore();
          renderEnvPop();
          renderMain();
        };
        document.getElementById("env-pop").querySelectorAll("[data-var]").forEach((row) => {
          row.querySelectorAll("input").forEach((input) => {
            input.oninput = () => {
              const index = Number(row.dataset.var);
              const field = input.dataset.field;
              const env = activeEnvConfig();
              if (!env.variables[index] || (field !== "key" && field !== "value")) return;
              const wasBaseUrl = env.variables[index].key === baseUrlKeyOf(env);
              env.variables[index][field] = input.value;
              // Renaming the base URL row (e.g. to ONBOARDING_SERVICE) retargets the whole env.
              if (field === "key" && wasBaseUrl) {
                env.baseUrlKey = input.value.trim() || DEFAULT_BASE_URL_KEY;
                const label = document.querySelector(".env-base-line span");
                if (label) label.textContent = env.baseUrlKey;
              }
              persistStore();
              syncEnvTrigger();
              if (wasBaseUrl) renderMain();
            };
            input.onchange = () => renderMain();
          });
        });
        document.getElementById("env-pop").querySelectorAll("[data-remove-var]").forEach((button) => {
          button.onclick = (event) => {
            event.stopPropagation();
            activeEnvConfig().variables.splice(Number(button.dataset.removeVar), 1);
            persistStore();
            renderEnvPop();
            renderMain();
          };
        });
        document.getElementById("add-var").onclick = (event) => {
          event.stopPropagation();
          activeEnvConfig().variables.push({ key: "", value: "" });
          persistStore();
          renderEnvPop();
        };
        document.getElementById("env-pop").querySelectorAll("[data-hdr]").forEach((row) => {
          row.querySelectorAll("input").forEach((input) => {
            input.oninput = () => {
              const index = Number(row.dataset.hdr);
              const field = input.dataset.field;
              const rows = activeEnvConfig().headerGroups[store.activeGroup] || [];
              if (!rows[index] || (field !== "key" && field !== "value")) return;
              rows[index][field] = input.value;
              persistStore();
            };
            input.onchange = () => renderMain();
          });
        });
        document.getElementById("env-pop").querySelectorAll("[data-remove-hdr]").forEach((button) => {
          button.onclick = (event) => {
            event.stopPropagation();
            (activeEnvConfig().headerGroups[store.activeGroup] || []).splice(Number(button.dataset.removeHdr), 1);
            persistStore();
            renderEnvPop();
            renderMain();
          };
        });
        document.getElementById("add-hdr").onclick = (event) => {
          event.stopPropagation();
          const groupsMap = activeEnvConfig().headerGroups;
          groupsMap[store.activeGroup] = groupsMap[store.activeGroup] || [];
          groupsMap[store.activeGroup].push({ key: "", value: "" });
          persistStore();
          renderEnvPop();
        };
      };

      document.title = title || "API Documentation";
      const brandEl = document.getElementById("brand");
      if (brandEl) brandEl.textContent = (title || "DAxTA") + " API Document";
      const applyTheme = (mode) => {
        const next = mode === "light" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("daxta-theme", next);
        const fav = document.getElementById("favicon");
        if (fav) fav.setAttribute("href", next === "light" ? "__FAVICON_DATA_URI__" : "__FAVICON_LIGHT_DATA_URI__");
        const themeLabel = document.getElementById("theme-label");
        if (themeLabel) themeLabel.textContent = next === "light" ? "Light" : "Dark";
      };
      applyTheme(localStorage.getItem("daxta-theme") || "dark");
      const shortcutPalette = document.getElementById("shortcut-palette");
      if (shortcutPalette) shortcutPalette.textContent = /Mac|iPhone|iPad/.test(navigator.platform) ? "⌘K" : "Ctrl+K";
      document.getElementById("theme-toggle")?.addEventListener("click", (event) => {
        event.stopPropagation();
        applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
      });
      const moreWrap = document.getElementById("more-wrap");
      const moreToggle = document.getElementById("more-toggle");
      const setMoreOpen = (open) => {
        moreWrap?.classList.toggle("open", open);
        moreToggle?.setAttribute("aria-expanded", open ? "true" : "false");
      };
      moreToggle?.addEventListener("click", (event) => {
        event.stopPropagation();
        const next = !moreWrap.classList.contains("open");
        envWrap.classList.remove("open");
        setMoreOpen(next);
      });
      document.getElementById("more-pop")?.addEventListener("click", (event) => event.stopPropagation());
      const specVersion = (spec.info && spec.info.version) || "";
      const navVersion = document.getElementById("nav-version");
      if (navVersion) navVersion.textContent = specVersion ? (specVersion.startsWith("v") ? specVersion : "v" + specVersion) : "";

      const envWrap = document.getElementById("env-wrap");
      document.getElementById("env-trigger").addEventListener("click", (event) => {
        event.stopPropagation();
        setMoreOpen(false);
        envWrap.classList.toggle("open");
        if (envWrap.classList.contains("open")) renderEnvPop();
      });
      document.getElementById("env-pop").addEventListener("click", (event) => event.stopPropagation());
      renderEnvPop();

      const VIEWER_EXTENSIONS = new Set(["x-viewer", "x-docs", "x-scenarios", "x-tree-segments", "x-workspace"]);
      const HTTP_EXPORT = ["get", "post", "put", "patch", "delete", "options", "head", "trace"];

      const stripExt = (value) => {
        if (Array.isArray(value)) return value.map(stripExt);
        if (!value || typeof value !== "object") return value;
        const out = {};
        for (const [key, child] of Object.entries(value)) {
          if (VIEWER_EXTENSIONS.has(key)) continue;
          out[key] = stripExt(child);
        }
        return out;
      };

      /** Path keys follow sidebar tree; real URL kept on x-daxta-url-path when remapped. */
      const exportPathFromTree = (urlPath, treeSegments) => {
        const originalParts = urlPath.split("/").filter(Boolean);
        const paramIdx = originalParts.findIndex((part) => String(part).startsWith("{"));
        const tail = paramIdx >= 0 ? originalParts.slice(paramIdx) : [];
        const treeHasParam = treeSegments.some((part) => String(part).startsWith("{"));
        const parts =
          treeSegments.length === 0
            ? originalParts
            : treeHasParam || paramIdx < 0
              ? treeSegments
              : [...treeSegments, ...tail];
        return "/" + parts.join("/");
      };

      const listOperationExamples = (operation) => {
        const byKey = new Map();
        const add = (key, summary) => {
          if (!key || byKey.has(key)) return;
          byKey.set(key, { key, summary: summary || key });
        };
        const reqExamples = operation?.requestBody?.content?.["application/json"]?.examples;
        for (const [key, example] of Object.entries(reqExamples || {})) {
          add(key, example && example.summary);
        }
        for (const response of Object.values(operation?.responses || {})) {
          const examples = response?.content?.["application/json"]?.examples;
          for (const [key, example] of Object.entries(examples || {})) {
            add(key, example && example.summary);
          }
        }
        return [...byKey.values()];
      };

      const filterExamplesMap = (examples, allowedKeys) => {
        if (!examples || typeof examples !== "object") return examples;
        if (!allowedKeys) return examples;
        const out = {};
        for (const [key, value] of Object.entries(examples)) {
          if (allowedKeys.has(key)) out[key] = value;
        }
        return out;
      };

      const filterOperationExamples = (operation, allowedKeys) => {
        if (!allowedKeys) return operation;
        const next = { ...operation };
        if (next.requestBody?.content?.["application/json"]?.examples) {
          const media = { ...next.requestBody.content["application/json"] };
          media.examples = filterExamplesMap(media.examples, allowedKeys);
          next.requestBody = {
            ...next.requestBody,
            content: { ...next.requestBody.content, "application/json": media },
          };
        }
        if (next.responses) {
          const responses = {};
          for (const [status, response] of Object.entries(next.responses)) {
            if (!response?.content?.["application/json"]?.examples) {
              responses[status] = response;
              continue;
            }
            const media = { ...response.content["application/json"] };
            media.examples = filterExamplesMap(media.examples, allowedKeys);
            responses[status] = {
              ...response,
              content: { ...response.content, "application/json": media },
            };
          }
          next.responses = responses;
        }
        return next;
      };

      /** Rename example map keys to scenario titles; set summary+description (Postman-friendly). */
      const promoteExampleLabels = (examples) => {
        if (!examples || typeof examples !== "object") return examples;
        const out = {};
        for (const [key, example] of Object.entries(examples)) {
          if (!example || typeof example !== "object") continue;
          const summary = String(example.summary || example.description || key).trim() || key;
          let name = summary;
          let n = 2;
          while (Object.prototype.hasOwnProperty.call(out, name)) {
            name = summary + " (" + n + ")";
            n += 1;
          }
          out[name] = {
            summary,
            description: summary,
            value: example.value,
          };
        }
        return out;
      };

      const promoteOperationExampleLabels = (operation) => {
        const next = { ...operation };
        if (next.requestBody?.content?.["application/json"]?.examples) {
          const media = { ...next.requestBody.content["application/json"] };
          media.examples = promoteExampleLabels(media.examples);
          next.requestBody = {
            ...next.requestBody,
            content: { ...next.requestBody.content, "application/json": media },
          };
        }
        if (next.responses) {
          const responses = {};
          for (const [status, response] of Object.entries(next.responses)) {
            const examples = response?.content?.["application/json"]?.examples;
            if (!examples) {
              responses[status] = response;
              continue;
            }
            const media = { ...response.content["application/json"] };
            media.examples = promoteExampleLabels(examples);
            const labels = Object.keys(media.examples);
            responses[status] = {
              ...response,
              // Single example: description becomes the scenario title (Postman uses this as the example name).
              description: labels.length === 1 ? labels[0] : response.description || status,
              content: { ...response.content, "application/json": media },
            };
          }
          next.responses = responses;
        }
        return next;
      };

      const toExportSpec = (source, selectedByOpId) => {
        const pathsIn = source.paths || {};
        const pathsOut = {};
        const tagNames = new Set();

        for (const [urlPath, pathItem] of Object.entries(pathsIn)) {
          if (!pathItem || typeof pathItem !== "object") continue;

          let treeSegments = null;
          for (const [method, operation] of Object.entries(pathItem)) {
            if (!HTTP_EXPORT.includes(method) || !operation || typeof operation !== "object") continue;
            treeSegments = operation["x-tree-segments"] || urlPath.split("/").filter(Boolean);
            break;
          }
          if (!treeSegments) treeSegments = urlPath.split("/").filter(Boolean);

          const exportPath = exportPathFromTree(urlPath, treeSegments);
          const itemOut = { ...(pathsOut[exportPath] || {}) };

          for (const [method, operation] of Object.entries(pathItem)) {
            if (!HTTP_EXPORT.includes(method) || !operation || typeof operation !== "object") {
              if (!HTTP_EXPORT.includes(method) && itemOut[method] === undefined) {
                itemOut[method] = stripExt(operation);
              }
              continue;
            }
            const segments = operation["x-tree-segments"] || urlPath.split("/").filter(Boolean);
            let cleaned = stripExt(operation);
            const opId = method + ":" + urlPath;
            if (selectedByOpId && selectedByOpId.has(opId)) {
              cleaned = filterOperationExamples(cleaned, selectedByOpId.get(opId));
            }
            cleaned = promoteOperationExampleLabels(cleaned);
            const tagParts = segments.filter((part) => !String(part).startsWith("{"));
            const tag = tagParts.length ? tagParts.join(" / ") : "API";
            cleaned.tags = [tag];
            cleaned["x-tree-segments"] = segments;
            tagNames.add(tag);
            if (exportPath !== urlPath) cleaned["x-daxta-url-path"] = urlPath;
            itemOut[method] = cleaned;
          }
          pathsOut[exportPath] = itemOut;
        }

        const ordered = {};
        for (const key of Object.keys(pathsOut).sort((a, b) => a.localeCompare(b))) ordered[key] = pathsOut[key];

        return {
          openapi: source.openapi || "3.0.3",
          info: stripExt(source.info) || { title: title, version: "0.0.0" },
          ...(source.servers ? { servers: stripExt(source.servers) } : {}),
          tags: [...tagNames].sort((a, b) => a.localeCompare(b)).map((name) => ({ name })),
          paths: ordered,
          ...(source.components ? { components: stripExt(source.components) } : {}),
        };
      };

      const headerRowsForExport = () => {
        const env = activeEnvConfig();
        const groups = env.headerGroups || {};
        return groups[store.activeGroup] || groups[Object.keys(groups)[0]] || [];
      };

      const buildPostmanEnvironment = () => {
        const env = activeEnvConfig();
        const values = (env.variables || [])
          .filter((row) => row.key)
          .map((row) => ({
            key: row.key,
            value: String(row.value ?? ""),
            type: "default",
            enabled: true,
          }));
        // Ensure header template vars referenced as {{x}} appear even if missing from variables list.
        const known = new Set(values.map((row) => row.key));
        const baseKey = baseUrlKeyOf(env);
        if (!known.has(baseKey)) {
          known.add(baseKey);
          values.unshift({
            key: baseKey,
            value: String(presetBaseUrl(store.activeEnv) || defaultBaseUrl || ""),
            type: "default",
            enabled: true,
          });
        }
        for (const row of headerRowsForExport()) {
          const text = String(row.value || "");
          const matches = text.matchAll(/\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/g);
          for (const match of matches) {
            if (known.has(match[1])) continue;
            known.add(match[1]);
            values.push({ key: match[1], value: "", type: "default", enabled: true });
          }
        }
        return {
          id: typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
          name: (workspace || title || "API") + " · " + store.activeEnv,
          values,
          _postman_variable_scope: "environment",
          _postman_exported_at: new Date().toISOString(),
          _postman_exported_using: "DAxTA",
        };
      };

      const STATUS_EXPORT = {
        200: "OK",
        201: "Created",
        204: "No Content",
        400: "Bad Request",
        401: "Unauthorized",
        403: "Forbidden",
        404: "Not Found",
        409: "Conflict",
        422: "Unprocessable Entity",
        500: "Internal Server Error",
      };

      const postmanUrlFromPath = (serverUrl, pathTemplate) => {
        const base = String(serverUrl || "{{baseUrl}}").replace(/\/$/, "");
        const path = String(pathTemplate || "/");
        const segments = path.split("/").filter(Boolean);
        const pathParams = [...path.matchAll(/\{([^}]+)\}/g)].map((m) => m[1]);
        return {
          raw: base + (path.startsWith("/") ? path : "/" + path),
          host: base.startsWith("{{") ? [base] : [base.replace(/^https?:\/\//, "").split("/")[0]],
